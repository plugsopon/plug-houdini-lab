<title>Houdini Snippet Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* One deliberate look: black workspace of dockable panes (Dremzo / Houdini style). */
:root{
  color-scheme:dark;
  --bg:#000000; --card:#0B0D10; --raise:#12161A; --field:#0E1115;
  --line:#1C2127; --line-2:#2A3139; --ink:#E6EAEE; --ink-2:#9AA5B0; --ink-3:#66717C;
  --accent:#6EA6EC; --accent-2:#4F86CF; --pink:#F32285;
  --warn:#E3806D; --ok:#6CC08F; --code-bg:#101418; --code-ink:#D9E0E7;
  --f-ui:"Sora","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13.5px/1.55 var(--f-ui);padding-inline:16px;padding-block:12px;margin:0;display:flex;flex-direction:column;gap:10px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font:600 15px/1.2 var(--f-ui);margin:0}
.top .grow{flex:1}
.search{width:240px;max-width:100%;height:30px;border-radius:15px;background:var(--raise);border:1px solid var(--line-2);color:var(--ink);padding:0 14px;font:12.5px var(--f-ui)}
.search::placeholder{color:var(--ink-3)}
.count{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line-2);background:var(--raise);border-radius:8px;padding:5px 11px;font:500 12.5px var(--f-ui);display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--ink-3)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn.primary:hover{background:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.small{padding:3px 9px;font-size:12px}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- pane workspace ---------- */
#desk{flex:1;min-height:560px;position:relative;display:flex}
.split{display:flex;flex:1;min-width:0;min-height:0}
.split.sp-col{flex-direction:column}
.slot{display:flex;min-width:0;min-height:0}
.divider{flex:none;position:relative;z-index:2}
.split.sp-row>.divider{width:8px;cursor:col-resize}
.split.sp-col>.divider{height:8px;cursor:row-resize}
.divider::after{content:"";position:absolute;background:transparent;border-radius:2px;transition:background .12s}
.split.sp-row>.divider::after{top:30%;bottom:30%;left:3px;width:2px}
.split.sp-col>.divider::after{left:30%;right:30%;top:3px;height:2px}
.divider:hover::after,.divider.drag::after{background:var(--ink-3)}
.pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pane.dragging{opacity:.35}
.phead{height:32px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;border-bottom:1px solid var(--line)}
.grip{width:22px;height:22px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);cursor:grab;touch-action:none}
.grip:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.grip:active{cursor:grabbing}
.kind{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--ink-2);font:600 10.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;padding:4px 7px 4px 6px;border-radius:7px}
.kind:hover,.kind[aria-expanded="true"]{background:rgba(255,255,255,.06);color:var(--ink)}
.chev{width:12px;height:12px;flex:none;color:var(--ink-3);transition:transform .2s}
[aria-expanded="true"]>.chev{transform:rotate(180deg)}
.pselect{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:120px;height:30px;justify-self:start;border:1px solid rgba(63,63,70,.6);background:rgba(24,24,27,.8);color:#f4f4f5;border-radius:8px;padding:0 10px;font:12.5px var(--f-ui);transition:border-color .15s,box-shadow .15s}
.pselect:hover{border-color:#52525b}
.pselect[aria-expanded="true"]{border-color:rgba(243,34,133,.7);box-shadow:0 0 0 2px rgba(243,34,133,.2)}
.dd-back{position:fixed;inset:0;z-index:60}
.dd-menu{position:fixed;z-index:61;background:#18181b;border-radius:16px;box-shadow:0 0 0 1px #27272a,0 20px 25px -5px rgba(0,0,0,.5),0 8px 10px -6px rgba(0,0,0,.5);padding:4px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.dd-row{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:#e4e4e7;text-align:left;font:12.5px var(--f-ui);padding:7px 10px;border-radius:10px;cursor:pointer}
.dd-row:hover,.dd-row.hot{background:#27272a}
.dd-row[aria-selected="true"]{background:var(--pink);color:#fff}
.dd-row span{flex:1;min-width:0}
.dd-row svg{width:14px;height:14px;flex:none}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.phead .sp{flex:1}
.pbtns{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.pane:hover .pbtns,.pane:focus-within .pbtns{opacity:1}
.pbtn{width:24px;height:24px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;color:var(--ink-3)}
.pbtn:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.pbody{flex:1;min-height:0;overflow:auto;position:relative}
.guide{position:fixed;z-index:50;pointer-events:none;border:1.5px solid var(--pink);background:rgba(243,34,133,.14);border-radius:12px;transition:all .06s}
.chip{position:fixed;z-index:51;pointer-events:none;border:1px solid var(--pink);background:#1A0B13;color:#fff;border-radius:8px;padding:4px 10px;font:600 10.5px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;transform:translate(12px,12px)}
@media (prefers-reduced-motion:reduce){.pbtns,.divider::after,.guide{transition:none}}
@media (max-width:760px){#desk{min-height:900px}}

/* ---------- pane bodies ---------- */
.empty{color:var(--ink-3);padding:18px 14px;font-size:12.5px}
/* categories */
.cats{padding:8px;display:flex;flex-direction:column;gap:2px}
.cat{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px 7px 14px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font:500 13px var(--f-ui);text-align:left}
.cat:hover{background:rgba(255,255,255,.04);color:var(--ink)}
.cat[aria-current="true"]{color:#fff}
.cat[aria-current="true"]::before{content:"";position:absolute;left:2px;top:50%;transform:translateY(-50%);height:18px;width:2px;border-radius:2px;background:var(--pink)}
.cat .ic{width:18px;height:18px;flex:none;border-radius:5px;display:grid;place-items:center;font:600 10px var(--f-ui);color:#fff;background:#232A31}
.cat .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .n{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
/* technique cards */
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,124px));grid-auto-rows:92px;grid-auto-flow:dense;gap:10px;padding:12px;justify-content:start}
.tcard{position:relative;display:block;width:100%;height:100%;border-radius:14px;overflow:hidden;border:0;padding:0;background:#0C0F12;box-shadow:0 0 0 1px var(--line-2);text-align:left;transition:box-shadow .12s}
.tcard.w{grid-column:span 2}.tcard.h{grid-row:span 2}
.tcard:hover{box-shadow:0 0 0 2px #3C4652}
.tcard[aria-current="true"]{box-shadow:0 0 0 2px var(--pink)}
.tcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tcard .ph{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:22px;font:700 17px var(--f-ui);color:rgba(255,255,255,.88);letter-spacing:.05em;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.2px),linear-gradient(150deg,var(--tc) -50%,#0C0F12 75%);background-size:12px 12px,100% 100%}
.tcard.w.h .ph{font-size:24px}
.tcard .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 9px 8px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.88) 55%);display:flex;flex-direction:column;gap:2px}
.tcard .cap b{font:600 11.5px/1.25 var(--f-ui);color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard .cap span{font:10.5px/1.3 var(--f-ui);color:#AEB8C2;display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
.tcard .cap i{width:6px;height:6px;border-radius:50%;background:var(--tc);flex:none}
/* network view */
.canvas{min-height:100%;background-image:radial-gradient(#20262C 1.1px,transparent 1.2px);background-size:22px 22px;padding:16px;display:flex;flex-wrap:wrap;gap:18px;align-content:flex-start}
.netbox{border:1px solid var(--line);background:rgba(255,255,255,.022);border-radius:12px;padding:9px 14px 14px;display:flex;flex-direction:column;gap:9px;max-width:100%}
.netbox h3{margin:0;font:500 12px var(--f-ui);color:var(--ink-3)}
.nrow{display:flex;align-items:center;flex-wrap:wrap;row-gap:6px}
.node{height:34px;border-radius:17px;background:var(--raise);border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:9px;padding:0 14px 0 5px;font:500 13px var(--f-ui);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.node:hover{border-color:#3C4652}
.node i{width:23px;height:23px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 8.5px var(--f-ui);font-style:normal;background:var(--tc,#4F86CF)}
.node small{color:var(--ink-3);font-size:11px}
.node[aria-current="true"]{border:1.5px solid var(--pink);box-shadow:0 0 0 4px rgba(243,34,133,.14)}
.vers{display:flex;align-items:center;gap:5px;position:relative;padding-left:28px}
.vers::before{content:"";position:absolute;left:0;top:50%;width:22px;border-top:1.5px solid #39434E}
.ver{height:24px;border-radius:12px;min-width:46px;padding:0 9px;background:var(--raise);border:1px solid var(--line-2);font:500 11px var(--f-ui);color:var(--ink-2)}
.ver[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
/* parameters */
.parms{padding:12px 14px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:7px 12px;align-items:center}
.parms label{text-align:right;color:var(--ink-3);font-size:12px}
.parms .v{min-height:28px;border:1px solid var(--line-2);background:var(--field);border-radius:7px;padding:4px 10px;font-size:12.5px;display:flex;align-items:center;overflow-wrap:anywhere}
.parms select{height:28px;border:1px solid var(--line-2);background:var(--field);color:var(--ink);border-radius:7px;padding:0 8px;font:12.5px var(--f-ui);width:auto;min-width:110px;justify-self:start}
.parms .full{grid-column:1/-1}
.ptitle{grid-column:1/-1;font:600 16px/1.3 var(--f-ui);margin:0 0 2px}
.confirm{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(227,128,109,.08);border:1px solid rgba(227,128,109,.35);border-radius:9px;padding:8px 10px;font-size:12.5px}
/* preview + notes */
.preview{padding:10px;min-height:100%;display:flex}
.preview>*{margin:auto}
.preview img{display:block;max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
.preview .visual{width:100%}
.notes{padding:12px 14px;margin:0;white-space:pre-wrap;color:#B7C0C9;font-size:12.5px;line-height:1.65}
/* code */
.ftabs{display:flex;gap:2px;flex-wrap:wrap;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.ftab{border:1px solid transparent;border-bottom:0;background:transparent;border-radius:7px 7px 0 0;padding:5px 10px;font:500 12px var(--f-ui);color:var(--ink-3);margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.ftab em{font-style:normal;font-size:10.5px;color:var(--ink-3)}
.ftab[aria-selected="true"]{background:var(--code-bg);border-color:var(--line);color:#fff}
.fbody{padding:10px 12px 14px;display:flex;flex-direction:column;gap:9px}
.fmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--ink-3)}
.fdesc{margin:0;font-size:12.5px;color:#C3CBD3;white-space:pre-wrap}
.fnotes{margin:0;font-size:12px;color:var(--ink-2);white-space:pre-wrap;border-left:2px solid var(--line-2);padding-left:10px}
.codebox{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.codebar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);font:11.5px var(--f-code);color:var(--ink-3)}
.codebar .btn.done{color:var(--ok);border-color:#2C5A40}
pre{margin:0;overflow:auto;padding:12px 14px}
pre code{font:12px/1.6 var(--f-code);color:var(--code-ink);white-space:pre;tab-size:4}
.hljs-comment{color:#667380;font-style:italic}.hljs-keyword,.hljs-built_in{color:#E3A06A}.hljs-string{color:#A8C98A}
.hljs-number,.hljs-literal{color:#D6A2D8}.hljs-title,.hljs-title.function_{color:#8DBBF2}.hljs-type{color:#E6CB7A}.hljs-meta{color:#94A1AD}
/* diagrams */
.visual{margin:0;display:flex;flex-direction:column;gap:8px}
.visual .scroll{overflow-x:auto}
.visual svg{display:block;width:100%;height:auto}
.fbody .visual{border:1px solid var(--line);border-radius:10px;padding:10px}
.fbody .visual svg{min-width:520px}
.visual figcaption{font-size:11.5px;color:var(--ink-3)}
.visual svg text{font-family:var(--f-code);fill:var(--ink)}
.visual svg .sub{fill:var(--ink-3);font-size:10px}
.visual svg .lbl{fill:var(--ink-2);font-size:11px}
.visual svg .node rect{fill:var(--raise);stroke:var(--line-2);stroke-width:1.2}
.visual svg .node.key rect{fill:rgba(110,166,236,.14);stroke:var(--accent);stroke-width:1.6}
.visual svg .node.io rect{fill:rgba(146,119,196,.14);stroke:#9277C4}
.visual svg .node .flag{fill:var(--ink-3)}
.visual svg .node.key .flag{fill:var(--accent)}
.visual svg .wire{fill:none;stroke:#3A444F;stroke-width:1.4}
.visual svg .port{fill:var(--card);stroke:var(--ink-3);stroke-width:1.2}
.visual svg .born{fill:var(--ink-2)}
.visual svg .unborn{fill:var(--card);stroke:var(--ink-3);stroke-width:1.3}
.visual svg .hot{fill:var(--accent)}
.visual svg .target{fill:var(--card);stroke:#F5D76E;stroke-width:2.2}
.visual svg .radius{fill:rgba(110,166,236,.08);stroke:var(--accent);stroke-dasharray:4 4;stroke-width:1.2}
.visual svg .pull{stroke:#F5D76E;stroke-width:1.3;stroke-dasharray:3 3;fill:none}
.visual svg .frame{fill:none;stroke:var(--line-2)}
.visual svg .emit{fill:rgba(146,119,196,.2);stroke:#9277C4}
.mask{border-collapse:collapse;font:12px var(--f-code);font-variant-numeric:tabular-nums;min-width:480px}
.mask th{font-weight:500;color:var(--ink-3);text-align:left;padding:5px 12px 5px 0;white-space:nowrap}
.mask td{text-align:center;padding:5px 0;width:40px;border-left:1px solid var(--line)}
.mask td.y{color:var(--ok)}.mask td.n{color:var(--ink-3)}
.mask td.gone{color:var(--warn);text-decoration:line-through}
.mask tr.hl td,.mask tr.hl th{background:rgba(110,166,236,.14)}
/* editor */
#main{padding:6px 0 40px;overflow:auto}
form.editor{display:flex;flex-direction:column;gap:14px;max-width:1100px}
form.editor .dhead h2{margin:0;font:600 19px var(--f-ui)}
form.editor .card,.ecard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.ecard h3,form.editor .card h3{margin:0;font:600 13.5px var(--f-ui)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
form.editor label{display:flex;flex-direction:column;gap:5px;font:500 12px var(--f-ui);color:var(--ink-2)}
form.editor input,form.editor select,form.editor textarea{font:13px var(--f-ui);color:var(--ink);background:var(--field);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
textarea.code{font:12.5px/1.55 var(--f-code)!important;min-height:220px;white-space:pre;tab-size:4}
.drop{border:1px dashed var(--line-2);border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.drop img{max-height:120px;width:auto;border-radius:6px}
.formbar{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center;position:sticky;bottom:0;background:var(--bg);padding-block:10px;border-top:1px solid var(--line)}
.status{font-size:12px;color:var(--ink-3)}
.status.err{color:var(--warn)}
</style>

<header class="top">
  <h1>Houdini Snippet Shelf</h1>
  <span class="grow"></span>
  <input class="search" id="q" type="search" placeholder="Search name, notes, code…" aria-label="Search techniques">
  <span class="count" id="count"></span>
  <button class="btn" id="resetLayout" type="button" title="Put the panes back to the default layout">Reset layout</button>
  <button class="btn primary" id="newTech" type="button" hidden>+ New technique</button>
</header>
<div id="desk"></div>

<script id="lib-data" type="application/json">{"techniques": [{"id": "unborn-follow-live", "name": "Unborn particles → follow live", "category": "Particles", "type": "Sop", "author": "Plug", "versions": [{"v": "v001", "date": "2026-09-25", "notes": "ปัญหา: เอาเฟรมสุดท้ายของ POP sim มาเป็นพอยต์ชุดคงที่ แล้ว copy P จากซิมตาม id ตัวที่ยังไม่เกิดหา id ตัวเองไม่เจอ เลยลอยค้างอยู่กลางอากาศ\n\nวิธีแก้: ให้ตัวที่ยังไม่เกิดไปเอาตำแหน่งปัจจุบันของเพื่อนที่เกิดแล้วซึ่งอยู่ใกล้ในท่า rest (เฉลี่ยแบบ Gaussian + emitter เป็นตัวถ่วง) แล้ว blend เข้าซิมจริงตอนเกิด ใช้ขับ Point Deform ได้\n\nเริ่มจาก build_follow_live_v2.py (BUILD_DEMO = True ใช้กับ geo ว่างได้เลย)\nทดสอบกับ H21.0.671 · ยังไม่ได้ลองกับ 20.5", "previewImage": "", "previewVisual": "follow-concept", "files": [{"id": "follow-rig", "title": "Follow-live rig builder (unborn particles)", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671", "filename": "build_follow_live_v2.py", "description": "สร้าง rig ทั้งชุดให้พอยต์ที่ยังไม่เกิด (ยังไม่มี id ในซิม) ไปเอาตำแหน่งปัจจุบันของพาร์ติเคิลที่มีชีวิตซึ่งอยู่ใกล้มันที่สุดในเลย์เอาต์ของเฟรม rest แล้วค่อยๆ blend เข้าตำแหน่งซิมจริงตอนเกิด ใช้ขับ Point Deform ได้โดยไม่กระตุก\n\nBUILD_DEMO = True จะสร้าง grid → anim → POP sim ให้ใน geo ว่างๆ ถ้าตั้งเป็น False จะ rig scene ของพี่เอง (ตั้ง path ใน CONFIG หรือเลือก sim node ก่อนรัน)", "notes": "รัน paste ทั้งก้อนใน Windows → Python Shell · ผลลัพธ์อยู่ที่ OUT_follow_live (lattice) และ OUT_follow_deform · Max Neighbours: 256 นิ่งกว่า, 64 = default, 32 เร็วกว่า (วัดที่ 200k พาร์ติเคิล: ~470 / ~145 / ~95 ms ต่อเฟรม) · ทดสอบกับ H21 เท่านั้น ยังไม่ได้ลองกับ 20.5", "code": "# ============================================================================\n# Unborn-particle \"follow live neighbours\" rig  (paste into Houdini Python Shell)\n#\n# Problem: you take the LAST frame of a POP sim as a fixed point set and copy P\n# from the live sim by id. Points whose id is not born yet have nothing to copy\n# and hang in space. This rig moves every not-yet-born point to a smooth\n# weighted average of the CURRENT positions of live particles that sit closest\n# to it in the rest layout, so the lattice is deform-safe (Point Deform).\n#\n# HOW TO USE\n#   1. Set BUILD_DEMO / the paths in CONFIG below.\n#   2. Paste the whole thing into Windows > Python Shell and press Enter.\n#   It creates new nodes next to SIM_NODE; it never edits your existing nodes.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\n# BUILD_DEMO = True  -> builds a test scene (grid -> anim -> POP sim) inside\n#                       DEMO_PARENT and rigs it. Good for an empty geo node.\n# BUILD_DEMO = False -> rigs YOUR scene: set the paths below. If SIM_NODE is\n#                       left \"\" the first SELECTED node is used.\nBUILD_DEMO   = True\nDEMO_PARENT  = \"/obj/geo1\"\n\nSIM_NODE     = \"\"   # live sim particles, every frame (needs i@id, f@age)\nEMITTER_NODE = \"\"   # emitter in the SAME space as SIM_NODE (\"\" = none)\nDEFORM_NODE  = \"\"   # geometry to deform, in REST pose (\"\" = auto scatter demo / skip)\nREST_FRAME   = 240  # frame whose particle layout is the rest shape\n# ----------------------------------------------------------------------------\n\n\ndef build_demo(parent_path):\n    \"\"\"grid -> anim (rises, tiny) -> popnet (source + wind). Returns (sim, emitter).\"\"\"\n    geo = hou.node(parent_path)\n    if geo is None:\n        geo = hou.node(\"/obj\").createNode(\"geo\", parent_path.rsplit(\"/\", 1)[-1])\n    grid = geo.createNode(\"grid\", \"demo_grid\")\n    anim = geo.createNode(\"xform\", \"demo_anim\")\n    anim.setInput(0, grid)\n    anim.parm(\"scale\").set(0.03)\n    ty = anim.parm(\"ty\")\n    for fr, v in ((1, 0.0), (240, 3.3)):\n        k = hou.Keyframe(); k.setFrame(fr); k.setValue(v); k.setExpression(\"linear()\")\n        ty.setKeyframe(k)\n    dop = geo.createNode(\"dopnet\", \"demo_popnet\")\n    dop.setInput(0, anim)\n    dop.parm(\"objname1\").set(\"*\") if dop.parm(\"objname1\") else None\n    obj = dop.createNode(\"popobject\", \"popobject\")\n    src = dop.createNode(\"popsource\", \"source_first_input\")\n    src.parm(\"usecontextgeo\").set(2)          # first context geometry (the anim input)\n    src.parm(\"constantrate\").set(50)\n    wind = dop.createNode(\"popwind\", \"popwind1\")\n    wind.setInput(0, src)\n    wind.parm(\"windy\").set(1); wind.parm(\"amp\").set(1); wind.parm(\"swirlsize\").set(0.67)\n    merge = dop.createNode(\"merge\", \"wire_pops_into_here\")\n    merge.setInput(0, wind)\n    solver = dop.createNode(\"popsolver\", \"popsolver\")\n    solver.setInput(0, obj); solver.setInput(2, merge)\n    out = dop.createNode(\"output\", \"output\")\n    out.setInput(0, solver)\n    out.setDisplayFlag(True)\n    dop.layoutChildren()\n    geo.layoutChildren()\n    return dop, anim\n\n\nif BUILD_DEMO:\n    sim, emitter = build_demo(DEMO_PARENT)\n    deform_src = None          # a scatter of the rest shape is built below\nelse:\n    sim = hou.node(SIM_NODE) if SIM_NODE else (hou.selectedNodes() or [None])[0]\n    if sim is None:\n        raise hou.Error(\"Set SIM_NODE (or select the sim node) - not found: %r\" % SIM_NODE)\n    emitter = hou.node(EMITTER_NODE) if EMITTER_NODE else None\n    deform_src = hou.node(DEFORM_NODE) if DEFORM_NODE else None\nnet = sim.parent()\nbase = sim.position()\n\n\ndef mk(type_name, name, dx, dy):\n    n = net.createNode(type_name, name)\n    n.setPosition(base + hou.Vector2(dx, dy))\n    return n\n\n\ndef add_float(node, name, label, default, lo, hi):\n    ptg = node.parmTemplateGroup()\n    ptg.append(hou.FloatParmTemplate(name, label, 1, default_value=(default,), min=lo, max=hi))\n    node.setParmTemplateGroup(ptg)\n\n\ndef add_int(node, name, label, default, lo, hi):\n    ptg = node.parmTemplateGroup()\n    ptg.append(hou.IntParmTemplate(name, label, 1, default_value=(default,), min=lo, max=hi))\n    node.setParmTemplateGroup(ptg)\n\n\n# 1) rest layout = sim held at REST_FRAME ------------------------------------\nrest = mk(\"timeshift\", \"follow_rest\", 3, -1)\nrest.setInput(0, sim)\nrest.parm(\"frame\").deleteAllKeyframes()   # default is a $F expression; clear it\nrest.parm(\"frame\").set(REST_FRAME)\n\n# 2) per-frame info on the live sim: where the emitter is right now ----------\ninfo = mk(\"attribwrangle\", \"follow_sim_info\", 6, -1)\ninfo.setInput(0, sim)\nif emitter is not None:\n    info.setInput(1, emitter)\ninfo.parm(\"class\").set(0)  # detail\ninfo.parm(\"snippet\").set(r'''\n// anchor position: emitter centre if one is wired, else the live cloud centre\nv@emitpos = npoints(1) > 0 ? getbbox_center(1) : getbbox_center(0);\n''')\n\n# 3) mark which rest points exist in the live sim this frame -----------------\nmark = mk(\"attribwrangle\", \"follow_mark_born\", 3, -2.5)\nmark.setInput(0, rest)\nmark.setInput(1, sim)\nmark.parm(\"snippet\").set(r'''\nint src = idtopoint(1, i@id);\ni@born  = src >= 0;\ni@srcpt = src;\n''')\n\n# 4) live-only point cloud (rest-layout P) for fast neighbour search ---------\nborn = mk(\"attribwrangle\", \"follow_born_only\", 6, -3.5)\nborn.setInput(0, mark)\nborn.parm(\"snippet\").set('if (!i@born) removepoint(0, @ptnum);')   # no group parsing -> works in any version\n\n# 5) the follow itself --------------------------------------------------------\nfol = mk(\"attribwrangle\", \"follow_live\", 3, -5)\nfol.setInput(0, mark)\nfol.setInput(1, info)   # live sim P / age + detail emitpos\nfol.setInput(2, born)   # live-only cloud\nadd_float(fol, \"blend_time\", \"Blend Time (s)\", 0.5, 0, 5)\nadd_float(fol, \"radius\", \"Closest Radius\", 0.2, 0.001, 3)\nadd_float(fol, \"anchor_weight\", \"Emitter Anchor Weight\", 1.0, 0, 50)\nadd_int(fol, \"max_neighbours\", \"Max Neighbours\", 64, 8, 2048)   # 256 = smoother, 32 = faster\nadd_float(fol, \"rest_frame\", \"Rest Frame\", REST_FRAME, 1, 1000)\nfol.parm(\"rest_frame\").setExpression('ch(\"../%s/frame\")' % rest.name())\nfol.parm(\"snippet\").set(r'''\n// Weighted CURRENT position of live neighbours; closest in the rest layout wins.\n// Gaussian weight (radius = Closest Radius) is \u003c 1e-4 beyond 3*radius, so only\n// that radius is searched: cost ~ N * neighbours, not N * N.\n// A newborn's vote fades in over Blend Time, so nothing jumps.\nfunction vector neighbourPos(vector rest; int selfid; float radius; float fade;\n                             float wa; int maxn; vector anchor) {\n    float h = max(radius, 1e-4);\n    int near[] = pcfind(2, \"P\", rest, 3 * h, maxn);\n    vector sum = 0; float wsum = 0;\n    foreach (int n; near) {\n        if (point(2, \"id\", n) == selfid) continue;\n        int s = point(2, \"srcpt\", n);\n        vector nRest = point(2, \"P\", n);\n        vector nNow  = point(1, \"P\", s);\n        float d = distance(rest, nRest) / h;\n        float w = exp(-d * d);\n        if (fade > 0) w *= smooth(0, 1, point(1, \"age\", s) / fade);\n        sum += nNow * w; wsum += w;\n    }\n    // emitter = constant-vote anchor: dominates while few particles are alive,\n    // gets outvoted naturally as the sim fills up (keeps early frames steady)\n    sum += anchor * wa; wsum += wa;\n    return wsum > 0 ? sum / wsum : rest;\n}\n\nfloat blend   = chf(\"blend_time\");\nvector anchor = detail(1, \"emitpos\");\nvector rest   = v@P;\nvector taken  = neighbourPos(rest, i@id, chf(\"radius\"), blend,\n                             chf(\"anchor_weight\"), chi(\"max_neighbours\"), anchor);\n\nif (i@born) {\n    // ease from the borrowed pose into the real sim so birth never pops ...\n    vector real = point(1, \"P\", i@srcpt);\n    float age = point(1, \"age\", i@srcpt);\n    float t = blend > 0 ? smooth(0, 1, age / blend) : 1;\n    // ... and be fully on the sim by the rest frame, so the deform matches rest\n    float restT = (chf(\"rest_frame\") - 1) * @TimeInc;   // time = (frame-1)/fps\n    if (blend > 0) t = max(t, smooth(restT - blend, restT, @Time));\n    v@P = lerp(taken, real, t);\n} else {\n    v@P = taken;\n}\n''')\n\nout = mk(\"null\", \"OUT_follow_live\", 3, -6.2)\nout.setInput(0, fol)\ncreated = [rest, info, mark, born, fol, out]\n\nif BUILD_DEMO:\n    con = mk(\"connectadjacentpieces\", \"demo_connect\", -3, -2.5)\n    con.setInput(0, rest)\n    con.parm(\"connecttype\").set(2); con.parm(\"maxsearchpoints\").set(28)\n    sc = mk(\"scatter\", \"demo_scatter\", -3, -3.7)\n    sc.setInput(0, con)\n    sc.parm(\"npts\").set(100000)\n    deform_src = mk(\"null\", \"demo_rest_geo\", -3, -4.9)\n    deform_src.setInput(0, sc)\n    created += [con, sc, deform_src]\n\n# 6) optional: Point Deform the rest geometry with the lattice ----------------\nif deform_src is not None:\n    pd = mk(\"pointdeform\", \"follow_pointdeform\", 0, -7.4)\n    pd.setInput(0, deform_src)\n    pd.setInput(1, rest)\n    pd.setInput(2, out)\n    out_d = mk(\"null\", \"OUT_follow_deform\", 0, -8.6)\n    out_d.setInput(0, pd)\n    out_d.setDisplayFlag(True)\n    out_d.setRenderFlag(True)\n    created += [pd, out_d]\nelse:\n    out.setDisplayFlag(True)\n    out.setRenderFlag(True)\n\nprint(\"follow rig built: \" + \", \".join(n.name() for n in created))\n", "visual": "rig-graph"}, {"id": "follow-live-vex", "title": "follow_live — closest live position", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "follow_live.vfl", "description": "หัวใจของ rig: ตำแหน่งปัจจุบันเฉลี่ยแบบ Gaussian ของพาร์ติเคิลที่มีชีวิตใกล้ๆ ในเลย์เอาต์ rest + emitter เป็นตัวถ่วงช่วงต้นซีน + blend เข้าซิมจริงหลังเกิด และบังคับให้ blend ครบภายในเฟรม rest", "notes": "Inputs: 0 = rest points ที่มี i@born, i@srcpt · 1 = live sim ที่มี detail v@emitpos · 2 = live-only cloud\nSpare parms ที่ต้องสร้าง: blend_time, radius, anchor_weight, max_neighbours (int), rest_frame\nอย่าใช้ ch(\"../node/parm\") ใน VEX เพื่ออ่านค่าจาก node อื่น เพราะ path จะหาไม่เจอแล้วได้ 0 ให้ link ผ่าน spare parm แทน", "code": "// Weighted CURRENT position of live neighbours; closest in the rest layout wins.\n// Gaussian weight (radius = Closest Radius) is \u003c 1e-4 beyond 3*radius, so only\n// that radius is searched: cost ~ N * neighbours, not N * N.\n// A newborn's vote fades in over Blend Time, so nothing jumps.\nfunction vector neighbourPos(vector rest; int selfid; float radius; float fade;\n                             float wa; int maxn; vector anchor) {\n    float h = max(radius, 1e-4);\n    int near[] = pcfind(2, \"P\", rest, 3 * h, maxn);\n    vector sum = 0; float wsum = 0;\n    foreach (int n; near) {\n        if (point(2, \"id\", n) == selfid) continue;\n        int s = point(2, \"srcpt\", n);\n        vector nRest = point(2, \"P\", n);\n        vector nNow  = point(1, \"P\", s);\n        float d = distance(rest, nRest) / h;\n        float w = exp(-d * d);\n        if (fade > 0) w *= smooth(0, 1, point(1, \"age\", s) / fade);\n        sum += nNow * w; wsum += w;\n    }\n    // emitter = constant-vote anchor: dominates while few particles are alive,\n    // gets outvoted naturally as the sim fills up (keeps early frames steady)\n    sum += anchor * wa; wsum += wa;\n    return wsum > 0 ? sum / wsum : rest;\n}\n\nfloat blend   = chf(\"blend_time\");\nvector anchor = detail(1, \"emitpos\");\nvector rest   = v@P;\nvector taken  = neighbourPos(rest, i@id, chf(\"radius\"), blend,\n                             chf(\"anchor_weight\"), chi(\"max_neighbours\"), anchor);\n\nif (i@born) {\n    // ease from the borrowed pose into the real sim so birth never pops ...\n    vector real = point(1, \"P\", i@srcpt);\n    float age = point(1, \"age\", i@srcpt);\n    float t = blend > 0 ? smooth(0, 1, age / blend) : 1;\n    // ... and be fully on the sim by the rest frame, so the deform matches rest\n    float restT = (chf(\"rest_frame\") - 1) * @TimeInc;   // time = (frame-1)/fps\n    if (blend > 0) t = max(t, smooth(restT - blend, restT, @Time));\n    v@P = lerp(taken, real, t);\n} else {\n    v@P = taken;\n}\n", "visual": "follow-concept"}, {"id": "mark-born-vex", "title": "mark_born — does this id exist yet?", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "mark_born.vfl", "description": "ต่อ input 0 = ท่า rest (timeshift ไปที่เฟรมสุดท้าย) และ input 1 = live sim แล้วจะเขียน i@born กับ i@srcpt (index ของพอยต์นั้นในซิมตอนนี้ ถ้ายังไม่เกิดจะเป็น -1)", "notes": "idtopoint() ต้องใช้ i@id ที่ไม่ซ้ำกัน ซึ่ง POP สร้างให้อยู่แล้ว", "code": "int src = idtopoint(1, i@id);\ni@born  = src >= 0;\ni@srcpt = src;\n", "visual": "born-mask"}, {"id": "born-only-vex", "title": "born_only — keep live points only", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "born_only.vfl", "description": "ลบพอยต์ที่ยังไม่เกิดทิ้ง ใช้แทน Blast @born==0 เพราะไม่ต้องพึ่งการอ่าน group จึงใช้ได้ทุกเวอร์ชัน", "notes": "", "code": "if (!i@born) removepoint(0, @ptnum);\n", "visual": "born-only"}, {"id": "patch-born-only", "title": "Patch: follow_born_only Blast → wrangle", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671", "filename": "patch_born.py", "description": "แก้ rig ที่สร้างไปแล้ว: เปลี่ยน follow_born_only จาก Blast (group @born==0) เป็น wrangle ที่ลบพอยต์ตรงๆ แล้วต่อสายเดิมให้", "notes": "ใช้เมื่อขึ้นว่าหา attribute born ไม่เจอ (เดาว่า Blast ใน 20.5 อ่าน @born==0 เป็น prim group) · ตัว v2 ใช้ wrangle อยู่แล้ว ไม่ต้อง patch ซ้ำ", "code": "# ---- patch: replace follow_born_only (Blast) with a wrangle ----------------\nimport hou\nold = [n for n in hou.node(\"/obj\").allSubChildren() if n.name() == \"follow_born_only\"]\nif not old:\n    raise hou.Error(\"follow_born_only not found - run the rig script first\")\nfor b in old:\n    net = b.parent()\n    src = b.inputs()[0]\n    w = net.createNode(\"attribwrangle\", \"follow_born_only_w\")\n    w.setPosition(b.position())\n    w.setInput(0, src)\n    w.parm(\"snippet\").set('if (!i@born) removepoint(0, @ptnum);')\n    for con in b.outputConnections():\n        con.outputNode().setInput(con.inputIndex(), w)\n    b.destroy()\n    w.setName(\"follow_born_only\")\n    print(\"patched\", w.path())\n", "visual": "patch-swap"}]}, {"v": "v002", "date": "2026-09-25", "notes": "v002: สคริปต์ Python ทุกตัวติดตั้งลง network ที่ Network Editor เปิดอยู่ แบบเดียวกับ FX Template\n• rig builder: เปิด Geometry network แล้วรัน = สร้างตรงนั้น · เปิด /obj แล้วรัน = สร้าง geo \"follow_demo\" ใหม่ให้ · โหมด BUILD_DEMO = False หาชื่อ node ใน network ที่เปิดอยู่ก่อน (ใส่ path เต็มก็ได้) · ไม่ย้าย node เดิมของพี่\n• patch: หา Blast follow_born_only เฉพาะใน network ที่เปิดอยู่และข้างใน\n• ตั้ง TARGET เป็น path ได้ถ้าจะบังคับที่ติดตั้ง\n\nปัญหา: เอาเฟรมสุดท้ายของ POP sim มาเป็นพอยต์ชุดคงที่ แล้ว copy P จากซิมตาม id ตัวที่ยังไม่เกิดหา id ตัวเองไม่เจอ เลยลอยค้างอยู่กลางอากาศ\n\nวิธีแก้: ให้ตัวที่ยังไม่เกิดไปเอาตำแหน่งปัจจุบันของเพื่อนที่เกิดแล้วซึ่งอยู่ใกล้ในท่า rest (เฉลี่ยแบบ Gaussian + emitter เป็นตัวถ่วง) แล้ว blend เข้าซิมจริงตอนเกิด ใช้ขับ Point Deform ได้\n\nเริ่มจาก build_follow_live_v2.py (BUILD_DEMO = True ใช้กับ geo ว่างได้เลย)\nทดสอบกับ H21.0.671 · ยังไม่ได้ลองกับ 20.5", "previewImage": "", "previewVisual": "follow-concept", "files": [{"id": "follow-rig", "title": "Follow-live rig builder (unborn particles)", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · current-network tests", "filename": "build_follow_live_v3.py", "description": "สร้าง rig ทั้งชุดให้พอยต์ที่ยังไม่เกิด (ยังไม่มี id ในซิม) ไปเอาตำแหน่งปัจจุบันของพาร์ติเคิลที่มีชีวิตซึ่งอยู่ใกล้มันที่สุดในเลย์เอาต์ของเฟรม rest แล้วค่อยๆ blend เข้าตำแหน่งซิมจริงตอนเกิด ใช้ขับ Point Deform ได้โดยไม่กระตุก\n\nติดตั้งลง network ที่ Network Editor เปิดอยู่: ถ้าเปิด Geometry network จะสร้างตรงนั้น ถ้าเปิด /obj จะสร้าง geo ใหม่ชื่อ follow_demo\nBUILD_DEMO = True จะสร้าง grid → anim → POP sim เป็นตัวอย่าง ถ้าตั้งเป็น False จะ rig scene ของพี่เอง ใส่แค่ชื่อ node ใน network ที่เปิดอยู่ก็พอ หรือเลือก sim node ก่อนรัน", "notes": "รัน paste ทั้งก้อนใน Windows → Python Shell · ผลลัพธ์อยู่ที่ OUT_follow_live (lattice) และ OUT_follow_deform · Max Neighbours: 256 นิ่งกว่า, 64 = default, 32 เร็วกว่า (วัดที่ 200k พาร์ติเคิล: ~470 / ~145 / ~95 ms ต่อเฟรม) · ทดสอบกับ H21 เท่านั้น ยังไม่ได้ลองกับ 20.5", "code": "# ============================================================================\n# Unborn-particle \"follow live neighbours\" rig  (paste into Houdini Python Shell)\n#\n# Problem: you take the LAST frame of a POP sim as a fixed point set and copy P\n# from the live sim by id. Points whose id is not born yet have nothing to copy\n# and hang in space. This rig moves every not-yet-born point to a smooth\n# weighted average of the CURRENT positions of live particles that sit closest\n# to it in the rest layout, so the lattice is deform-safe (Point Deform).\n#\n# HOW TO USE\n#   1. Open the network you want in the Network Editor:\n#        - a Geometry (SOP) network -> the rig is built right there\n#        - /obj                     -> a new \"follow_demo\" geo is created for it\n#   2. Paste the whole thing into Windows > Python Shell and press Enter.\n#   It never edits your existing nodes.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\n# BUILD_DEMO = True  -> builds a test scene (grid -> anim -> POP sim) in the\n#                       current network and rigs it.\n# BUILD_DEMO = False -> rigs YOUR scene. Node names below are looked up in the\n#                       current network first (full paths work too). If\n#                       SIM_NODE is \"\" the first SELECTED node is used.\nBUILD_DEMO   = True\nTARGET       = \"\"   # \"\" = the network the Network Editor is showing; or a path\n\nSIM_NODE     = \"\"   # live sim particles, every frame (needs i@id, f@age)\nEMITTER_NODE = \"\"   # emitter in the SAME space as SIM_NODE (\"\" = none)\nDEFORM_NODE  = \"\"   # geometry to deform, in REST pose (\"\" = auto scatter demo / skip)\nREST_FRAME   = 240  # frame whose particle layout is the rest shape\n# ----------------------------------------------------------------------------\n\n\ndef current_network():\n    \"\"\"TARGET if set, else the network shown in the Network Editor.\"\"\"\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\ndef sop_network(net):\n    \"\"\"A SOP network to build in: net itself, or a new geo when net is /obj-level.\"\"\"\n    cat = net.childTypeCategory().name()\n    if cat == \"Sop\":\n        return net\n    if cat == \"Object\":\n        return net.createNode(\"geo\", \"follow_demo\")\n    raise hou.Error(\"Open a Geometry (SOP) network or /obj - %s holds %s nodes.\" % (net.path(), cat))\n\n\ndef find(name, net):\n    \"\"\"Look a node up relative to the current network first, then as a full path.\"\"\"\n    if not name:\n        return None\n    n = net.node(name) or hou.node(name)\n    if n is None:\n        raise hou.Error(\"Node not found: %r (looked in %s and as a full path)\" % (name, net.path()))\n    return n\n\n\ndef build_demo(geo):\n    \"\"\"grid -> anim (rises, tiny) -> popnet (source + wind) in SOP network geo. Returns (sim, emitter).\"\"\"\n    ys = [c.position()[1] for c in geo.children()]\n    top = (min(ys) - 2) if ys else 0          # start below whatever is already there\n    grid = geo.createNode(\"grid\", \"demo_grid\")\n    anim = geo.createNode(\"xform\", \"demo_anim\")\n    anim.setInput(0, grid)\n    anim.parm(\"scale\").set(0.03)\n    ty = anim.parm(\"ty\")\n    for fr, v in ((1, 0.0), (240, 3.3)):\n        k = hou.Keyframe(); k.setFrame(fr); k.setValue(v); k.setExpression(\"linear()\")\n        ty.setKeyframe(k)\n    dop = geo.createNode(\"dopnet\", \"demo_popnet\")\n    dop.setInput(0, anim)\n    dop.parm(\"objname1\").set(\"*\") if dop.parm(\"objname1\") else None\n    obj = dop.createNode(\"popobject\", \"popobject\")\n    src = dop.createNode(\"popsource\", \"source_first_input\")\n    src.parm(\"usecontextgeo\").set(2)          # first context geometry (the anim input)\n    src.parm(\"constantrate\").set(50)\n    wind = dop.createNode(\"popwind\", \"popwind1\")\n    wind.setInput(0, src)\n    wind.parm(\"windy\").set(1); wind.parm(\"amp\").set(1); wind.parm(\"swirlsize\").set(0.67)\n    merge = dop.createNode(\"merge\", \"wire_pops_into_here\")\n    merge.setInput(0, wind)\n    solver = dop.createNode(\"popsolver\", \"popsolver\")\n    solver.setInput(0, obj); solver.setInput(2, merge)\n    out = dop.createNode(\"output\", \"output\")\n    out.setInput(0, solver)\n    out.setDisplayFlag(True)\n    dop.layoutChildren()\n    grid.setPosition(hou.Vector2(0, top)); anim.setPosition(hou.Vector2(0, top - 1)); dop.setPosition(hou.Vector2(0, top - 2))\n    return dop, anim\n\n\nhere = current_network()\nif BUILD_DEMO:\n    sim, emitter = build_demo(sop_network(here))\n    deform_src = None          # a scatter of the rest shape is built below\nelse:\n    sim = find(SIM_NODE, here) if SIM_NODE else (hou.selectedNodes() or [None])[0]\n    if sim is None:\n        raise hou.Error(\"Set SIM_NODE or select the sim node first.\")\n    emitter = find(EMITTER_NODE, here)\n    deform_src = find(DEFORM_NODE, here)\nnet = sim.parent()\nbase = sim.position()\n\n\ndef mk(type_name, name, dx, dy):\n    n = net.createNode(type_name, name)\n    n.setPosition(base + hou.Vector2(dx, dy))\n    return n\n\n\ndef add_float(node, name, label, default, lo, hi):\n    ptg = node.parmTemplateGroup()\n    ptg.append(hou.FloatParmTemplate(name, label, 1, default_value=(default,), min=lo, max=hi))\n    node.setParmTemplateGroup(ptg)\n\n\ndef add_int(node, name, label, default, lo, hi):\n    ptg = node.parmTemplateGroup()\n    ptg.append(hou.IntParmTemplate(name, label, 1, default_value=(default,), min=lo, max=hi))\n    node.setParmTemplateGroup(ptg)\n\n\n# 1) rest layout = sim held at REST_FRAME ------------------------------------\nrest = mk(\"timeshift\", \"follow_rest\", 3, -1)\nrest.setInput(0, sim)\nrest.parm(\"frame\").deleteAllKeyframes()   # default is a $F expression; clear it\nrest.parm(\"frame\").set(REST_FRAME)\n\n# 2) per-frame info on the live sim: where the emitter is right now ----------\ninfo = mk(\"attribwrangle\", \"follow_sim_info\", 6, -1)\ninfo.setInput(0, sim)\nif emitter is not None:\n    info.setInput(1, emitter)\ninfo.parm(\"class\").set(0)  # detail\ninfo.parm(\"snippet\").set(r'''\n// anchor position: emitter centre if one is wired, else the live cloud centre\nv@emitpos = npoints(1) > 0 ? getbbox_center(1) : getbbox_center(0);\n''')\n\n# 3) mark which rest points exist in the live sim this frame -----------------\nmark = mk(\"attribwrangle\", \"follow_mark_born\", 3, -2.5)\nmark.setInput(0, rest)\nmark.setInput(1, sim)\nmark.parm(\"snippet\").set(r'''\nint src = idtopoint(1, i@id);\ni@born  = src >= 0;\ni@srcpt = src;\n''')\n\n# 4) live-only point cloud (rest-layout P) for fast neighbour search ---------\nborn = mk(\"attribwrangle\", \"follow_born_only\", 6, -3.5)\nborn.setInput(0, mark)\nborn.parm(\"snippet\").set('if (!i@born) removepoint(0, @ptnum);')   # no group parsing -> works in any version\n\n# 5) the follow itself --------------------------------------------------------\nfol = mk(\"attribwrangle\", \"follow_live\", 3, -5)\nfol.setInput(0, mark)\nfol.setInput(1, info)   # live sim P / age + detail emitpos\nfol.setInput(2, born)   # live-only cloud\nadd_float(fol, \"blend_time\", \"Blend Time (s)\", 0.5, 0, 5)\nadd_float(fol, \"radius\", \"Closest Radius\", 0.2, 0.001, 3)\nadd_float(fol, \"anchor_weight\", \"Emitter Anchor Weight\", 1.0, 0, 50)\nadd_int(fol, \"max_neighbours\", \"Max Neighbours\", 64, 8, 2048)   # 256 = smoother, 32 = faster\nadd_float(fol, \"rest_frame\", \"Rest Frame\", REST_FRAME, 1, 1000)\nfol.parm(\"rest_frame\").setExpression('ch(\"../%s/frame\")' % rest.name())\nfol.parm(\"snippet\").set(r'''\n// Weighted CURRENT position of live neighbours; closest in the rest layout wins.\n// Gaussian weight (radius = Closest Radius) is \u003c 1e-4 beyond 3*radius, so only\n// that radius is searched: cost ~ N * neighbours, not N * N.\n// A newborn's vote fades in over Blend Time, so nothing jumps.\nfunction vector neighbourPos(vector rest; int selfid; float radius; float fade;\n                             float wa; int maxn; vector anchor) {\n    float h = max(radius, 1e-4);\n    int near[] = pcfind(2, \"P\", rest, 3 * h, maxn);\n    vector sum = 0; float wsum = 0;\n    foreach (int n; near) {\n        if (point(2, \"id\", n) == selfid) continue;\n        int s = point(2, \"srcpt\", n);\n        vector nRest = point(2, \"P\", n);\n        vector nNow  = point(1, \"P\", s);\n        float d = distance(rest, nRest) / h;\n        float w = exp(-d * d);\n        if (fade > 0) w *= smooth(0, 1, point(1, \"age\", s) / fade);\n        sum += nNow * w; wsum += w;\n    }\n    // emitter = constant-vote anchor: dominates while few particles are alive,\n    // gets outvoted naturally as the sim fills up (keeps early frames steady)\n    sum += anchor * wa; wsum += wa;\n    return wsum > 0 ? sum / wsum : rest;\n}\n\nfloat blend   = chf(\"blend_time\");\nvector anchor = detail(1, \"emitpos\");\nvector rest   = v@P;\nvector taken  = neighbourPos(rest, i@id, chf(\"radius\"), blend,\n                             chf(\"anchor_weight\"), chi(\"max_neighbours\"), anchor);\n\nif (i@born) {\n    // ease from the borrowed pose into the real sim so birth never pops ...\n    vector real = point(1, \"P\", i@srcpt);\n    float age = point(1, \"age\", i@srcpt);\n    float t = blend > 0 ? smooth(0, 1, age / blend) : 1;\n    // ... and be fully on the sim by the rest frame, so the deform matches rest\n    float restT = (chf(\"rest_frame\") - 1) * @TimeInc;   // time = (frame-1)/fps\n    if (blend > 0) t = max(t, smooth(restT - blend, restT, @Time));\n    v@P = lerp(taken, real, t);\n} else {\n    v@P = taken;\n}\n''')\n\nout = mk(\"null\", \"OUT_follow_live\", 3, -6.2)\nout.setInput(0, fol)\ncreated = [rest, info, mark, born, fol, out]\n\nif BUILD_DEMO:\n    con = mk(\"connectadjacentpieces\", \"demo_connect\", -3, -2.5)\n    con.setInput(0, rest)\n    con.parm(\"connecttype\").set(2); con.parm(\"maxsearchpoints\").set(28)\n    sc = mk(\"scatter\", \"demo_scatter\", -3, -3.7)\n    sc.setInput(0, con)\n    sc.parm(\"npts\").set(100000)\n    deform_src = mk(\"null\", \"demo_rest_geo\", -3, -4.9)\n    deform_src.setInput(0, sc)\n    created += [con, sc, deform_src]\n\n# 6) optional: Point Deform the rest geometry with the lattice ----------------\nif deform_src is not None:\n    pd = mk(\"pointdeform\", \"follow_pointdeform\", 0, -7.4)\n    pd.setInput(0, deform_src)\n    pd.setInput(1, rest)\n    pd.setInput(2, out)\n    out_d = mk(\"null\", \"OUT_follow_deform\", 0, -8.6)\n    out_d.setInput(0, pd)\n    out_d.setDisplayFlag(True)\n    out_d.setRenderFlag(True)\n    created += [pd, out_d]\nelse:\n    out.setDisplayFlag(True)\n    out.setRenderFlag(True)\n\nprint(\"follow rig built in %s: %s\" % (net.path(), \", \".join(n.name() for n in created)))\n", "visual": "rig-graph"}, {"id": "follow-live-vex", "title": "follow_live — closest live position", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "follow_live.vfl", "description": "หัวใจของ rig: ตำแหน่งปัจจุบันเฉลี่ยแบบ Gaussian ของพาร์ติเคิลที่มีชีวิตใกล้ๆ ในเลย์เอาต์ rest + emitter เป็นตัวถ่วงช่วงต้นซีน + blend เข้าซิมจริงหลังเกิด และบังคับให้ blend ครบภายในเฟรม rest", "notes": "Inputs: 0 = rest points ที่มี i@born, i@srcpt · 1 = live sim ที่มี detail v@emitpos · 2 = live-only cloud\nSpare parms ที่ต้องสร้าง: blend_time, radius, anchor_weight, max_neighbours (int), rest_frame\nอย่าใช้ ch(\"../node/parm\") ใน VEX เพื่ออ่านค่าจาก node อื่น เพราะ path จะหาไม่เจอแล้วได้ 0 ให้ link ผ่าน spare parm แทน", "code": "// Weighted CURRENT position of live neighbours; closest in the rest layout wins.\n// Gaussian weight (radius = Closest Radius) is \u003c 1e-4 beyond 3*radius, so only\n// that radius is searched: cost ~ N * neighbours, not N * N.\n// A newborn's vote fades in over Blend Time, so nothing jumps.\nfunction vector neighbourPos(vector rest; int selfid; float radius; float fade;\n                             float wa; int maxn; vector anchor) {\n    float h = max(radius, 1e-4);\n    int near[] = pcfind(2, \"P\", rest, 3 * h, maxn);\n    vector sum = 0; float wsum = 0;\n    foreach (int n; near) {\n        if (point(2, \"id\", n) == selfid) continue;\n        int s = point(2, \"srcpt\", n);\n        vector nRest = point(2, \"P\", n);\n        vector nNow  = point(1, \"P\", s);\n        float d = distance(rest, nRest) / h;\n        float w = exp(-d * d);\n        if (fade > 0) w *= smooth(0, 1, point(1, \"age\", s) / fade);\n        sum += nNow * w; wsum += w;\n    }\n    // emitter = constant-vote anchor: dominates while few particles are alive,\n    // gets outvoted naturally as the sim fills up (keeps early frames steady)\n    sum += anchor * wa; wsum += wa;\n    return wsum > 0 ? sum / wsum : rest;\n}\n\nfloat blend   = chf(\"blend_time\");\nvector anchor = detail(1, \"emitpos\");\nvector rest   = v@P;\nvector taken  = neighbourPos(rest, i@id, chf(\"radius\"), blend,\n                             chf(\"anchor_weight\"), chi(\"max_neighbours\"), anchor);\n\nif (i@born) {\n    // ease from the borrowed pose into the real sim so birth never pops ...\n    vector real = point(1, \"P\", i@srcpt);\n    float age = point(1, \"age\", i@srcpt);\n    float t = blend > 0 ? smooth(0, 1, age / blend) : 1;\n    // ... and be fully on the sim by the rest frame, so the deform matches rest\n    float restT = (chf(\"rest_frame\") - 1) * @TimeInc;   // time = (frame-1)/fps\n    if (blend > 0) t = max(t, smooth(restT - blend, restT, @Time));\n    v@P = lerp(taken, real, t);\n} else {\n    v@P = taken;\n}\n", "visual": "follow-concept"}, {"id": "mark-born-vex", "title": "mark_born — does this id exist yet?", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "mark_born.vfl", "description": "ต่อ input 0 = ท่า rest (timeshift ไปที่เฟรมสุดท้าย) และ input 1 = live sim แล้วจะเขียน i@born กับ i@srcpt (index ของพอยต์นั้นในซิมตอนนี้ ถ้ายังไม่เกิดจะเป็น -1)", "notes": "idtopoint() ต้องใช้ i@id ที่ไม่ซ้ำกัน ซึ่ง POP สร้างให้อยู่แล้ว", "code": "int src = idtopoint(1, i@id);\ni@born  = src >= 0;\ni@srcpt = src;\n", "visual": "born-mask"}, {"id": "born-only-vex", "title": "born_only — keep live points only", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "born_only.vfl", "description": "ลบพอยต์ที่ยังไม่เกิดทิ้ง ใช้แทน Blast @born==0 เพราะไม่ต้องพึ่งการอ่าน group จึงใช้ได้ทุกเวอร์ชัน", "notes": "", "code": "if (!i@born) removepoint(0, @ptnum);\n", "visual": "born-only"}, {"id": "patch-born-only", "title": "Patch: follow_born_only Blast → wrangle", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · current-network tests", "filename": "patch_born_v2.py", "description": "แก้ rig ที่สร้างไปแล้ว: หา Blast ชื่อ follow_born_only ใน network ที่ Network Editor เปิดอยู่ (รวมข้างใน) แล้วเปลี่ยนเป็น wrangle ที่ลบพอยต์ตรงๆ พร้อมต่อสายเดิมให้", "notes": "ใช้เมื่อขึ้นว่าหา attribute born ไม่เจอ (เดาว่า Blast ใน 20.5 อ่าน @born==0 เป็น prim group) · ตัว v2 ใช้ wrangle อยู่แล้ว ไม่ต้อง patch ซ้ำ", "code": "# ---- patch: replace follow_born_only (Blast) with a wrangle ----------------\n# Works on the network the Network Editor is showing (and everything inside it).\n# Set TARGET to a path to patch somewhere else.\nimport hou\n\nTARGET = \"\"   # \"\" = the network the Network Editor is showing\n\nif TARGET:\n    here = hou.node(TARGET)\nelse:\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    here = ne.pwd() if ne else None\nif here is None:\n    raise hou.Error(\"Open the network with the rig in the Network Editor, or set TARGET.\")\n\nold = [n for n in [here] + list(here.allSubChildren())\n       if n.name() == \"follow_born_only\" and n.type().name() == \"blast\"]\nif not old:\n    raise hou.Error(\"No Blast called follow_born_only in %s - nothing to patch.\" % here.path())\nfor b in old:\n    net = b.parent()\n    src = b.inputs()[0]\n    w = net.createNode(\"attribwrangle\", \"follow_born_only_w\")\n    w.setPosition(b.position())\n    w.setInput(0, src)\n    w.parm(\"snippet\").set('if (!i@born) removepoint(0, @ptnum);')\n    for con in b.outputConnections():\n        con.outputNode().setInput(con.inputIndex(), w)\n    b.destroy()\n    w.setName(\"follow_born_only\")\n    print(\"patched\", w.path())\n", "visual": "patch-swap"}]}, {"v": "v003", "date": "2026-09-25", "notes": "v003: ใช้ frame range ปัจจุบันของ scene\n• หลังสร้าง node สคริปต์อ่าน start / end frame จาก playbar แล้วตั้งให้ parm ที่เป็น start frame (solver, DOP network: startframe / start_frame …) และ frame range ของ ROP / file cache (f1, f2)\n• parm ที่มี expression อยู่แล้ว (เช่น $FSTART) ไม่ถูกแตะ\n• ตั้ง START_FRAME / END_FRAME เองได้ หรือ LINK_TO_PLAYBAR = True ให้เขียน $FSTART / $FEND ตาม playbar ตลอด\n• สคริปต์พิมพ์ออกมาว่าตั้ง parm ไหนไปบ้าง\n• rig builder: demo POP sim เริ่มที่ start frame · rest shape = end frame (REST_FRAME = None) · anim ของ emitter ขยับจาก start ถึง end\n\nv002: สคริปต์ Python ทุกตัวติดตั้งลง network ที่ Network Editor เปิดอยู่ แบบเดียวกับ FX Template\n• rig builder: เปิด Geometry network แล้วรัน = สร้างตรงนั้น · เปิด /obj แล้วรัน = สร้าง geo \"follow_demo\" ใหม่ให้ · โหมด BUILD_DEMO = False หาชื่อ node ใน network ที่เปิดอยู่ก่อน (ใส่ path เต็มก็ได้) · ไม่ย้าย node เดิมของพี่\n• patch: หา Blast follow_born_only เฉพาะใน network ที่เปิดอยู่และข้างใน\n• ตั้ง TARGET เป็น path ได้ถ้าจะบังคับที่ติดตั้ง\n\nปัญหา: เอาเฟรมสุดท้ายของ POP sim มาเป็นพอยต์ชุดคงที่ แล้ว copy P จากซิมตาม id ตัวที่ยังไม่เกิดหา id ตัวเองไม่เจอ เลยลอยค้างอยู่กลางอากาศ\n\nวิธีแก้: ให้ตัวที่ยังไม่เกิดไปเอาตำแหน่งปัจจุบันของเพื่อนที่เกิดแล้วซึ่งอยู่ใกล้ในท่า rest (เฉลี่ยแบบ Gaussian + emitter เป็นตัวถ่วง) แล้ว blend เข้าซิมจริงตอนเกิด ใช้ขับ Point Deform ได้\n\nเริ่มจาก build_follow_live_v2.py (BUILD_DEMO = True ใช้กับ geo ว่างได้เลย)\nทดสอบกับ H21.0.671 · ยังไม่ได้ลองกับ 20.5", "previewImage": "", "previewVisual": "follow-concept", "files": [{"id": "follow-rig", "title": "Follow-live rig builder (unborn particles)", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · playbar 1001-1100 test", "filename": "build_follow_live_v4.py", "description": "สร้าง rig ทั้งชุดให้พอยต์ที่ยังไม่เกิด (ยังไม่มี id ในซิม) ไปเอาตำแหน่งปัจจุบันของพาร์ติเคิลที่มีชีวิตซึ่งอยู่ใกล้มันที่สุดในเลย์เอาต์ของเฟรม rest แล้วค่อยๆ blend เข้าตำแหน่งซิมจริงตอนเกิด ใช้ขับ Point Deform ได้โดยไม่กระตุก\n\nติดตั้งลง network ที่ Network Editor เปิดอยู่: ถ้าเปิด Geometry network จะสร้างตรงนั้น ถ้าเปิด /obj จะสร้าง geo ใหม่ชื่อ follow_demo\nBUILD_DEMO = True จะสร้าง grid → anim → POP sim เป็นตัวอย่าง ถ้าตั้งเป็น False จะ rig scene ของพี่เอง ใส่แค่ชื่อ node ใน network ที่เปิดอยู่ก็พอ หรือเลือก sim node ก่อนรัน", "notes": "รัน paste ทั้งก้อนใน Windows → Python Shell · ผลลัพธ์อยู่ที่ OUT_follow_live (lattice) และ OUT_follow_deform · Max Neighbours: 256 นิ่งกว่า, 64 = default, 32 เร็วกว่า (วัดที่ 200k พาร์ติเคิล: ~470 / ~145 / ~95 ms ต่อเฟรม) · ทดสอบกับ H21 เท่านั้น ยังไม่ได้ลองกับ 20.5", "code": "# ============================================================================\n# Unborn-particle \"follow live neighbours\" rig  (paste into Houdini Python Shell)\n#\n# Problem: you take the LAST frame of a POP sim as a fixed point set and copy P\n# from the live sim by id. Points whose id is not born yet have nothing to copy\n# and hang in space. This rig moves every not-yet-born point to a smooth\n# weighted average of the CURRENT positions of live particles that sit closest\n# to it in the rest layout, so the lattice is deform-safe (Point Deform).\n#\n# HOW TO USE\n#   1. Open the network you want in the Network Editor:\n#        - a Geometry (SOP) network -> the rig is built right there\n#        - /obj                     -> a new \"follow_demo\" geo is created for it\n#   2. Paste the whole thing into Windows > Python Shell and press Enter.\n#   It never edits your existing nodes.\n#   Frames come from the playbar: the demo sim starts at the start frame and\n#   the rest shape is the end frame (override with START_FRAME / END_FRAME /\n#   REST_FRAME, or set LINK_TO_PLAYBAR = True to keep following the playbar).\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\n# BUILD_DEMO = True  -> builds a test scene (grid -> anim -> POP sim) in the\n#                       current network and rigs it.\n# BUILD_DEMO = False -> rigs YOUR scene. Node names below are looked up in the\n#                       current network first (full paths work too). If\n#                       SIM_NODE is \"\" the first SELECTED node is used.\nBUILD_DEMO   = True\nTARGET       = \"\"   # \"\" = the network the Network Editor is showing; or a path\n\nSIM_NODE     = \"\"   # live sim particles, every frame (needs i@id, f@age)\nEMITTER_NODE = \"\"   # emitter in the SAME space as SIM_NODE (\"\" = none)\nDEFORM_NODE  = \"\"   # geometry to deform, in REST pose (\"\" = auto scatter demo / skip)\nREST_FRAME   = None # frame whose particle layout is the rest shape (None = END frame below)\n# ----------------------------------------------------------------------------\n\n# ---- frame range: use the scene's current start / end frame -----------------\nSTART_FRAME     = None   # None = the playbar's start frame right now\nEND_FRAME       = None   # None = the playbar's end frame right now\nLINK_TO_PLAYBAR = False  # True = write $FSTART / $FEND expressions instead of numbers\n\nSTART_PARMS = (\"startframe\", \"start_frame\", \"startFrame\", \"sim_start\", \"simstart\")\n\n\ndef scene_frame_range():\n    fs, fe = hou.playbar.frameRange()\n    return (float(START_FRAME) if START_FRAME is not None else fs,\n            float(END_FRAME) if END_FRAME is not None else fe)\n\n\ndef _is_driven(p):\n    \"\"\"Leave parms that already follow something (expression / keys) alone.\"\"\"\n    return len(p.keyframes()) > 0\n\n\ndef _put(p, value, expr):\n    if LINK_TO_PLAYBAR:\n        p.setExpression(expr, hou.exprLanguage.Hscript)\n    else:\n        p.set(value)\n\n\ndef apply_frame_range(nodes):\n    \"\"\"Set start-frame parms (solvers, DOP networks ...) and ROP / file cache\n    ranges on `nodes` and everything inside them to the scene's frame range.\"\"\"\n    fs, fe = scene_frame_range()\n    changed, skipped = [], []\n    for top in nodes:\n        for n in [top] + list(top.allSubChildren()):\n            if n.isInsideLockedHDA():\n                continue\n            for name in START_PARMS:\n                p = n.parm(name)\n                if p is None:\n                    continue\n                if _is_driven(p):\n                    skipped.append(p.path()); continue\n                _put(p, fs, \"$FSTART\"); changed.append(p.path())\n            f1, f2 = n.parm(\"f1\"), n.parm(\"f2\")\n            if f1 is not None and f2 is not None and n.parm(\"trange\") is not None:\n                for p, v, e in ((f1, fs, \"$FSTART\"), (f2, fe, \"$FEND\")):\n                    if _is_driven(p):\n                        skipped.append(p.path())\n                    else:\n                        _put(p, v, e); changed.append(p.path())\n    print(\"frame range %g-%g%s: set %d parm(s)%s\" % (\n        fs, fe, \" (linked to playbar)\" if LINK_TO_PLAYBAR else \"\", len(changed),\n        (\", left %d that already follow an expression\" % len(skipped)) if skipped else \"\"))\n    for c in changed:\n        print(\"   set\", c)\n    return changed\n\n\ndef current_network():\n    \"\"\"TARGET if set, else the network shown in the Network Editor.\"\"\"\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\ndef sop_network(net):\n    \"\"\"A SOP network to build in: net itself, or a new geo when net is /obj-level.\"\"\"\n    cat = net.childTypeCategory().name()\n    if cat == \"Sop\":\n        return net\n    if cat == \"Object\":\n        return net.createNode(\"geo\", \"follow_demo\")\n    raise hou.Error(\"Open a Geometry (SOP) network or /obj - %s holds %s nodes.\" % (net.path(), cat))\n\n\ndef find(name, net):\n    \"\"\"Look a node up relative to the current network first, then as a full path.\"\"\"\n    if not name:\n        return None\n    n = net.node(name) or hou.node(name)\n    if n is None:\n        raise hou.Error(\"Node not found: %r (looked in %s and as a full path)\" % (name, net.path()))\n    return n\n\n\ndef build_demo(geo):\n    \"\"\"grid -> anim (rises, tiny) -> popnet (source + wind) in SOP network geo. Returns (sim, emitter).\"\"\"\n    ys = [c.position()[1] for c in geo.children()]\n    top = (min(ys) - 2) if ys else 0          # start below whatever is already there\n    grid = geo.createNode(\"grid\", \"demo_grid\")\n    anim = geo.createNode(\"xform\", \"demo_anim\")\n    anim.setInput(0, grid)\n    anim.parm(\"scale\").set(0.03)\n    ty = anim.parm(\"ty\")\n    fs, fe = scene_frame_range()\n    for fr, v in ((fs, 0.0), (fe, 3.3)):\n        k = hou.Keyframe(); k.setFrame(fr); k.setValue(v); k.setExpression(\"linear()\")\n        ty.setKeyframe(k)\n    dop = geo.createNode(\"dopnet\", \"demo_popnet\")\n    dop.setInput(0, anim)\n    dop.parm(\"objname1\").set(\"*\") if dop.parm(\"objname1\") else None\n    obj = dop.createNode(\"popobject\", \"popobject\")\n    src = dop.createNode(\"popsource\", \"source_first_input\")\n    src.parm(\"usecontextgeo\").set(2)          # first context geometry (the anim input)\n    src.parm(\"constantrate\").set(50)\n    wind = dop.createNode(\"popwind\", \"popwind1\")\n    wind.setInput(0, src)\n    wind.parm(\"windy\").set(1); wind.parm(\"amp\").set(1); wind.parm(\"swirlsize\").set(0.67)\n    merge = dop.createNode(\"merge\", \"wire_pops_into_here\")\n    merge.setInput(0, wind)\n    solver = dop.createNode(\"popsolver\", \"popsolver\")\n    solver.setInput(0, obj); solver.setInput(2, merge)\n    out = dop.createNode(\"output\", \"output\")\n    out.setInput(0, solver)\n    out.setDisplayFlag(True)\n    dop.layoutChildren()\n    grid.setPosition(hou.Vector2(0, top)); anim.setPosition(hou.Vector2(0, top - 1)); dop.setPosition(hou.Vector2(0, top - 2))\n    return dop, anim\n\n\nhere = current_network()\nif BUILD_DEMO:\n    sim, emitter = build_demo(sop_network(here))\n    apply_frame_range([sim])   # demo POP network starts at the scene's start frame\n    deform_src = None          # a scatter of the rest shape is built below\nelse:\n    sim = find(SIM_NODE, here) if SIM_NODE else (hou.selectedNodes() or [None])[0]\n    if sim is None:\n        raise hou.Error(\"Set SIM_NODE or select the sim node first.\")\n    emitter = find(EMITTER_NODE, here)\n    deform_src = find(DEFORM_NODE, here)\nnet = sim.parent()\nbase = sim.position()\n\n\ndef mk(type_name, name, dx, dy):\n    n = net.createNode(type_name, name)\n    n.setPosition(base + hou.Vector2(dx, dy))\n    return n\n\n\ndef add_float(node, name, label, default, lo, hi):\n    ptg = node.parmTemplateGroup()\n    ptg.append(hou.FloatParmTemplate(name, label, 1, default_value=(default,), min=lo, max=hi))\n    node.setParmTemplateGroup(ptg)\n\n\ndef add_int(node, name, label, default, lo, hi):\n    ptg = node.parmTemplateGroup()\n    ptg.append(hou.IntParmTemplate(name, label, 1, default_value=(default,), min=lo, max=hi))\n    node.setParmTemplateGroup(ptg)\n\n\n# 1) rest layout = sim held at REST_FRAME ------------------------------------\nrest = mk(\"timeshift\", \"follow_rest\", 3, -1)\nrest.setInput(0, sim)\nrest.parm(\"frame\").deleteAllKeyframes()   # default is a $F expression; clear it\nif REST_FRAME is None and LINK_TO_PLAYBAR:\n    rest.parm(\"frame\").setExpression(\"$FEND\", hou.exprLanguage.Hscript)\nelse:\n    rest.parm(\"frame\").set(REST_FRAME if REST_FRAME is not None else scene_frame_range()[1])\n\n# 2) per-frame info on the live sim: where the emitter is right now ----------\ninfo = mk(\"attribwrangle\", \"follow_sim_info\", 6, -1)\ninfo.setInput(0, sim)\nif emitter is not None:\n    info.setInput(1, emitter)\ninfo.parm(\"class\").set(0)  # detail\ninfo.parm(\"snippet\").set(r'''\n// anchor position: emitter centre if one is wired, else the live cloud centre\nv@emitpos = npoints(1) > 0 ? getbbox_center(1) : getbbox_center(0);\n''')\n\n# 3) mark which rest points exist in the live sim this frame -----------------\nmark = mk(\"attribwrangle\", \"follow_mark_born\", 3, -2.5)\nmark.setInput(0, rest)\nmark.setInput(1, sim)\nmark.parm(\"snippet\").set(r'''\nint src = idtopoint(1, i@id);\ni@born  = src >= 0;\ni@srcpt = src;\n''')\n\n# 4) live-only point cloud (rest-layout P) for fast neighbour search ---------\nborn = mk(\"attribwrangle\", \"follow_born_only\", 6, -3.5)\nborn.setInput(0, mark)\nborn.parm(\"snippet\").set('if (!i@born) removepoint(0, @ptnum);')   # no group parsing -> works in any version\n\n# 5) the follow itself --------------------------------------------------------\nfol = mk(\"attribwrangle\", \"follow_live\", 3, -5)\nfol.setInput(0, mark)\nfol.setInput(1, info)   # live sim P / age + detail emitpos\nfol.setInput(2, born)   # live-only cloud\nadd_float(fol, \"blend_time\", \"Blend Time (s)\", 0.5, 0, 5)\nadd_float(fol, \"radius\", \"Closest Radius\", 0.2, 0.001, 3)\nadd_float(fol, \"anchor_weight\", \"Emitter Anchor Weight\", 1.0, 0, 50)\nadd_int(fol, \"max_neighbours\", \"Max Neighbours\", 64, 8, 2048)   # 256 = smoother, 32 = faster\nadd_float(fol, \"rest_frame\", \"Rest Frame\", 1, 1, 1000)\nfol.parm(\"rest_frame\").setExpression('ch(\"../%s/frame\")' % rest.name())\nfol.parm(\"snippet\").set(r'''\n// Weighted CURRENT position of live neighbours; closest in the rest layout wins.\n// Gaussian weight (radius = Closest Radius) is \u003c 1e-4 beyond 3*radius, so only\n// that radius is searched: cost ~ N * neighbours, not N * N.\n// A newborn's vote fades in over Blend Time, so nothing jumps.\nfunction vector neighbourPos(vector rest; int selfid; float radius; float fade;\n                             float wa; int maxn; vector anchor) {\n    float h = max(radius, 1e-4);\n    int near[] = pcfind(2, \"P\", rest, 3 * h, maxn);\n    vector sum = 0; float wsum = 0;\n    foreach (int n; near) {\n        if (point(2, \"id\", n) == selfid) continue;\n        int s = point(2, \"srcpt\", n);\n        vector nRest = point(2, \"P\", n);\n        vector nNow  = point(1, \"P\", s);\n        float d = distance(rest, nRest) / h;\n        float w = exp(-d * d);\n        if (fade > 0) w *= smooth(0, 1, point(1, \"age\", s) / fade);\n        sum += nNow * w; wsum += w;\n    }\n    // emitter = constant-vote anchor: dominates while few particles are alive,\n    // gets outvoted naturally as the sim fills up (keeps early frames steady)\n    sum += anchor * wa; wsum += wa;\n    return wsum > 0 ? sum / wsum : rest;\n}\n\nfloat blend   = chf(\"blend_time\");\nvector anchor = detail(1, \"emitpos\");\nvector rest   = v@P;\nvector taken  = neighbourPos(rest, i@id, chf(\"radius\"), blend,\n                             chf(\"anchor_weight\"), chi(\"max_neighbours\"), anchor);\n\nif (i@born) {\n    // ease from the borrowed pose into the real sim so birth never pops ...\n    vector real = point(1, \"P\", i@srcpt);\n    float age = point(1, \"age\", i@srcpt);\n    float t = blend > 0 ? smooth(0, 1, age / blend) : 1;\n    // ... and be fully on the sim by the rest frame, so the deform matches rest\n    float restT = (chf(\"rest_frame\") - 1) * @TimeInc;   // time = (frame-1)/fps\n    if (blend > 0) t = max(t, smooth(restT - blend, restT, @Time));\n    v@P = lerp(taken, real, t);\n} else {\n    v@P = taken;\n}\n''')\n\nout = mk(\"null\", \"OUT_follow_live\", 3, -6.2)\nout.setInput(0, fol)\ncreated = [rest, info, mark, born, fol, out]\n\nif BUILD_DEMO:\n    con = mk(\"connectadjacentpieces\", \"demo_connect\", -3, -2.5)\n    con.setInput(0, rest)\n    con.parm(\"connecttype\").set(2); con.parm(\"maxsearchpoints\").set(28)\n    sc = mk(\"scatter\", \"demo_scatter\", -3, -3.7)\n    sc.setInput(0, con)\n    sc.parm(\"npts\").set(100000)\n    deform_src = mk(\"null\", \"demo_rest_geo\", -3, -4.9)\n    deform_src.setInput(0, sc)\n    created += [con, sc, deform_src]\n\n# 6) optional: Point Deform the rest geometry with the lattice ----------------\nif deform_src is not None:\n    pd = mk(\"pointdeform\", \"follow_pointdeform\", 0, -7.4)\n    pd.setInput(0, deform_src)\n    pd.setInput(1, rest)\n    pd.setInput(2, out)\n    out_d = mk(\"null\", \"OUT_follow_deform\", 0, -8.6)\n    out_d.setInput(0, pd)\n    out_d.setDisplayFlag(True)\n    out_d.setRenderFlag(True)\n    created += [pd, out_d]\nelse:\n    out.setDisplayFlag(True)\n    out.setRenderFlag(True)\n\nprint(\"rest frame: %g\" % rest.parm(\"frame\").eval())\nprint(\"follow rig built in %s: %s\" % (net.path(), \", \".join(n.name() for n in created)))\n", "visual": "rig-graph"}, {"id": "follow-live-vex", "title": "follow_live — closest live position", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "follow_live.vfl", "description": "หัวใจของ rig: ตำแหน่งปัจจุบันเฉลี่ยแบบ Gaussian ของพาร์ติเคิลที่มีชีวิตใกล้ๆ ในเลย์เอาต์ rest + emitter เป็นตัวถ่วงช่วงต้นซีน + blend เข้าซิมจริงหลังเกิด และบังคับให้ blend ครบภายในเฟรม rest", "notes": "Inputs: 0 = rest points ที่มี i@born, i@srcpt · 1 = live sim ที่มี detail v@emitpos · 2 = live-only cloud\nSpare parms ที่ต้องสร้าง: blend_time, radius, anchor_weight, max_neighbours (int), rest_frame\nอย่าใช้ ch(\"../node/parm\") ใน VEX เพื่ออ่านค่าจาก node อื่น เพราะ path จะหาไม่เจอแล้วได้ 0 ให้ link ผ่าน spare parm แทน", "code": "// Weighted CURRENT position of live neighbours; closest in the rest layout wins.\n// Gaussian weight (radius = Closest Radius) is \u003c 1e-4 beyond 3*radius, so only\n// that radius is searched: cost ~ N * neighbours, not N * N.\n// A newborn's vote fades in over Blend Time, so nothing jumps.\nfunction vector neighbourPos(vector rest; int selfid; float radius; float fade;\n                             float wa; int maxn; vector anchor) {\n    float h = max(radius, 1e-4);\n    int near[] = pcfind(2, \"P\", rest, 3 * h, maxn);\n    vector sum = 0; float wsum = 0;\n    foreach (int n; near) {\n        if (point(2, \"id\", n) == selfid) continue;\n        int s = point(2, \"srcpt\", n);\n        vector nRest = point(2, \"P\", n);\n        vector nNow  = point(1, \"P\", s);\n        float d = distance(rest, nRest) / h;\n        float w = exp(-d * d);\n        if (fade > 0) w *= smooth(0, 1, point(1, \"age\", s) / fade);\n        sum += nNow * w; wsum += w;\n    }\n    // emitter = constant-vote anchor: dominates while few particles are alive,\n    // gets outvoted naturally as the sim fills up (keeps early frames steady)\n    sum += anchor * wa; wsum += wa;\n    return wsum > 0 ? sum / wsum : rest;\n}\n\nfloat blend   = chf(\"blend_time\");\nvector anchor = detail(1, \"emitpos\");\nvector rest   = v@P;\nvector taken  = neighbourPos(rest, i@id, chf(\"radius\"), blend,\n                             chf(\"anchor_weight\"), chi(\"max_neighbours\"), anchor);\n\nif (i@born) {\n    // ease from the borrowed pose into the real sim so birth never pops ...\n    vector real = point(1, \"P\", i@srcpt);\n    float age = point(1, \"age\", i@srcpt);\n    float t = blend > 0 ? smooth(0, 1, age / blend) : 1;\n    // ... and be fully on the sim by the rest frame, so the deform matches rest\n    float restT = (chf(\"rest_frame\") - 1) * @TimeInc;   // time = (frame-1)/fps\n    if (blend > 0) t = max(t, smooth(restT - blend, restT, @Time));\n    v@P = lerp(taken, real, t);\n} else {\n    v@P = taken;\n}\n", "visual": "follow-concept"}, {"id": "mark-born-vex", "title": "mark_born — does this id exist yet?", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "mark_born.vfl", "description": "ต่อ input 0 = ท่า rest (timeshift ไปที่เฟรมสุดท้าย) และ input 1 = live sim แล้วจะเขียน i@born กับ i@srcpt (index ของพอยต์นั้นในซิมตอนนี้ ถ้ายังไม่เกิดจะเป็น -1)", "notes": "idtopoint() ต้องใช้ i@id ที่ไม่ซ้ำกัน ซึ่ง POP สร้างให้อยู่แล้ว", "code": "int src = idtopoint(1, i@id);\ni@born  = src >= 0;\ni@srcpt = src;\n", "visual": "born-mask"}, {"id": "born-only-vex", "title": "born_only — keep live points only", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "born_only.vfl", "description": "ลบพอยต์ที่ยังไม่เกิดทิ้ง ใช้แทน Blast @born==0 เพราะไม่ต้องพึ่งการอ่าน group จึงใช้ได้ทุกเวอร์ชัน", "notes": "", "code": "if (!i@born) removepoint(0, @ptnum);\n", "visual": "born-only"}, {"id": "patch-born-only", "title": "Patch: follow_born_only Blast → wrangle", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · current-network tests", "filename": "patch_born_v2.py", "description": "แก้ rig ที่สร้างไปแล้ว: หา Blast ชื่อ follow_born_only ใน network ที่ Network Editor เปิดอยู่ (รวมข้างใน) แล้วเปลี่ยนเป็น wrangle ที่ลบพอยต์ตรงๆ พร้อมต่อสายเดิมให้", "notes": "ใช้เมื่อขึ้นว่าหา attribute born ไม่เจอ (เดาว่า Blast ใน 20.5 อ่าน @born==0 เป็น prim group) · ตัว v2 ใช้ wrangle อยู่แล้ว ไม่ต้อง patch ซ้ำ", "code": "# ---- patch: replace follow_born_only (Blast) with a wrangle ----------------\n# Works on the network the Network Editor is showing (and everything inside it).\n# Set TARGET to a path to patch somewhere else.\nimport hou\n\nTARGET = \"\"   # \"\" = the network the Network Editor is showing\n\nif TARGET:\n    here = hou.node(TARGET)\nelse:\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    here = ne.pwd() if ne else None\nif here is None:\n    raise hou.Error(\"Open the network with the rig in the Network Editor, or set TARGET.\")\n\nold = [n for n in [here] + list(here.allSubChildren())\n       if n.name() == \"follow_born_only\" and n.type().name() == \"blast\"]\nif not old:\n    raise hou.Error(\"No Blast called follow_born_only in %s - nothing to patch.\" % here.path())\nfor b in old:\n    net = b.parent()\n    src = b.inputs()[0]\n    w = net.createNode(\"attribwrangle\", \"follow_born_only_w\")\n    w.setPosition(b.position())\n    w.setInput(0, src)\n    w.parm(\"snippet\").set('if (!i@born) removepoint(0, @ptnum);')\n    for con in b.outputConnections():\n        con.outputNode().setInput(con.inputIndex(), w)\n    b.destroy()\n    w.setName(\"follow_born_only\")\n    print(\"patched\", w.path())\n", "visual": "patch-swap"}]}]}, {"id": "fxt-vectors-orient", "name": "2 vectors → matrix / orient", "category": "Math & orientation", "type": "Sop", "author": "Plug", "versions": [{"v": "v001", "date": "Aug 30 2025", "notes": "จาก FX Template เดิม (Convert_2 Vectors_to_Mat_2_Vectors_to_Orient · Aug 30 2025 20:02:32)\nNote เดิม: Convert \n2 Vectors to Mat\n2 Vectors to Orient", "previewImage": "307d4716c2428011e4db44346a2c3c1e", "previewVisual": "", "files": [{"id": "fxt-vectors-orient-rebuild", "title": "Rebuild network (Sop)", "lang": "python", "context": "Python Shell · open a Sop network first", "tested": "Houdini 21.0.671 · reb
