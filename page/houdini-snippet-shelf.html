 = mk(\"attribwrangle\", \"ORIENT_protos\", -3, -3.6)      # rest pieces, each at the origin\nprotos.setInput(0, rest)\nprotos.setInput(1, ext)\nprotos.parm(\"snippet\").set(r'''\n// move every rest point by its piece's pivot so the piece sits at the origin\nint pr = pointprims(0, @ptnum)[0];\nstring piece = prim(0, \"%(a)s\", pr);\nint ip = findattribval(1, \"point\", \"%(a)s\", piece);\nv@P -= point(1, \"pivot\", ip);\n''' % {\"a\": PIECE_ATTR})\n\npath = mk(\"attribwrangle\", \"ORIENT_protos_path\", -3, -4.8)   # one USD prim per piece, same clean name\npath.setInput(0, protos)\npath.parm(\"class\").set(1)                                    # Primitives\npath.parm(\"snippet\").set(r'''\nstring nm = re_replace(\"[^A-Za-z0-9_]\", \"_\", s@%(a)s);\nif (re_match(\"^[0-9]\", nm)) nm = \"_\" + nm;\ns@path = nm;\n''' % {\"a\": PIECE_ATTR})\n\nt_out = mk(\"null\", \"OUT_orient_points\", 0, -6)\nt_out.setInput(0, pts)\np_out = mk(\"null\", \"OUT_orient_protos\", -3, -6)\np_out.setInput(0, path)\n\nif ADD_LOP:\n    lop = mk(\"lopnet\", \"LOP_orient_instancing\", -1.5, -7.2)\n    si = lop.createNode(\"sopimport\", \"root_pieces\")          # prims: /root_pieces/piece0_0_0, ...\n    si.parm(\"soppath\").set(si.relativePathTo(p_out))\n    si.setPosition(hou.Vector2(3, 0))\n    inst = lop.createNode(\"instancer\", \"instancer1\")         # prim: /instancer1\n    inst.setInput(1, si)\n    inst.setPosition(hou.Vector2(0, -1.5))\n    inst.parm(\"method\").set(\"pointinstancer\")\n    inst.parm(\"transformsourcemode\").set(\"extsop\")\n    inst.parm(\"pointsoppath\").set(inst.relativePathTo(t_out))\n    inst.parm(\"protosourcemode\").set(\"second\")\n    inst.parm(\"protopattern\").set(\"/root_pieces/*\")          # EVERY piece is its own prototype\n    inst.parm(\"protoindexsrc\").set(\"nameattr\")\n    inst.parm(\"nameattr\").set(PIECE_ATTR)\n    out = lop.createNode(\"null\", \"OUT_instances\")\n    out.setInput(0, inst)\n    out.setPosition(hou.Vector2(0, -3))\n    out.setDisplayFlag(True)\n\n    li = mk(\"lopimport::2.0\", \"LOP_orient_check_import\", -1.5, -8.4)\n    li.parm(\"loppath\").set(li.relativePathTo(out))\n    li.parm(\"primpattern\").set(\"/instancer1\")                # not the hidden prototype meshes\n    uu = mk(\"unpackusd::2.0\", \"LOP_orient_check_unpackusd\", -1.5, -9.6)\n    uu.setInput(0, li)\n    uu.parm(\"output\").set(\"polygons\")\n    uu.parm(\"iterations\").set(2)                             # instancer -> instances -> meshes\n\nprint(\"Orient from cache built in %s (%d nodes) -> %s, %s%s\" % (\n    net.path(), len(created), t_out.name(), p_out.name(),\n    (\" + LOP_orient_instancing\" if ADD_LOP else \"\")))\n"}]}, {"v": "v007", "date": "2026-10-03", "notes": "v007: add_orient_from_cache.py ใช้กับ cache ที่เป็น packed ได้แล้ว ไม่ต้อง unpack ทุกเฟรม (สำหรับ RBD หนัก ๆ)\n• สคริปต์ดูเองว่า cache เป็น packed หรือ polygon แล้วเลือกทางให้\n• packed: อ่าน orient + scale จาก intrinsic packedfulltransform ของแต่ละชิ้นตรง ๆ ส่วน P ของ point ก็คือ pivot ที่ขยับแล้ว (PACKED_points)\n• prototype: timeshift ไป REST_FRAME → ตั้ง transform = identity, P = 0 → unpack แค่เฟรมนั้นเฟรมเดียว ได้ชิ้นรอบ pivot (PACKED_protos_unpack ไม่ time dependent cook ครั้งเดียว)\n• name อยู่บน point (แบบ cache ของพี่) หรือบน prim ก็ได้\n• polygon cache ยังใช้ Extract Transform แบบ v006\n\nกับดักที่เจอ:\n1) VEX: matrix3(primintrinsic(0, \"packedfulltransform\", pr)) อ่านค่า 16 ตัวเป็น 3x3 ผิดช่อง scale z กลายเป็น 0 ต้องอ่านเป็น matrix (4x4) ก่อนแล้วค่อย matrix3()\n2) ถ้าเขียน v@scale แค่บางจุด จุดอื่นได้ 0 instance หายหมด ต้องเขียนทุกจุด\n\nวัดผลแล้ว (fracture 25 ชิ้น, เฟรม 1/10/25/40, เทียบกับ unpack ของ cache): polygon, packed (name บน prim), packed (name บน point), packed ที่หมุนคนละแกนผ่าน intrinsic transform → SOP ≤ 0.0000012, LOP ≤ 0.0006\nในฉากพี่ (no_unpack, ทำมือ) เฟรม 1-20: SOP ≤ 0.0000003, LOP ≤ 0.00023\nทดสอบกับ H21.0.671 ยังไม่ได้ทดสอบใน 20.5\n\nv006: Recompute orient จาก cache (มีแค่ geometry ที่ cache ไว้ ไม่มี sim points) แล้ว instance ใน LOP\n• สคริปต์ใหม่ add_orient_from_cache.py: ตั้ง CACHE_NODE (เช่น filecache1) กับ REST_FRAME แล้วรัน\n• Extract Transform (Use Piece Attribute = name, Primitive) เทียบเฟรม rest กับทุกเฟรม → 1 point ต่อชิ้น มี P + orient + pivot\n• prototype = ชิ้นที่เฟรม rest เลื่อนด้วย -pivot ให้อยู่ที่ origin แล้วทิ้ง pivot จาก point\n• USD ห้ามมี - ในชื่อ prim (piece0-0-0 กลายเป็น piece0_0_0) instancer เลยหา prototype ไม่เจอแล้ว skip ทุกชิ้น สคริปต์ทำชื่อให้ตรงกันทั้งสองฝั่ง\n• cache ที่เป็น packed จะ unpack ให้ก่อน (เก็บ name ไว้)\n\nวัดผลแล้ว (fracture 25 ชิ้น, เฟรม 1/10/25/40): ประกอบชิ้นกลับจาก orient + P ตรงกับ cache ≤ 0.000001 · LOP (unpack กลับ) ≤ 0.0005 ทั้ง cache แบบ polygon, packed และชิ้นที่หมุนคนละแกน\nในฉากของพี่ (rbd_root_copy/filecache1) ทำมือแล้วเทียบที่เฟรม 20 ได้ 0.0000003\nทดสอบกับ H21.0.671 ยังไม่ได้ทดสอบใน 20.5\n\nv005: ใช้กล่อง fracture เป็นชิ้น root (ตามไฟล์ emittingRBD_root ของพี่)\n• ROOT_SOURCE = \"fracture\" (default): box → RBD Material Fracture → Clean (ลบ attrib/group) → Normal (cusp 0) → Assemble (pack) = piece0..pieceN-1\n• emitter สุ่มชื่อชิ้นจากจำนวนชิ้นจริง: ต่อ root เข้า input 2 ของ demo_piece_name แล้วใช้ npoints(1) ไม่ต้องแก้ตัวเลขเมื่อเปลี่ยนจำนวนชิ้น\n• ROOT_SOURCE = \"colours\" ได้แบบเดิม (กล่อง 3 สี) · EMIT_PER_FRAME = จำนวนชิ้นที่เกิดต่อเฟรม\n• โหมด BUILD_DEMO = False ใช้กับ sim ที่มีอยู่แล้วได้เหมือนเดิม: DOPNET = dopnet ของพี่, ROOT_PIECES = node ที่ assemble ชิ้น fracture\n\nวัดผลแล้ว (fracture 25 ชิ้น, 40 เฟรม): Copy to Points ทั้งแบบ packed และ points ตรงกับ sim ≤ 0.000001 · LOP ≤ 0.0004 (ทั้งฉากว่าง, ใน emittingRBD_root_lopfix, และต่อเข้า demo_rbd_dopnet1 ของพี่ใน geo1)\nไฟล์ตัวอย่าง: emittingRBD_fracture_v5.hipnc (geo ใหม่ rbd_root_copy1 ข้าง geo1 เดิม)\n\nv004: เพิ่มเวอร์ชัน LOP / Solaris (USD PointInstancer)\n• builder มี ADD_LOP = True (default) สร้าง LOP_instancing ต่อจาก target points ให้เลย\n• มีสคริปต์แยก add_lop_instancer.py สำหรับต่อ LOP เข้ากับ setup ที่มีอยู่แล้ว (ตั้ง TARGETS_NODE กับ ROOT_NODE)\n\nสองจุดที่ทำให้ instance ผิดถ้าปล่อยค่า default:\n1) Prototype Primitives = ทั้ง sopimport (เช่น /sopimport1) → ทุก instance ได้ทุกชิ้นซ้อนกัน ต้องเป็น /\u003csopimport>/* ให้แต่ละชิ้นเป็น prototype ของตัวเอง และ Prototype Index = Name Attribute (name) ให้ point ชื่อ piece3 ได้ prototype piece3\n2) LOP Import ที่ใช้ %type:Boundable & %visible จะดึง prototype mesh ที่ซ่อนอยู่มาด้วย ให้ import แค่ /instancer1\nและ Unpack USD ต้องตั้ง Iterations = 2 (instancer → instances → mesh) ไม่งั้นได้ point เดียวต่อ instance\n\nInstancer อ่าน 3@transform เองได้ แปลงเป็น orientation + scale ให้ ไม่ต้องแปลงก่อน\nวัดผลแล้ว: LOP ตรงกับ Copy to Points ≤ 0.0007 ทุกเฟรมที่เช็ค (ส่วนต่างนี้มาจาก USD เก็บ orientations เป็น half precision) ทั้ง demo ในฉากว่าง และไฟล์ emittingRBD_root ที่ใช้ชิ้น fracture 25 ชิ้นเป็น root\n\nv003: เพิ่มวิธีที่สอง import มาแค่ point (DOP Import → Create Points to Represent Objects)\n• ไม่ต้องดึง geometry ออกจากซิมเลย เบากว่า ใช้แค่ point ละชิ้น\n• ใช้ restxform ที่ Bullet เก็บไว้บน point (การหมุน + pscale ตอน emit และตำแหน่ง rest) + pivot + orient + P สร้าง transform เต็มกลับมา: world = (rest - pivot) × orient + P\n• ต้องใส่ restxform ใน Transfer Attributes ของ DOP Import (สคริปต์ใส่ให้แล้ว: orient pivot restxform name v)\n• METHOD = \"both\" (default) สร้างทั้งสองวิธีคู่กัน · \"points\" หรือ \"packed\" เลือกอันเดียว\n\nวัดผลแล้ว: ทั้งสองวิธีตรงกับซิม max_err ≤ 0.000001 ทุก point ที่เฟรม 1, 12, 30, 48 ทั้ง demo ในฉากว่างและไฟล์ emittingRBD\n\nv002: paste แล้วสร้างทั้งฉากใหม่หมด แบบเดียวกับ FX Template\n• BUILD_DEMO = True (default): สร้างชิ้น root 3 สี, emitter ที่ปล่อยชิ้นใหม่ทุกเฟรม (pscale + N สุ่ม), Bullet RBD dopnet และ chain copy-from-root ครบในตัว\n• เปิด /obj แล้วรัน = สร้าง geo ใหม่ชื่อ rbd_root_copy · เปิด Geometry network แล้วรัน = สร้างตรงนั้น ต่อลงไปใต้ node เดิม\n• Start frame ของ dopnet = start ของ playbar (START_FRAME / LINK_TO_PLAYBAR ปรับได้)\n• BUILD_DEMO = False: ต่อแค่ chain เข้าซิมของพี่ ตั้ง DOPNET กับ ROOT_PIECES\n• OBJ_PATTERN default เป็น *rbd* เพราะ * จะดึง ground plane มาด้วย\n\nวัดผลแล้ว: demo ที่สร้างจากศูนย์ในฉากว่าง และไฟล์ emittingRBD ตรงกับซิม max_err 0.000000 ทุก point ที่เฟรม 1, 12, 30, 48\nรันซ้ำใน network เดิมได้ ไม่ชนกัน\n\nปัญหา: เอาชิ้นจาก RBD sim มา Copy to Points แล้วชิ้นหมุนเพี้ยนและเลื่อนผิดที่ เพราะชิ้นต้นแบบที่ใช้ copy ไม่ได้อยู่ในท่า rest (ใช้ชิ้นที่ซิมเสร็จแล้วที่เฟรมสุดท้าย) orient เลยหมุนซ้ำทับ และ pivot จากซิมเป็นตำแหน่ง world ตอน emit\n\nวิธีหลัก: copy ชิ้น ROOT (ต้นฉบับจาก assemble) ด้วย packedfulltransform ของแต่ละชิ้นในซิม ซึ่งรวมการหมุนตอน emit + pscale + การเคลื่อนที่ของซิมไว้หมดแล้ว เปลี่ยน geo ต้นฉบับ (hi-res / โมเดลอื่น) ได้โดยไม่ต้องซิมใหม่\n\nวัดผลกับ emittingRBD.hipnc: ตรงกับซิมจริง max_err 0.000000 ทุก point ที่เฟรม 3, 12, 20, 25, 38\nทดสอบกับ H21.0.671", "previewImage": "", "previewVisual": "", "files": [{"id": "rbd-root-builder", "title": "Builder: fractured box root + RBD + root copy + LOP", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · empty scene + emittingRBD_root_lopfix", "filename": "build_rbd_root_copy_v5.py", "description": "paste ใน Python Shell แล้วสร้างทุกอย่างใหม่หมด: กล่อง fracture เป็นชิ้น root → emitter ที่สุ่มชิ้น → RBD dopnet → Copy to Points (packed / points) → LOP_instancing พร้อม LOP_check_unpackusd ไว้เทียบผล", "notes": "ชิ้นที่ emit เป็น packed อยู่แล้วหลัง Copy to Points ห้าม Assemble ซ้ำ ไม่งั้นชิ้นจะซ้อน packed สองชั้น แล้ว packedfulltransform จะชี้ไปที่ชั้นนอก\nชิ้นต้นฉบับต้องมี name ตรงกับชื่อชิ้นในซิม ถ้าซิมตั้งชื่อ piece0_12 (เติมเฟรมตอน emit) STRIP_SUFFIX = True จะตัด _12 ออกให้เป็น piece0\nใช้ได้เพราะ packed prim ในซิมเก็บ geo ต้นฉบับตัวเดียวกันไว้ข้างใน ต่างกันแค่ transform", "code": "# ============================================================================\n# RBD pieces -> copy the ROOT geometry   v005   (paste into Houdini Python Shell)\n#\n# Re-creates every simulated RBD piece by copying the ORIGINAL (root) piece with\n# that piece's full transform (emission rotation + pscale + sim motion).\n# Exact match with the sim, and the root geometry can be swapped (hi-res, a\n# different model, extra attributes) without re-simulating.\n#\n# Two ways to read the sim (METHOD):\n#   \"packed\" -> DOP Import \"Fetch Geometry\": packedfulltransform of each piece\n#   \"points\" -> DOP Import \"Create Points to Represent Objects\": one point per\n#               piece, rebuilt from restxform (emission transform) + pivot +\n#               orient + P. Lighter: no geometry comes out of the sim.\n#   \"both\"   -> builds both side by side (display flag on the points one).\n#\n# ADD_LOP = True also builds the Solaris version: a LOP network with the root\n# pieces as prototypes (one prototype per piece, picked by the point's name) and\n# a USD PointInstancer driven by the same target points.\n#\n# HOW TO USE\n#   1. Open a network in the Network Editor:\n#        - a Geometry (SOP) network -> everything is built right there\n#        - /obj                     -> a new \"rbd_root_copy\" geo is created for it\n#   2. Paste the whole thing into Windows > Python Shell and press Enter.\n#\n#   BUILD_DEMO = True  -> builds the WHOLE setup: the root pieces (ROOT_SOURCE),\n#                         a scatter emitter that births pieces every frame, the\n#                         Bullet RBD dopnet, and the root-copy chain on top.\n#                         ROOT_SOURCE = \"fracture\" -> a box broken with RBD\n#                         Material Fracture; every emitted point picks one\n#                         random fracture piece (piece0 .. pieceN-1).\n#                         ROOT_SOURCE = \"colours\"  -> 3 coloured copies of a box.\n#   BUILD_DEMO = False -> only adds the root-copy chain to YOUR sim: set DOPNET\n#                         and ROOT_PIECES (names in the open network or full paths).\n#   Existing nodes are never changed.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\nBUILD_DEMO   = True\nTARGET       = \"\"            # \"\" = the network the Network Editor is showing; or a path\nMETHOD       = \"both\"        # \"packed\" | \"points\" | \"both\"\nADD_LOP      = True          # also build the Solaris / USD PointInstancer version\nROOT_SOURCE  = \"fracture\"    # BUILD_DEMO: \"fracture\" (fractured box) | \"colours\" (3 coloured boxes)\nEMIT_PER_FRAME = 3           # BUILD_DEMO: new pieces born every frame\n\nDOPNET       = \"dopnet1\"     # BUILD_DEMO = False: your RBD dopnet\nROOT_PIECES  = \"assemble3\"   # BUILD_DEMO = False: root pieces with a \"name\" (piece0, piece1, ...)\nOBJ_PATTERN  = \"*rbd*\"       # DOP objects to import (\"*\" would also pull in the ground plane)\nSTRIP_SUFFIX = True          # sim names like piece0_12 -> piece0 (emission-frame suffix)\n\nSTART_FRAME  = None          # None = playbar start (sim start frame)\nLINK_TO_PLAYBAR = False      # True = expression to $RFSTART instead of a fixed number\n# ----------------------------------------------------------------------------\n\n\ndef current_network():\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\ndef sop_network(net):\n    cat = net.childTypeCategory().name()\n    if cat == \"Sop\":\n        return net\n    if cat == \"Object\":\n        return net.createNode(\"geo\", \"rbd_root_copy\")\n    raise hou.Error(\"Open a Geometry (SOP) network or /obj - %s holds %s nodes.\" % (net.path(), cat))\n\n\ndef find(name, net):\n    n = net.node(name) or hou.node(name)\n    if n is None:\n        raise hou.Error(\"Node not found: %r (looked in %s and as a full path)\" % (name, net.path()))\n    return n\n\n\ndef set_start_frame(node):\n    \"\"\"Point a sim's start frame at the playbar start (or START_FRAME).\"\"\"\n    p = node.parm(\"startframe\")\n    if p is None:\n        return\n    if START_FRAME is None and LINK_TO_PLAYBAR:\n        p.setExpression(\"$RFSTART\")\n    else:\n        p.set(START_FRAME if START_FRAME is not None else hou.playbar.frameRange()[0])\n\n\nnet = sop_network(current_network())\nys = [c.position()[1] for c in net.children()]\ntop = (min(ys) - 2) if ys else 0          # build below whatever is already there\ncreated = []\n\n\ndef mk(parent, type_name, name, x, y):\n    n = parent.createNode(type_name, name)\n    n.setPosition(hou.Vector2(x, top + y))\n    created.append(n)\n    return n\n\n\ndef mk_dop(parent, type_name, name, x, y):\n    n = parent.createNode(type_name, name)\n    n.setPosition(hou.Vector2(x, y))\n    return n\n\n\nif BUILD_DEMO:\n    box = mk(net, \"box\", \"demo_box\", 0, 0)\n    box.parm(\"type\").set(1)                            # polygon mesh\n    for p in (\"divrate1\", \"divrate2\", \"divrate3\"):\n        box.parm(p).set(2)\n    if ROOT_SOURCE == \"fracture\":\n        # --- root pieces: the box fractured, cleaned, packed as piece0..pieceN-1 --\n        frac = mk(net, \"rbdmaterialfracture::3.0\", \"demo_fracture\", 0, -1.2)\n        frac.setInput(0, box)                          # default Concrete fracture\n        cln = mk(net, \"clean\", \"demo_clean\", 0, -2.4)\n        cln.setInput(0, frac)                          # 1st output = the fractured pieces\n        cln.parm(\"dodelattribs\").set(1)                # drop fracture attribs + groups; assemble renames\n        cln.parm(\"dodelgroups\").set(1)\n        nrm = mk(net, \"normal\", \"demo_normal\", 0, -3.6)\n        nrm.setInput(0, cln)\n        nrm.parm(\"cuspangle\").set(0)                   # hard edges on the cut faces\n        root_in = nrm\n    elif ROOT_SOURCE == \"colours\":\n        # --- root pieces: one box, three colours -----------------------------------\n        cols = []\n        for i, rgb in enumerate(((0, 0, 1), (1, 0, 0), (0, 1, 0))):\n            c = mk(net, \"color\", \"demo_color%d\" % (i + 1), -3 + 3 * i, -1.2)\n            c.setInput(0, box)\n            c.parmTuple(\"color\").set(rgb)\n            cols.append(c)\n        mrg = mk(net, \"merge\", \"demo_merge\", 0, -2.4)\n        for i, c in enumerate(cols):\n            mrg.setInput(i, c)\n        root_in = mrg\n    else:\n        raise hou.Error('ROOT_SOURCE must be \"fracture\" or \"colours\" - got %r' % ROOT_SOURCE)\n    root = mk(net, \"assemble\", \"ROOT_assemble\", 0, -4.8)\n    root.setInput(0, root_in)\n    root.parm(\"pack_geo\").set(1)                       # packed pieces named piece0, piece1, ...\n\n    # --- emitter: new points every frame, random pscale + N, random piece name ---\n    grid = mk(net, \"grid\", \"demo_grid\", 7, 0)\n    sc = mk(net, \"scatter::2.0\", \"demo_scatter\", 7, -1.2)\n    sc.setInput(0, grid)\n    sc.parm(\"npts\").set(EMIT_PER_FRAME)\n    sc.parm(\"seed\").setExpression(\"$FF\")               # new positions every frame\n    lift = mk(net, \"xform\", \"demo_lift\", 7, -2.4)\n    lift.setInput(0, sc)\n    lift.parm(\"ty\").set(4.8)\n    rs = mk(net, \"attribrandomize\", \"demo_rand_pscale\", 7, -3.6)\n    rs.setInput(0, lift)\n    rs.parm(\"name\").set(\"pscale\")\n    rs.parm(\"minx\").set(0.2)\n    rs.parm(\"seed\").setExpression(\"$F\")\n    rn = mk(net, \"attribrandomize\", \"demo_rand_N\", 7, -4.8)\n    rn.setInput(0, rs)\n    rn.parm(\"name\").set(\"N\")\n    rn.parm(\"seed\").setExpression(\"$F\")\n    nm = mk(net, \"attribwrangle\", \"demo_piece_name\", 7, -6)\n    nm.setInput(0, rn)\n    nm.setInput(1, root)                               # 2nd input: the root pieces, to count them\n    nm.parm(\"snippet\").set(r'''\n// pick one of the root pieces at random (piece0 .. pieceN-1)\nint num  = npoints(1);\nint pick = min(int(floor(rand(@ptnum + @Frame * 17.31) * num)), num - 1);\ns@name = 'piece' + itoa(pick);\n''')\n\n    cp_emit = mk(net, \"copytopoints::2.0\", \"demo_emit_copy\", 3.5, -7.2)\n    cp_emit.setInput(0, root)\n    cp_emit.setInput(1, nm)\n    cp_emit.parm(\"useidattrib\").set(1)                 # piece0 -> root piece0, ...\n    cp_emit.parm(\"targetattribs\").set(1)               # copy name (etc.) from the emit points\n    cp_emit.parm(\"applyattribs1\").set(\"*,^v,^Alpha,^N,^up,^pscale,^scale,^orient,^rot,^pivot,^trans,^transform\")\n    # the copies are already packed pieces; packing them again would nest them\n    fr = mk(net, \"attribwrangle\", \"demo_emit_frame_name\", 3.5, -9.6)\n    fr.setInput(0, cp_emit)\n    fr.parm(\"snippet\").set(\"s@name += '_' + itoa(@Frame);\")   # unique name per emitted piece\n\n    # --- Bullet RBD sim that adds the new pieces every frame -------------------\n    dop = mk(net, \"dopnet\", \"demo_rbd_dopnet\", 3.5, -10.8)\n    dop.setInput(0, fr)\n    set_start_frame(dop)\n    obj = mk_dop(dop, \"rbdpackedobject\", \"rbdpackedobject1\", 0, 0)\n    obj.parm(\"geosource\").set(1)                       # first context geometry\n    obj.parm(\"createframe\").setExpression(\"$F\")        # re-create -> adds this frame's pieces\n    sol = mk_dop(dop, \"bulletrbdsolver\", \"bulletrbdsolver1\", 0, -1)\n    sol.setInput(0, obj)\n    grav = mk_dop(dop, \"gravity\", \"gravity1\", 0, -2)\n    grav.setInput(0, sol)\n    ground = mk_dop(dop, \"groundplane\", \"groundplane1\", -3, -2)\n    dm = mk_dop(dop, \"merge\", \"merge1\", -1.5, -3)\n    dm.setInput(0, ground)\n    dm.setInput(1, grav)\n    dout = mk_dop(dop, \"output\", \"output\", -1.5, -4)\n    dout.setInput(0, dm)\n    dout.setDisplayFlag(True)\n    x0, y0 = 0, -12.5\nelse:\n    dop = find(DOPNET, net)\n    root = find(ROOT_PIECES, net)\n    x0, y0 = root.position()[0] - 0, root.position()[1] - top - 2\n\n# --- LOP / Solaris: the same copy as a USD PointInstancer ---------------------\ndef build_lop(net, targets, root, x, y, tag=\"\"):\n    \"\"\"targets: SOP points with name + transform (or orient/pscale).\n    root: SOP root pieces, each with a name. Returns the SOP node that unpacks\n    the instancer back to geometry (for checking against the Copy to Points).\"\"\"\n    t_out = net.createNode(\"null\", \"LOP_targets\" + tag)\n    t_out.setInput(0, targets)\n    t_out.setPosition(hou.Vector2(x, y))\n    p_out = net.createNode(\"null\", \"LOP_prototypes\" + tag)\n    p_out.setInput(0, root)\n    p_out.setPosition(hou.Vector2(x + 3, y))\n\n    lop = net.createNode(\"lopnet\", \"LOP_instancing\" + tag)\n    lop.setPosition(hou.Vector2(x + 1.5, y - 1.2))\n    si = lop.createNode(\"sopimport\", \"root_pieces\")          # prims: /root_pieces/piece0, ...\n    si.parm(\"soppath\").set(si.relativePathTo(p_out))\n    si.setPosition(hou.Vector2(3, 0))\n    inst = lop.createNode(\"instancer\", \"instancer1\")         # prim: /instancer1\n    inst.setInput(1, si)                                     # prototypes come in the 2nd input\n    inst.setPosition(hou.Vector2(0, -1.5))\n    inst.parm(\"method\").set(\"pointinstancer\")\n    inst.parm(\"transformsourcemode\").set(\"extsop\")           # target points from a SOP\n    inst.parm(\"pointsoppath\").set(inst.relativePathTo(t_out))\n    inst.parm(\"protosourcemode\").set(\"second\")\n    inst.parm(\"protopattern\").set(\"/root_pieces/*\")          # EVERY piece is its own prototype\n    inst.parm(\"protoindexsrc\").set(\"nameattr\")               # point name picks the prototype\n    inst.parm(\"nameattr\").set(\"name\")\n    out = lop.createNode(\"null\", \"OUT_instances\")\n    out.setInput(0, inst)\n    out.setPosition(hou.Vector2(0, -3))\n    out.setDisplayFlag(True)\n\n    # back to SOPs, only to check the result (import the instancer prim ONLY -\n    # a Boundable pattern would also pull in the hidden prototype meshes)\n    li = net.createNode(\"lopimport::2.0\", \"LOP_check_import\" + tag)\n    li.parm(\"loppath\").set(li.relativePathTo(out))\n    li.parm(\"primpattern\").set(\"/instancer1\")\n    li.setPosition(hou.Vector2(x + 1.5, y - 2.4))\n    uu = net.createNode(\"unpackusd::2.0\", \"LOP_check_unpackusd\" + tag)\n    uu.setInput(0, li)\n    uu.parm(\"output\").set(\"polygons\")\n    uu.parm(\"iterations\").set(2)                             # instancer -> instances -> meshes\n    uu.setPosition(hou.Vector2(x + 1.5, y - 3.6))\n    return [t_out, p_out, lop, li, uu], uu\n\n\n# --- the root copy -----------------------------------------------------------\nif METHOD not in (\"packed\", \"points\", \"both\"):\n    raise hou.Error('METHOD must be \"packed\", \"points\" or \"both\" - got %r' % METHOD)\nSTRIP = ('s@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0\\n' if STRIP_SUFFIX else \"\")\n\nsrc = mk(net, \"unpack\", \"ROOT_pieces\", x0, y0)\nsrc.setInput(0, root)\nsrc.parm(\"transfer_attributes\").set(\"name\")\nouts = []\n\nif METHOD in (\"packed\", \"both\"):\n    # A) packed: read each simulated piece's full transform off its packed prim\n    imp = mk(net, \"dopimport::2.0\", \"ROOT_sim_pieces\", x0 + 4, y0)\n    imp.parm(\"doppath\").set(imp.relativePathTo(dop))\n    imp.parm(\"objpattern\").set(OBJ_PATTERN)          # default style = fetch packed geometry\n\n    tgt = mk(net, \"attribwrangle\", \"ROOT_targets\", x0 + 4, y0 - 1.2)\n    tgt.setInput(0, imp)\n    tgt.parm(\"snippet\").set(r'''\n// One target point per simulated piece, carrying that piece's WHOLE transform:\n// emission rotation + pscale + the sim's motion.\nint prim = pointprims(0, @ptnum)[0];\nmatrix M = primintrinsic(0, \"packedfulltransform\", prim);\n3@transform = matrix3(M);\nv@P = set(getcomp(M, 3, 0), getcomp(M, 3, 1), getcomp(M, 3, 2));\n''' + STRIP)\n\n    clean = mk(net, \"attribdelete\", \"ROOT_targets_clean\", x0 + 4, y0 - 2.4)\n    clean.setInput(0, tgt)\n    clean.parm(\"negate\").set(1)                      # keep only these point attributes\n    clean.parm(\"ptdel\").set(\"name transform v\")\n\n    pts = mk(net, \"add\", \"ROOT_points_only\", x0 + 4, y0 - 3.6)\n    pts.setInput(0, clean)\n    pts.parm(\"remove\").set(1)                        # drop the packed prims, keep the points\n\n    cp = mk(net, \"copytopoints::2.0\", \"ROOT_copy\", x0 + 2, y0 - 4.8)\n    cp.setInput(0, src)\n    cp.setInput(1, pts)\n    cp.parm(\"useidattrib\").set(1)                    # Piece Attribute = name\n    out = mk(net, \"null\", \"OUT_root_copy\", x0 + 2, y0 - 6)\n    out.setInput(0, cp)\n    outs.append(out)\n\nif METHOD in (\"points\", \"both\"):\n    # B) points: one point per piece straight from the sim, no geometry imported\n    pimp = mk(net, \"dopimport::2.0\", \"ROOT_sim_points\", x0 - 4, y0)\n    pimp.parm(\"doppath\").set(pimp.relativePathTo(dop))\n    pimp.parm(\"objpattern\").set(OBJ_PATTERN)\n    pimp.parm(\"importstyle\").set(1)                  # Create Points to Represent Objects\n    pimp.parm(\"transferattributes\").set(\"orient pivot restxform name v\")\n\n    ptgt = mk(net, \"attribwrangle\", \"ROOT_point_targets\", x0 - 4, y0 - 1.2)\n    ptgt.setInput(0, pimp)\n    ptgt.parm(\"snippet\").set(r'''\n// Rebuild each piece's full transform from the sim point alone:\n//   restxform = emission rotation + pscale (3x3) and the rest position (row 3)\n//   world     = (rest - pivot) * orient + P\nmatrix  X  = 4@restxform;\nmatrix3 A  = matrix3(X);\nvector  rp = set(getcomp(X, 3, 0), getcomp(X, 3, 1), getcomp(X, 3, 2));\nmatrix3 R  = qconvert(p@orient);\n3@transform = A * R;\nv@P = (rp - v@pivot) * R + v@P;\n''' + STRIP)\n\n    pclean = mk(net, \"attribdelete\", \"ROOT_point_targets_clean\", x0 - 4, y0 - 2.4)\n    pclean.setInput(0, ptgt)\n    pclean.parm(\"negate\").set(1)                     # orient/pivot must go, transform wins\n    pclean.parm(\"ptdel\").set(\"name transform v\")\n\n    pcp = mk(net, \"copytopoints::2.0\", \"ROOT_copy_points\", x0 - 2, y0 - 4.8)\n    pcp.setInput(0, src)\n    pcp.setInput(1, pclean)\n    pcp.parm(\"useidattrib\").set(1)\n    pout = mk(net, \"null\", \"OUT_root_copy_points\", x0 - 2, y0 - 6)\n    pout.setInput(0, pcp)\n    outs.append(pout)\n\nouts[-1].setDisplayFlag(True)\nouts[-1].setRenderFlag(True)\nprint(\"RBD root copy (%s) built in %s (%d nodes) -> %s\" % (METHOD, net.path(), len(created), \", \".join(o.name() for o in outs)))\n\nif ADD_LOP:\n    lop_targets = pclean if METHOD in (\"points\", \"both\") else pts\n    nodes, lop_check = build_lop(net, lop_targets, src, x0 - 10, y0)\n    created += nodes\n    print(\"LOP instancing built -> %s (unpacked check: %s)\" % (nodes[2].path(), lop_check.name()))\n", "visual": ""}, {"id": "add-lop-instancer", "title": "Add the LOP PointInstancer to an existing setup", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · emittingRBD_root", "filename": "add_lop_instancer.py", "description": "ต่อเวอร์ชัน LOP เข้ากับ SOP ที่มีอยู่แล้ว: ต้องมี target points (name + transform หรือ orient/pscale) กับชิ้น root ที่มี name ตั้ง TARGETS_NODE / ROOT_NODE แล้วรัน", "notes": "สร้าง LOP_targets, LOP_prototypes (null), LOP_instancing (sopimport root_pieces → instancer1 → OUT_instances) และ LOP_check_import → LOP_check_unpackusd กลับมาใน SOP ไว้เช็ค\nใช้ได้กับ Copy to Points ทั่วไปด้วย ไม่จำกัดแค่ RBD", "code": "# ============================================================================\n# Copy pieces as a USD PointInstancer in LOPs   (paste into Houdini Python Shell)\n#\n# Takes the target points of a Copy to Points (each point: name + transform, or\n# orient/pscale) and the root pieces (each with a name) and builds the Solaris\n# version: a LOP network with ONE prototype per piece, picked by the point's\n# name, plus a LOP Import -> Unpack USD back in SOPs to check the result.\n#\n# The two things that make it wrong if left at their defaults:\n#   - Prototype Primitives = the whole SOP import  -> every instance gets ALL\n#     pieces. It must be /\u003csopimport>/* so each piece is its own prototype,\n#     and Prototype Index = Name Attribute so a point named piece3 gets piece3.\n#   - LOP Import pattern %type:Boundable also matches the hidden prototype\n#     meshes. Import the instancer prim only.\n#\n# HOW TO USE\n#   1. Open the Geometry network that holds the two SOP nodes (or set TARGET).\n#   2. Set TARGETS_NODE and ROOT_NODE below, paste into Windows > Python Shell.\n#   New nodes are created (LOP_*); existing nodes are not changed.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\nTARGET       = \"\"                           # \"\" = the network the Network Editor is showing\nTARGETS_NODE = \"ROOT_point_targets_clean\"   # points: name + transform (e.g. from the RBD root copy)\nROOT_NODE    = \"ROOT_pieces\"                # root pieces, each with a name\n# ----------------------------------------------------------------------------\n\n\ndef current_network():\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\ndef find(name, net):\n    n = net.node(name) or hou.node(name)\n    if n is None:\n        raise hou.Error(\"Node not found: %r (looked in %s and as a full path)\" % (name, net.path()))\n    return n\n# --- LOP / Solaris: the same copy as a USD PointInstancer ---------------------\ndef build_lop(net, targets, root, x, y, tag=\"\"):\n    \"\"\"targets: SOP points with name + transform (or orient/pscale).\n    root: SOP root pieces, each with a name. Returns the SOP node that unpacks\n    the instancer back to geometry (for checking against the Copy to Points).\"\"\"\n    t_out = net.createNode(\"null\", \"LOP_targets\" + tag)\n    t_out.setInput(0, targets)\n    t_out.setPosition(hou.Vector2(x, y))\n    p_out = net.createNode(\"null\", \"LOP_prototypes\" + tag)\n    p_out.setInput(0, root)\n    p_out.setPosition(hou.Vector2(x + 3, y))\n\n    lop = net.createNode(\"lopnet\", \"LOP_instancing\" + tag)\n    lop.setPosition(hou.Vector2(x + 1.5, y - 1.2))\n    si = lop.createNode(\"sopimport\", \"root_pieces\")          # prims: /root_pieces/piece0, ...\n    si.parm(\"soppath\").set(si.relativePathTo(p_out))\n    si.setPosition(hou.Vector2(3, 0))\n    inst = lop.createNode(\"instancer\", \"instancer1\")         # prim: /instancer1\n    inst.setInput(1, si)                                     # prototypes come in the 2nd input\n    inst.setPosition(hou.Vector2(0, -1.5))\n    inst.parm(\"method\").set(\"pointinstancer\")\n    inst.parm(\"transformsourcemode\").set(\"extsop\")           # target points from a SOP\n    inst.parm(\"pointsoppath\").set(inst.relativePathTo(t_out))\n    inst.parm(\"protosourcemode\").set(\"second\")\n    inst.parm(\"protopattern\").set(\"/root_pieces/*\")          # EVERY piece is its own prototype\n    inst.parm(\"protoindexsrc\").set(\"nameattr\")               # point name picks the prototype\n    inst.parm(\"nameattr\").set(\"name\")\n    out = lop.createNode(\"null\", \"OUT_instances\")\n    out.setInput(0, inst)\n    out.setPosition(hou.Vector2(0, -3))\n    out.setDisplayFlag(True)\n\n    # back to SOPs, only to check the result (import the instancer prim ONLY -\n    # a Boundable pattern would also pull in the hidden prototype meshes)\n    li = net.createNode(\"lopimport::2.0\", \"LOP_check_import\" + tag)\n    li.parm(\"loppath\").set(li.relativePathTo(out))\n    li.parm(\"primpattern\").set(\"/instancer1\")\n    li.setPosition(hou.Vector2(x + 1.5, y - 2.4))\n    uu = net.createNode(\"unpackusd::2.0\", \"LOP_check_unpackusd\" + tag)\n    uu.setInput(0, li)\n    uu.parm(\"output\").set(\"polygons\")\n    uu.parm(\"iterations\").set(2)                             # instancer -> instances -> meshes\n    uu.setPosition(hou.Vector2(x + 1.5, y - 3.6))\n    return [t_out, p_out, lop, li, uu], uu\n\n\nnet = current_network()\nif net.childTypeCategory().name() != \"Sop\":\n    raise hou.Error(\"Open the Geometry (SOP) network that holds %s - %s is not one.\" % (TARGETS_NODE, net.path()))\ntargets = find(TARGETS_NODE, net)\nroot = find(ROOT_NODE, net)\npos = targets.position()\nnodes, check = build_lop(net, targets, root, pos[0] - 8, pos[1] - 2)\nprint(\"LOP instancing built in %s -> %s (unpacked check: %s)\" % (net.path(), nodes[2].path(), check.name()))\n", "visual": ""}, {"id": "rbd-root-targets-vex", "title": "ROOT_targets: full transform per piece", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "rbd_root_targets.vfl", "description": "ต่อหลัง DOP Import แบบ Fetch Packed Geometry ได้ target หนึ่ง point ต่อชิ้น มี 3@transform กับ P ตรงกับชิ้นในซิม แล้ว Copy to Points ชิ้น root (Piece Attribute = name)", "notes": "ต่อจากนี้: Attribute Delete (Delete Non Selected: name transform v) → Add (Delete Geometry But Keep the Points)\nต้องลบ orient / pivot / pscale / N ทิ้ง ไม่งั้นจะไปแย่ง transform", "code": "// One target point per simulated piece, carrying that piece's WHOLE transform:\n// emission rotation + pscale + the sim's motion.\nint prim = pointprims(0, @ptnum)[0];\nmatrix M = primintrinsic(0, \"packedfulltransform\", prim);\n3@transform = matrix3(M);\nv@P = set(getcomp(M, 3, 0), getcomp(M, 3, 1), getcomp(M, 3, 2));\ns@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0 (drop if names already match)\n", "visual": ""}, {"id": "rbd-point-targets-vex", "title": "ROOT_point_targets: points-only import", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "rbd_point_targets.vfl", "description": "วิธีที่สอง: ต่อหลัง DOP Import แบบ Create Points to Represent Objects ได้ 3@transform กับ P ของแต่ละชิ้นจาก point ของซิมอย่างเดียว ไม่ต้อง import geometry", "notes": "DOP Import ต้องใส่ Transfer Attributes = orient pivot restxform name v (restxform สำคัญที่สุด ถ้าไม่มีจะได้ชิ้นที่ไม่หมุนตอน emit และไม่มี pscale)\nต่อจากนี้: Attribute Delete (Delete Non Selected: name transform v) แล้วเข้า Copy to Points ได้เลย ไม่ต้องใช้ Add SOP เพราะไม่มี prim ติดมา", "code": "// Points-only method: DOP Import set to \"Create Points to Represent Objects\",\n// Transfer Attributes = orient pivot restxform name v\n// One point per piece -> rebuild that piece's WHOLE transform from the sim point:\n//   restxform = emission rotation + pscale (3x3) and the rest position (row 3)\n//   world     = (rest - pivot) * orient + P\nmatrix  X  = 4@restxform;\nmatrix3 A  = matrix3(X);\nvector  rp = set(getcomp(X, 3, 0), getcomp(X, 3, 1), getcomp(X, 3, 2));\nmatrix3 R  = qconvert(p@orient);\n3@transform = A * R;\nv@P = (rp - v@pivot) * R + v@P;\ns@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0 (drop if names already match)\n", "visual": ""}, {"id": "rbd-back-to-rest-vex", "title": "back_to_rest_pose: final-frame pieces → rest", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "back_to_rest_pose.vfl", "description": "อีกทางหนึ่ง ถ้าอยาก copy ชิ้นที่ fetch มาจากซิม (เช่นเฟรมสุดท้าย) แทนชิ้น root: ถอยการหมุนและการเลื่อนของซิมออก ให้ชิ้นกลับไปอยู่ตรงจุดที่ emit แล้วใช้ orient / pivot / P ของ RBD points ตามปกติ", "notes": "วัดแล้วตรงกับซิม max_err 0.00000 ที่เฟรม 5, 15, 25, 36 · Timeshift ของสอง input ต้องเป็นเฟรมเดียวกัน", "code": "// Alternative: put the FINAL-frame packed pieces back into their REST pose, then\n// Copy to Points re-applies the sim per frame:  world = (rest - pivot) * orient + P\n// input 0 = packed pieces fetched at the rest frame (Timeshift of a Fetch-Packed DOP Import)\n// input 1 = RBD points (DOP Import, Create Points) timeshifted to the SAME frame\nint pt = findattribval(1, \"point\", \"name\", s@name);\nif (pt \u003c 0) { removepoint(0, @ptnum); return; }\nvector4 qi = qinvert(point(1, \"orient\", pt));\nvector  P1 = point(1, \"P\", pt);\nvector  pv = point(1, \"pivot\", pt);\nint prim = pointprims(0, @ptnum)[0];\nmatrix3 T = primintrinsic(0, \"transform\", prim);\nsetprimintrinsic(0, \"transform\", prim, T * qconvert(qi));   // remove the sim's rotation\nv@P = qrotate(qi, v@P - P1) + pv;                           // move back to where it was emitted\n", "visual": ""}, {"id": "measure-orient-diff-vex", "title": "Measure orient difference between two copies", "lang": "vex", "context": "Attribute Wrangle · Detail", "tested": "Houdini 21.0.671", "filename": "measure_orient_diff.vfl", "description": "เช็คว่า geo สองชุด (ชิ้นเดียวกัน) หมุนต่างกันกี่องศา รอบแกนไหน เลื่อนไปเท่าไหร่ โดยวัดจากตำแหน่ง point จริง ไม่ต้องพึ่ง attribute orient", "notes": "อ่านผล: angle ≈ 0 แต่ offset ไม่ 0 = ปัญหา pivot · angle ≈ 180 = แกนกลับด้าน · fit_rms สูง = shape ต่างด้วย (scale หรือลำดับ point ไม่ตรง)\nทางไม่ต้องเขียนโค้ด: Extract Transform SOP (input 1 = ตัวถูก, input 2 = ตัวที่เช็ค)", "code": "// Measure how two copies of the SAME geometry differ (same point count + order).\n// Detail Wrangle: input 0 = the copy you are checking, input 1 = the reference.\nint n = npoints(0);\nif (n != npoints(1)) { warning(\"point count differs: %d vs %d\", n, npoints(1)); return; }\n\nvector c0 = 0, c1 = 0;\nfor (int i = 0; i \u003c n; i++) { c0 += point(0, \"P\", i); c1 += point(1, \"P\", i); }\nc0 /= n; c1 /= n;\n\nmatrix3 H = 0;\nfor (int i = 0; i \u003c n; i++)\n    H += outerproduct(point(1, \"P\", i) - c1, point(0, \"P\", i) - c0);\nmatrix3 M = polardecomp(H);                 // pure rotation part\nif (determinant(M) \u003c 0) warning(\"mirror, not a rotation: flipped or negative scale\");\n\nvector4 q = quaternion(M);\nfloat err = 0;\nfor (int i = 0; i \u003c n; i++)\n    err += length2((point(1, \"P\", i) - c1) * M - (point(0, \"P\", i) - c0));\n\np@diff_orient    = q;\nf@diff_angle_deg = degrees(2 * acos(clamp(abs(q.w), 0, 1)));\nv@diff_axis      = normalize(set(q.x, q.y, q.z));\nv@diff_offset    = c0 - c1;\nf@fit_rms        = sqrt(err / n);           // ~0 = only a rigid rotation apart\n", "visual": ""}, {"id": "add-orient-from-cache", "title": "Recompute orient from a cache (packed or polygons) → LOP PointInstancer", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · empty scene (polygons / packed prim name / packed point name / packed spin) + Plug's no_unpack", "filename": "add_orient_from_cache.py", "description": "มีแค่ cache ของชิ้นไม่มี sim points: สร้าง point ต่อชิ้นพร้อม orient แล้ว instance ใน LOP ถ้า cache เป็น packed จะอ่าน packedfulltransform ตรง ๆ ไม่ unpack ทุกเฟรม (unpack แค่เฟรม rest ทำ prototype) ถ้าเป็น polygon ใช้ Extract Transform ตั้ง CACHE_NODE กับ REST_FRAME แล้วรัน", "notes": "packed: ORIENT_rest → PACKED_protos_origin → PACKED_protos_unpack → ORIENT_protos_path → OUT_orient_protos และ PACKED_points → OUT_orient_points\npolygon: ORIENT_rest → ORIENT_extract → ORIENT_points / ORIENT_protos → OUT_*\nADD_LOP = True สร้าง LOP_orient_instancing และ LOP_orient_check_unpackusd ไว้เช็คใน SOP\nชื่อชิ้นถูกแก้ให้ USD รับ (piece0-0-0 → piece0_0_0) ทั้งฝั่ง point และ prototype\nREST_FRAME ต้องเป็นเฟรมที่ชิ้นยังไม่ขยับ", "visual": "", "code": "# ============================================================================\n# Recompute orient from a cache -> LOP PointInstancer   (paste into Houdini Python Shell)\n#\n# For when all you have is the CACHED geometry of the sim and no sim points.\n# Rebuilds one point per piece with P + orient, then instances the rest pieces\n# on those points in LOPs. Two modes, picked from the cache itself:\n#   - PACKED cache (heavy RBD): orient + scale come straight from each packed\n#     prim's packedfulltransform. Nothing is unpacked per frame; only the rest\n#     frame is unpacked once for the prototypes.\n#   - POLYGON cache (unpacked pieces with a name): Extract Transform with Use\n#     Piece Attribute compares every frame to the rest frame.\n#\n# The two things that make it wrong if left alone:\n#   - Prototypes must sit at the origin, around the pivot the points rotate\n#     about: packed -> the prim's own pivot (transform set to identity, P = 0,\n#     then unpack); polygons -> Extract Transform's pivot (rest centre).\n#   - USD prim names cannot hold \"-\" (piece0-0-0 becomes piece0_0_0), so the\n#     instancer finds no prototype by name and skips every instance. Both\n#     sides get the same cleaned name.\n#\n# HOW TO USE\n#   1. Open the Geometry network that holds the cache (or set TARGET).\n#   2. Set CACHE_NODE (and REST_FRAME), paste into Windows > Python Shell.\n#   New nodes are created (ORIENT_* / PACKED_*, LOP_*); existing nodes are not changed.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\nTARGET       = \"\"            # \"\" = the network the Network Editor is showing\nCACHE_NODE   = \"filecache1\"  # cached sim: packed prims, or polygons, with a piece name\nPIECE_ATTR   = \"name\"        # attribute that names each piece (prim, or point on packed)\nREST_FRAME   = 1             # frame where the pieces are at rest (not yet moved)\nADD_LOP      = True          # also build the LOP PointInstancer + a check back in SOPs\n# ----------------------------------------------------------------------------\n\n\ndef current_network():\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\ndef find(name, net):\n    n = net.node(name) or hou.node(name)\n    if n is None:\n        raise hou.Error(\"Node not found: %r (looked in %s and as a full path)\" % (name, net.path()))\n    return n\n\n\nnet = current_network()\nif net.childTypeCategory().name() != \"Sop\":\n    raise hou.Error(\"Open the Geometry (SOP) network that holds %s - %s is not one.\" % (CACHE_NODE, net.path()))\ncache = find(CACHE_NODE, net)\ngeo = cache.geometry()\nif geo is None:\n    raise hou.Error(\"%s has no geometry (cook error?): %s\" % (cache.path(), \"; \".join(cache.errors())))\nPACKED = any(isinstance(p, hou.PackedPrim) for p in geo.prims())\nif geo.findPrimAttrib(PIECE_ATTR) is None and not (PACKED and geo.findPointAttrib(PIECE_ATTR)):\n    raise hou.Error(\"%s has no %r attribute on its pieces - set PIECE_ATTR.\" % (cache.path(), PIECE_ATTR))\n\nys = [c.position()[1] for c in net.children()]\ntop = min(ys) - 2\nx0 = cache.position()[0]\ncreated = []\n\n\ndef mk(type_name, name, x, y, parent=None):\n    n = (parent or net).createNode(type_name, name)\n    n.setPosition(hou.Vector2(x0 + x, top + y))\n    created.append(n)\n    return n\n\n\nCLEAN_NAME = r\"\"\"\n// USD prim names allow only letters, digits and _ (piece0-0-0 -> piece0_0_0)\nnm = re_replace(\"[^A-Za-z0-9_]\", \"_\", nm);\nif (re_match(\"^[0-9]\", nm)) nm = \"_\" + nm;\n\"\"\"\nA = {\"a\": PIECE_ATTR, \"clean\": CLEAN_NAME}\n\nrest = mk(\"timeshift\", \"ORIENT_rest\", -3, -1.2)              # the pieces at rest\nrest.setInput(0, cache)\nrest.parm(\"frame\").deleteAllKeyframes()\nrest.parm(\"frame\").set(REST_FRAME)\n\nif PACKED:\n    # every frame: one point per packed prim, nothing unpacked\n    pts = mk(\"attribwrangle\", \"PACKED_points\", 0, -2.4)\n    pts.setInput(0, cache)\n    pts.parm(\"snippet\").set(r\"\"\"\n// orient (+ scale) straight from the packed prim; P is already the moved pivot\nint pr = pointprims(0, @ptnum)[0];\nmatrix m4 = primintrinsic(0, \"packedfulltransform\", pr);   // read as 4x4 first: matrix3(primintrinsic(..))\nmatrix3 m = matrix3(m4);                                   // would read the 16 values as a 3x3\nvector s = set(length(set(m.xx, m.xy, m.xz)), length(set(m.yx, m.yy, m.yz)), length(set(m.zx, m.zy, m.zz)));\nscale(m, 1.0 / s);\np@orient = quaternion(m);\nv@scale = s;   // write on EVERY point: a partial write leaves 0 (instance vanishes) elsewhere\nstring nm = haspointattrib(0, \"%(a)s\") ? point(0, \"%(a)s\", @ptnum) : prim(0, \"%(a)s\", pr);\n%(clean)s\ns@%(a)s = nm;\nremoveprim(0, pr, 0);\n\"\"\" % A)\n    # rest frame only: drop the packed transform -> unpack gives (piece - pivot)\n    zero = mk(\"attribwrangle\", \"PACKED_protos_origin\", -3, -2.4)\n    zero.setInput(0, rest)\n    zero.parm(\"snippet\").set(r\"\"\"\nint pr = pointprims(0, @ptnum)[0];\nmatrix3 I = ident();\nsetprimintrinsic(0, \"transform\", pr, I);\nv@P = {0, 0, 0};\n\"\"\")\n    protos = mk(\"unpack\", \"PACKED_protos_unpack\", -3, -3.6)  # cooks once (rest frame only)\n    protos.setInput(0, zero)\n    protos.parm(\"transfer_attributes\").set(PIECE_ATTR)\nelse:\n    ext = mk(\"extracttransform\", \"ORIENT_extract\", 0, -2.4)  # one point per piece: P orient pivot name\n    ext.setInput(0, rest)\n    ext.setInput(1, cache)\n    ext.parm(\"usepieceattrib\").set(1)\n    ext.parm(\"pieceattrib\").set(PIECE_ATTR)\n    ext.parm(\"pieceattribclass\").set(0)                      # Primitive\n\n    pts = mk(\"attribwrangle\", \"ORIENT_points\", 0, -3.6)\n    pts.setInput(0, ext)\n    pts.parm(\"snippet\").set(r\"\"\"\n// prototypes are centred at the origin, so pivot is not needed any more\nremovepointattrib(0, \"pivot\");\nstring nm = s@%(a)s;\n%(clean)s\ns@%(a)s = nm;\n\"\"\" % A)\n\n    protos = mk(\"attribwrangle\", \"ORIENT_protos\", -3, -3.6)  # rest pieces, each at the origin\n    protos.setInput(0, rest)\n    protos.setInput(1, ext)\n    protos.parm(\"snippet\").set(r\"\"\"\n// move every rest point by its piece's pivot so the piece sits at the origin\nint pr = pointprims(0, @ptnum)[0];\nstring piece = prim(0, \"%(a)s\", pr);\nint ip = findattribval(1, \"point\", \"%(a)s\", piece);\nv@P -= point(1, \"pivot\", ip);\n\"\"\" % A)\n\npath = mk(\"attribwrangle\", \"ORIENT_protos_path\", -3, -4.8)   # one USD prim per piece, same clean name\npath.setInput(0, protos)\npath.parm(\"class\").set(1)                                    # Primitives\npath.parm(\"snippet\").set(r\"\"\"\nstring nm = s@%(a)s;\n%(clean)s\ns@path = nm;\n\"\"\" % A)\n\nt_out = mk(\"null\", \"OUT_orient_points\", 0, -6)\nt_out.setInput(0, pts)\np_out = mk(\"null\", \"OUT_orient_protos\", -3, -6)\np_out.setInput(0, path)\n\nif ADD_LOP:\n    lop = mk(\"lopnet\", \"LOP_orient_instancing\", -1.5, -7.2)\n    si = lop.createNode(\"sopimport\", \"root_pieces\")          # prims: /root_pieces/piece0_0_0, ...\n    si.parm(\"soppath\").set(si.relativePathTo(p_out))\n    si.setPosition(hou.Vector2(3, 0))\n    inst = lop.createNode(\"instancer\", \"instancer1\")         # prim: /instancer1\n    inst.setInput(1, si)\n    inst.setPosition(hou.Vector2(0, -1.5))\n    inst.parm(\"method\").set(\"pointinstancer\")\n    inst.parm(\"transformsourcemode\").set(\"extsop\")\n    inst.parm(\"pointsoppath\").set(inst.relativePathTo(t_out))\n    inst.parm(\"protosourcemode\").set(\"second\")\n    inst.parm(\"protopattern\").set(\"/root_pieces/*\")          # EVERY piece is its own prototype\n    inst.parm(\"protoindexsrc\").set(\"nameattr\")\n    inst.parm(\"nameattr\").set(PIECE_ATTR)\n    out = lop.createNode(\"null\", \"OUT_instances\")\n    out.setInput(0, inst)\n    out.setPosition(hou.Vector2(0, -3))\n    out.setDisplayFlag(True)\n\n    li = mk(\"lopimport::2.0\", \"LOP_orient_check_import\", -1.5, -8.4)\n    li.parm(\"loppath\").set(li.relativePathTo(out))\n    li.parm(\"primpattern\").set(\"/instancer1\")                # not the hidden prototype meshes\n    uu = mk(\"unpackusd::2.0\", \"LOP_orient_check_unpackusd\", -1.5, -9.6)\n    uu.setInput(0, li)\n    uu.parm(\"output\").set(\"polygons\")\n    uu.parm(\"iterations\").set(2)                             # instancer -> instances -> meshes\n\nprint(\"Orient from %s cache built in %s (%d nodes) -> %s, %s%s\" % (\n    \"packed\" if PACKED else \"polygon\", net.path(), len(created), t_out.name(), p_out.name(),\n    (\" + LOP_orient_instancing\" if ADD_LOP else \"\")))\n"}]}]}, {"id": "endless-blossom-flower", "name": "Endless Blossom → procedural flower", "category": "Vellum & Solaris", "type": "Object", "author": "Plug", "versions": [{"v": "v001", "date": "2026-11-05", "notes": "v001: ดอกไม้บานไม่รู้จบ (Entagma \"Endless Blossom\", Christopher Kopic 2025) สร้างใหม่ทั้งระบบผ่าน Houdini MCP ใน Dremzo Code (benchmark 2026-11-05) แล้ว export เป็น builder ที่ paste ได้\n• ได้ 4 network ใต้ /obj: EB_candidate (กลีบจาก Feather tools → KineFX rig 2 ท่า → loop มุมทอง 137.5° + time offset 4 เฟรม/กลีบ → ก้าน → Vellum cloth ปล่อยกลีบทุก 4 เฟรม → endless loop 5 ชุด +44 เฟรม), EB_render_prep (shell สำหรับ render, ก้าน, backdrop, ก้าน+ขน recipe Entagma), EB_textures (Copernicus อบ 5 map จากกลีบท่า rest: diffuse / rough_sss / normal / opacity / sss 1024²), EB_solaris (MaterialX, กล้อง, ไฟ, Karma)\n• ลำดับใช้งาน: paste build_endless_blossom.py ที่ /obj → save scene ของตัวเอง → hython eb_sim_cache.py (225 เฟรม ≈ 68 วิ) → hython eb_cook_textures.py (≈10 วิ) → hython eb_render_karma.py (480² 6spp ≈ 20 วิ/เฟรม) · ก่อนมี cache/map: LOOP_OUT กับกลีบใน Solaris ว่างเปล่าโดยตั้งใจ (missingframe = No Geometry) display flag อยู่ที่ copy_blossom_to_stem_tip จึงไม่ cook sim เอง\n• INPUT_CURVES = \"ai\" (default) ใช้เส้นกลีบ/ก้านที่ AI วาด (แนบมาในสคริปต์) · \"asset\" ใช้เส้นจาก project ของ Entagma ที่ export เอง (eb_extract_asset_curves.py) → ทรงกลีบตรงกับคลิป media ทั้งหมด render จากโหมด asset\n\nวัดผลแล้ว (verify_endless_blossom.py, hython 21.0.671, ไม่ sim ไม่ render): builder เทียบกับ scene ที่ผ่าน review (EB_full_v052bL3): node 205 ตัวเท่ากัน · parm ต่างเฉพาะ path ที่ย้ายมา CONFIG (12 ค่าเมื่อทั้งสองฝั่งอ่านเส้น Entagma, 18 ค่าเมื่อไม่มีไฟล์) · กลีบ petal_out f1/f96 (775 pt) dP 0.0 · blossom f96 (7,750 pt) dP 0.0 · Vellum geo 775 / constraint 4,320 เท่ากัน · collider 290/296 เท่ากัน · rig_doctor 0 warning · texture 5 แผ่นจาก builder sha256 ตรงกับชุดที่ review ทุกแผ่น (โหมด asset) · โหมด ai ไม่มีไฟล์ Entagma เลย: สร้างได้ 0 error, กลีบ 775 pt / blossom 7,750 pt\nผลของ scene ต้นฉบับจาก benchmark (ไม่ได้ render ใหม่): sim เทียบ cache ของครู f89 max 1.3e-5, f133 mean 0.000165 max 0.0116 · render f12 เทียบ scene ของครู ทั้งภาพ 2.23 หัวดอก 4.42 (mean abs/255) · loop seam f44→f1 5.24 (เฟรมติดกัน 4.21–5.89)\nทดสอบกับ H21.0.671 Apprentice · ยังไม่ได้ลองกับ 20.5 (Feather tools, Copernicus, Vellum Solver source default ต่างกันระหว่างเวอร์ชัน)\n\nที่มา (provenance) ตรงไปตรงมา: โครง node/wire ทั้งหมดสร้างเอง แต่ค่าหลายจุดอ่านมาจาก project file ของ Entagma (ASSET-DERIVED): เส้นกลีบ/ก้าน (ไม่แนบมา — export เองจากไฟล์ที่โหลดเอง), key ของ pose_blend (f96 = 0.8565), wind z 0.2, cloth stiffness/mass/thickness, ค่าใน COP, material, ไฟ 3 ดวง, กล้อง 80mm f/0.35 · Houdini ของครูเป็น 20.5 · ไม่มีไฟล์ .hiplc / texture / geometry ของครูในแพ็กนี้\nข้อจำกัดที่ยังอยู่ (ไม่ใช่ 100%): diffuse JPG ที่ครู export จาก H20.5 ทำซ้ำใน H21 ไม่ได้ (สีหัวดอกเรายังจางกว่า, พิสูจน์ด้วย control ที่สลับแค่ diffuse) · กลีบที่ตกทับกันข้ามชุดเวลาของ endless loop มองเห็นได้ (ไฟล์ครูก็มี) · curve ที่ปั้นมือที่ 12:13 เป็นค่าแทน · Apprentice: ลายน้ำ, COP ได้แค่ 1024², render ≤720 · โหมด ai ให้กลีบแคบกว่าของครู\nmedia + scene ที่ review: hip/endless_blossom/ (README.md บอก hash ทุกไฟล์)", "previewImage": "", "previewVisual": "", "files": [{"id": "eb-builder", "title": "Endless Blossom builder (4 networks)", "lang": "python", "context": "Python Shell · เปิด /obj", "tested": "Houdini 21.0.671 Apprentice · verify PASS (dP 0, maps bit-identical)", "filename": "build_endless_blossom.py", "description": "สร้าง EB_candidate / EB_render_prep / EB_textures / EB_solaris ครบทั้ง 205 node พร้อม wire, parm, ramp, keyframe, bypass, network box และ sticky note ตาม scene ที่ review ไม่แตะ node เดิมของพี่ ถ้า /obj/\u003cPREFIX>_candidate มีอยู่แล้วจะหยุดทันที (เปลี่ยน PREFIX)", "notes": "CONFIG: PREFIX, TARGET, SET_DISPLAY, INPUT_CURVES (ai/asset), ASSET_DIR, CACHE_DIR, TEX_DIR, TEACHER_TEX_DIR, RENDER_DIR — path ทุกตัวเป็น $HIP ไม่มี path เครื่องผู้เขียน · display flag ไป copy_blossom_to_stem_tip (ไม่ cook Vellum) · LOOP_OUT อ่าน cache จาก CACHE_DIR, material อ่าน map จาก TEX_DIR (ว่างจนกว่าจะรันสคริปต์ hython 2 ตัว) · สร้างโดย gen_builder.py จาก EB_full_v052bL3 ไม่ได้พิมพ์จากความจำ · ถ้ามี SKIPPED พิมพ์ออกมาแปลว่า parm นั้นไม่มีในเวอร์ชันที่ใช้ (20.5 ยังไม่ได้ลอง)", "visual": "", "code": "# ============================================================================\n# Endless Blossom -> procedural flower   v001   (paste into Houdini Python Shell)\n#\n# Builds the whole Endless Blossom flower pipeline as 4 networks under /obj:\n#   \u003cPREFIX>_candidate   SOP   petal (feather tools) -> KineFX rig + 2 poses -> golden-angle\n#                              blossom loop -> stem -> Vellum cloth emission -> endless loop\n#   \u003cPREFIX>_render_prep SOP   render shells, stem tube, backdrop, Entagma-recipe stem + fur\n#   \u003cPREFIX>_textures    SOP   Copernicus network that bakes 5 petal maps from the REST petal UVs\n#   \u003cPREFIX>_solaris     LOP   MaterialX petal material, camera, lights, Karma settings + ROP\n# Reconstruction of the Entagma \"Endless Blossom\" tutorial (Christopher Kopic, 2025) done as a\n# Houdini MCP benchmark (Dremzo Code, 2026-11-05). Every node / wire / value below was READ from\n# the reviewed scene EB_full_v052bL3 by gen_builder.py; nothing was typed from memory.\n#\n# HOW TO USE\n#   1. Open /obj (or any Object network) in the Network Editor.\n#   2. Paste the whole file into Windows > Python Shell and press Enter.\n#      -> 4 new networks, below whatever is already there. Nothing existing is changed.\n#   3. The candidate's display flag lands on copy_blossom_to_stem_tip (blossom on the stem,\n#      NO simulation). The endless loop (LOOP_OUT) reads a sim cache that you write with\n#      eb_sim_cache.py (hython, bounded); the materials read maps written by eb_cook_textures.py.\n#      Until those exist, LOOP_OUT and the Solaris petals are empty on purpose (missingframe = No Geometry).\n#\n#   INPUT_CURVES = \"ai\"    -> bundled AI-drawn petal outline / barb curve / stem curve (ours, redistributable)\n#   INPUT_CURVES = \"asset\" -> the Entagma project curves from ASSET_DIR (3 .bgeo you export yourself\n#                             with eb_extract_asset_curves.py from the project file you downloaded)\n#   Existing nodes are never changed or moved. If /obj/\u003cPREFIX>_candidate already exists the\n#   script stops: pick another PREFIX, nothing is renamed or overwritten.\n#\n# Tested: Houdini 21.0.671 Apprentice (hython + verify_endless_blossom.py). Houdini 20.5 is NOT tested.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\nPREFIX          = \"EB\"              # networks become /obj/EB_candidate, EB_render_prep, EB_textures, EB_solaris\nTARGET          = \"\"                # \"\" = the Object network the Network Editor is showing (usually /obj); or a path\nSET_DISPLAY     = True              # candidate display flag -> copy_blossom_to_stem_tip (no sim cook)\nINPUT_CURVES    = \"ai\"              # \"ai\" (bundled curves) or \"asset\" (Entagma curves in ASSET_DIR)\nASSET_DIR       = \"$HIP/eb_assets\"  # ASSET_entagma_curve1/2/3.bgeo (only read when INPUT_CURVES = \"asset\")\nCACHE_DIR       = \"$HIP/geo/eb_sim\" # sim.0001.bgeo.sc ... written by eb_sim_cache.py\nTEX_DIR         = \"$HIP/tex/eb_cop\" # diffuse/rough_sss/normal/opacity/sss .png written by eb_cook_textures.py\nTEACHER_TEX_DIR = \"$HIP/eb_assets/tex\"  # optional: Entagma tex/*.jpg (materials use them only when tex_src = 0)\nRENDER_DIR      = \"$HIP/render/eb\"  # Karma ROP output\n# ----------------------------------------------------------------------------\n\n\ndef current_network():\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\nnet = current_network()\nif net.childTypeCategory().name() != \"Object\":\n    raise hou.Error(\"Open /obj (an Object network) - %s holds %s nodes.\" % (net.path(), net.childTypeCategory().name()))\nfor suffix in (\"_candidate\", \"_render_prep\", \"_textures\", \"_solaris\"):\n    if net.node(PREFIX + suffix) is not None:\n        raise hou.Error(\"%s/%s%s already exists - set another PREFIX (nothing was changed).\" % (net.path(), PREFIX, suffix))\n\nROOT = net.path() + \"/\" + PREFIX\nDIRS = {\"ASSET_DIR\": ASSET_DIR, \"CACHE_DIR\": CACHE_DIR, \"TEX_DIR\": TEX_DIR, \"TEACHER_TEX_DIR\": TEACHER_TEX_DIR,\n        \"RENDER_DIR\": RENDER_DIR, \"ROOT\": ROOT, \"WORK_DIR\": \"$HIP\"}\nys = [c.position()[1] for c in net.children()]\ntop = (min(ys) - 3) if ys else 0          # build BELOW whatever is already there\ncreated = []\ncreated_nets = []\nskipped = []\n\n\ndef S(s):\n    return s % DIRS\n\n\ndef mk(parent, type_name, name, pos):\n    n = parent.createNode(type_name, name)\n    if parent is net:\n        n.setPosition(hou.Vector2(pos[0], top + pos[1]))\n    else:\n        n.setPosition(hou.Vector2(pos[0], pos[1]))\n    created.append(n)\n    return n\n\n\ndef P(n, name, value):\n    p = n.parm(name)\n    if p is None:\n        skipped.append((n.path(), name, \"no such parm\"))\n        return\n    try:\n        p.deleteAllKeyframes()\n        p.set(value)\n    except Exception as e:\n        skipped.append((n.path(), name, str(e)[:80]))\n\n\ndef E(n, name, expr, lang):\n    p = n.parm(name)\n    if p is None:\n        skipped.append((n.path(), name, \"no such parm\"))\n        return\n    try:\n        p.setExpression(expr, la
