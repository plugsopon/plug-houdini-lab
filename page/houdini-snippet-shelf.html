-----------------------\nfor s in skipped:\n    print(\"SKIPPED\", s)\nprint(\"Endless Blossom built in %s: %d networks (%s), %d nodes%s. Display: %s_candidate/copy_blossom_to_stem_tip. \"\n      \"Next: eb_sim_cache.py -> %s, eb_cook_textures.py -> %s, then LOOK at %s_solaris/OUT_STAGE.\" % (\n          net.path(), len(created_nets), \", \".join(n.name() for n in created_nets), len(created),\n          \" (%d parm sets skipped - see above)\" % len(skipped) if skipped else \"\",\n          PREFIX, CACHE_DIR, TEX_DIR, PREFIX))\n"}, {"id": "eb-sim-cache", "title": "Vellum sim cache (hython)", "lang": "python", "context": "hython (command line) · scene ที่ save แล้ว", "tested": "Houdini 21.0.671 · 225 เฟรม 68 วิ, 7,750 pt/เฟรม", "filename": "eb_sim_cache.py", "description": "cook EB_candidate/OUT_SIM_PREVIEW ทีละเฟรมใน process แยก แล้วเขียน sim.NNNN.bgeo.sc ลง CACHE_DIR ไม่ยอมเขียนทับโฟลเดอร์ที่มีเฟรมอยู่แล้ว", "notes": "hython eb_sim_cache.py SCENE.hipnc [PREFIX] [FIRST LAST] [OUT_DIR] · กลีบเริ่มปล่อยที่ f96, endless loop ต้องการ cache ถึง f225 (+44×4) · ไม่ save scene", "visual": "", "code": "# ============================================================================\n# Endless Blossom - write the Vellum sim cache (hython, headless, bounded)\n#\n#   hython eb_sim_cache.py SCENE.hipnc [PREFIX] [FIRST LAST] [OUT_DIR]\n#\n#   SCENE.hipnc  your scene after pasting build_endless_blossom.py (saved by you; this script never saves it)\n#   PREFIX       the builder's PREFIX (default EB)\n#   FIRST LAST   frame range (default 1 225: petals emit from f96, the endless loop needs +176 frames of cache)\n#   OUT_DIR      default = the CACHE_DIR the builder wrote into \u003cPREFIX>_candidate/sim_cache_read\n#\n# Cooks \u003cPREFIX>_candidate/OUT_SIM_PREVIEW frame by frame in a SEPARATE hython process and writes\n# sim.NNNN.bgeo.sc. Refuses to overwrite a folder that already has frames (delete it yourself).\n# Measured on 21.0.671 Apprentice: 225 frames = 68 s, 7,750 points per frame (10 petals x 775).\n# ============================================================================\nimport hou, os, sys, time\n\nscene = sys.argv[1]\nprefix = sys.argv[2] if len(sys.argv) > 2 else \"EB\"\nf0, f1 = (int(sys.argv[3]), int(sys.argv[4])) if len(sys.argv) > 4 else (1, 225)\nhou.hipFile.load(scene, suppress_save_prompt=True, ignore_load_warnings=True)\ncand = hou.node(\"/obj/%s_candidate\" % prefix)\nif cand is None:\n    sys.exit(\"no /obj/%s_candidate in %s\" % (prefix, scene))\nout = cand.node(\"OUT_SIM_PREVIEW\")\noutdir = sys.argv[5] if len(sys.argv) > 5 else os.path.dirname(cand.node(\"sim_cache_read\").parm(\"file\").eval())\nif os.path.isdir(outdir) and any(f.endswith(\".bgeo.sc\") for f in os.listdir(outdir)):\n    sys.exit(\"%s already holds frames - refusing to overwrite\" % outdir)\nos.makedirs(outdir, exist_ok=True)\nt0 = time.time()\nfor f in range(f0, f1 + 1):\n    hou.setFrame(f)\n    t = time.time()\n    g = out.geometry()\n    if g is None:\n        sys.exit(\"frame %d: OUT_SIM_PREVIEW cooked no geometry - %s\" % (f, out.errors()))\n    g.saveToFile(\"%s/sim.%04d.bgeo.sc\" % (outdir, f))\n    print(\"frame %d pts %d %.2fs total %.1fs\" % (f, len(g.points()), time.time() - t, time.time() - t0), flush=True)\nprint(\"DONE %d frames in %.1fs -> %s (%s)\" % (f1 - f0 + 1, time.time() - t0, outdir, hou.applicationVersionString()))\n"}, {"id": "eb-cook-textures", "title": "Bake 5 petal maps in Copernicus (hython)", "lang": "python", "context": "hython (command line) · scene ที่ save แล้ว", "tested": "Houdini 21.0.671 · 5 แผ่น ≈ 10 วิ · sha256 ตรงกับชุด review", "filename": "eb_cook_textures.py", "description": "cook rop_image 5 ตัวใน EB_textures/EB_cop (diffuse, rough_sss, normal, opacity, sss) จากกลีบท่า rest ลง TEX_DIR ไม่ต้องมี sim cache", "notes": "hython eb_cook_textures.py SCENE.hipnc [PREFIX] [OUT_DIR] · copnet 1024² เพราะ Apprentice ไม่ยอม save Copernicus เกิน 1920×1080 (ครูใช้ 4096²) · invert6 ถูก bypass ตามไฟล์ครู (flag ไม่ใช่ parm — หาเจอจาก sss map กลับด้าน)", "visual": "", "code": "# ============================================================================\n# Endless Blossom - bake the 5 petal maps from the Copernicus network (hython, headless)\n#\n#   hython eb_cook_textures.py SCENE.hipnc [PREFIX] [OUT_DIR]\n#\n#   Cooks \u003cPREFIX>_textures/EB_cop/write_{diffuse,rough_sss,normal,opacity,sss} (rop_image) and\n#   writes PNGs to OUT_DIR (default = the folder the builder's TEX_DIR resolved to). The maps are\n#   baked from the REST petal (petal_surface, before the rig), so they need no sim cache.\n#   The copnet is 1024x1024: Houdini Apprentice refuses to save Copernicus output above 1920x1080.\n#   Measured on 21.0.671: all five maps in about 10 s. This script never saves the scene.\n# ============================================================================\nimport hou, os, sys, time\n\nscene = sys.argv[1]\nprefix = sys.argv[2] if len(sys.argv) > 2 else \"EB\"\nhou.hipFile.load(scene, suppress_save_prompt=True, ignore_load_warnings=True)\ntex = hou.node(\"/obj/%s_textures\" % prefix)\nif tex is None:\n    sys.exit(\"no /obj/%s_textures in %s\" % (prefix, scene))\ncop = tex.node(\"EB_cop\")\noutdir = sys.argv[3] if len(sys.argv) > 3 else os.path.dirname(cop.node(\"write_diffuse\").parm(\"copoutput\").eval())\nos.makedirs(outdir, exist_ok=True)\nuv, rim = tex.node(\"UV\").geometry(), tex.node(\"RIM\").geometry()\nprint(\"rest petal UV pts %d, RIM pts %d, res %s\" % (len(uv.points()), len(rim.points()), cop.parmTuple(\"res\").eval()))\nfor w in (\"diffuse\", \"rough_sss\", \"normal\", \"opacity\", \"sss\"):\n    r = cop.node(\"write_\" + w)\n    path = \"%s/%s.png\" % (outdir, w)\n    r.parm(\"copoutput\").set(path)\n    t = time.time()\n    r.render()\n    ok = os.path.exists(path) and os.path.getsize(path) > 0\n    print(\"wrote %-10s %s %.1fs exists=%s errors=%s\" % (w, path, time.time() - t, ok, r.errors() or cop.node(\"OUT_\" + w).errors()), flush=True)\n    if not ok:\n        sys.exit(\"map %s was not written\" % w)\nprint(\"DONE -> %s (%s)\" % (outdir, hou.applicationVersionString()))\n"}, {"id": "eb-render-karma", "title": "Karma CPU render (hython)", "lang": "python", "context": "hython (command line) · scene ที่ save แล้ว", "tested": "Houdini 21.0.671 Apprentice · 480² 6spp 20 วิ, 720² 32spp 89 วิ", "filename": "eb_render_karma.py", "description": "render เฟรมที่ระบุจาก EB_solaris/karma_rop ตั้ง resolution/spp ชั่วคราวใน process แยก ต้องมี cache + map ก่อน", "notes": "hython eb_render_karma.py SCENE.hipnc [PREFIX] [FRAMES] [RES] [SPP] [OUT_DIR] · FRAMES เช่น 12 หรือ 1-44 · กล้อง Entagma เป็น 1:1 · ลายน้ำ Houdini มาจาก Apprentice", "visual": "", "code": "# ============================================================================\n# Endless Blossom - render frames with Karma CPU (hython, headless, bounded)\n#\n#   hython eb_render_karma.py SCENE.hipnc [PREFIX] [FRAMES] [RES] [SPP] [OUT_DIR]\n#\n#   FRAMES   \"12\" or \"1,2,3\" or \"1-44\" (default 12)\n#   RES      square resolution (default 480; the Entagma camera is 1:1; Apprentice caps at 1280x720 - keep \u003c= 720)\n#   SPP      samples per pixel (default 6; the reviewed still used 32 at 720, the loop 6 at 360)\n#   OUT_DIR  default = the builder's RENDER_DIR\n#\n#   Needs the sim cache (eb_sim_cache.py) and the maps (eb_cook_textures.py) first, or the petals are empty.\n#   Measured on 21.0.671 Apprentice CPU: 480^2 6spp = 20 s/frame, 360^2 6spp = 17 s, 720^2 32spp = 89 s.\n#   The \"Houdini\" mark in every frame is the Apprentice watermark. This script never saves the scene.\n# ============================================================================\nimport hou, os, sys, time\n\nscene = sys.argv[1]\nprefix = sys.argv[2] if len(sys.argv) > 2 else \"EB\"\nspec = sys.argv[3] if len(sys.argv) > 3 else \"12\"\nres = int(sys.argv[4]) if len(sys.argv) > 4 else 480\nspp = int(sys.argv[5]) if len(sys.argv) > 5 else 6\nframes = []\nfor part in spec.split(\",\"):\n    if \"-\" in part:\n        a, b = part.split(\"-\")\n        frames += list(range(int(a), int(b) + 1))\n    else:\n        frames.append(int(part))\nhou.hipFile.load(scene, suppress_save_prompt=True, ignore_load_warnings=True)\nlop = hou.node(\"/obj/%s_solaris\" % prefix)\nif lop is None:\n    sys.exit(\"no /obj/%s_solaris in %s\" % (prefix, scene))\nkrs, rop = lop.node(\"karma_settings\"), lop.node(\"karma_rop\")\noutdir = sys.argv[6] if len(sys.argv) > 6 else os.path.dirname(rop.parm(\"outputimage\").eval())\nos.makedirs(outdir, exist_ok=True)\nkrs.parm(\"resolutionx\").set(res)          # resolutiony follows the camera aspect (res_mode autoheight)\nkrs.parm(\"samplesperpixel\").set(spp)\nrop.parm(\"outputimage\").set(outdir + \"/eb_karma.$F4.png\")\nrop.parm(\"trange\").set(0)\nfor f in frames:\n    hou.setFrame(f)\n    t = time.time()\n    rop.render(verbose=False)\n    path = \"%s/eb_karma.%04d.png\" % (outdir, f)\n    print(\"frame %d res %dx%d spp %d engine %s %.1fs exists=%s\" % (\n        f, res, krs.parm(\"resolutiony\").eval(), spp, krs.parm(\"engine\").eval(), time.time() - t, os.path.exists(path)), flush=True)\nprint(\"DONE %d frames -> %s (%s)\" % (len(frames), outdir, hou.applicationVersionString()))\n"}, {"id": "eb-extract-asset-curves", "title": "Export the 3 Entagma input curves (hython, read-only)", "lang": "python", "context": "hython (command line) · project file ของ Entagma ที่โหลดเอง", "tested": "Houdini 21.0.671 · Endless_Blossom_2025_Part-1.hiplc (sha256 7dd1a271…)", "filename": "eb_extract_asset_curves.py", "description": "อ่าน /obj/geo1/curve1 (ทรงกลีบ) curve2 (barb guide) curve3 (ก้าน) จาก project file แล้ว save เป็น ASSET_entagma_curve1/2/3.bgeo สำหรับ INPUT_CURVES = \"asset\" ไม่แก้ไฟล์ต้นฉบับ", "notes": "ดาวน์โหลด project file จากโพสต์ Endless Blossom บน entagma.com เอง — เส้นเหล่านี้เป็นของ Entagma ไม่ได้แนบมาใน shelf", "visual": "", "code": "# ============================================================================\n# Endless Blossom - export the 3 input curves from YOUR copy of the Entagma project file (hython, read-only)\n#\n#   hython eb_extract_asset_curves.py Endless_Blossom_2025_Part-1.hiplc OUT_DIR\n#\n#   The Entagma project (entagma.com, \"Endless Blossom\" by Christopher Kopic, 2025 - free download on the post)\n#   draws the petal outline (curve1), the barb guide (curve2) and the stem (curve3) by hand in /obj/geo1.\n#   This writes them as ASSET_entagma_curve1/2/3.bgeo into OUT_DIR for the builder's INPUT_CURVES = \"asset\".\n#   Those curves are Entagma's, not ours: they are NOT bundled with the shelf technique - export your own.\n#   Only the three Curve SOPs are cooked (no solver, nothing saved, the project file is not modified).\n# ============================================================================\nimport hou, os, sys, hashlib\n\nsrc, outdir = sys.argv[1], sys.argv[2]\nprint(\"project sha256\", hashlib.sha256(open(src, \"rb\").read()).hexdigest()[:16])\nhou.hipFile.load(src, suppress_save_prompt=True, ignore_load_warnings=True)\nos.makedirs(outdir, exist_ok=True)\nfor n in (\"curve1\", \"curve2\", \"curve3\"):\n    node = hou.node(\"/obj/geo1/\" + n)\n    if node is None:\n        sys.exit(\"/obj/geo1/%s not found - is this the Part-1 project file?\" % n)\n    g = node.geometry()\n    path = \"%s/ASSET_entagma_%s.bgeo\" % (outdir, n)\n    g.saveToFile(path)\n    print(\"wrote\", path, \"pts\", len(g.points()), \"prims\", [p.type().name() for p in g.prims()])\nprint(\"unsaved changes to the project file:\", hou.hipFile.hasUnsavedChanges(), \"(nothing is written back)\")\n"}, {"id": "eb-verify", "title": "Headless check: builder vs reviewed scene (hython)", "lang": "python", "context": "hython (command line)", "tested": "Houdini 21.0.671 · PASS 2026-11-05", "filename": "verify_endless_blossom.py", "description": "โหลด scene ที่ review (cpio) บันทึก type/wire/parm ทุก node + geometry ที่เฟรมสำคัญ แล้ว clear scene รัน builder แล้วเทียบ: ต้องต่างเฉพาะ path ที่ย้ายมา CONFIG, dP 0, จำนวน point/constraint เท่ากัน, 0 error ทั้งแบบมีและไม่มีไฟล์ Entagma", "notes": "hython verify_endless_blossom.py build_endless_blossom.py EB_full_v052bL3_layout.cpio WORK_DIR · save scene ใหม่ 1 ไฟล์ใน WORK_DIR ไว้ให้ eb_cook_textures.py ตรวจ map ต่อ ไม่ sim ไม่ render", "visual": "", "code": "# ============================================================================\n# Endless Blossom - headless check of build_endless_blossom.py against the reviewed scene (hython)\n#\n#   hython verify_endless_blossom.py build_endless_blossom.py REFERENCE.hipnc|.cpio [WORK_DIR] [ASSET_DIR] [REVIEWED_TEX_DIR]\n#\n#   ASSET_DIR         optional: folder with ASSET_entagma_curve1/2/3.bgeo (your own export). With it, both sides read the\n#                     same Entagma barb curve and a second scene is saved with INPUT_CURVES = \"asset\" so the texture\n#                     cook can be compared byte-for-byte against REVIEWED_TEX_DIR (hip/endless_blossom/tex_v051).\n#                     Without it, both sides run with no Entagma files at all (the shelf user's default).\n#\n#   1. loads REFERENCE (the reviewed EB_full_v052bL3 export) and records: every node's type, wiring and\n#      authored parm state (4 networks, recursive), rest/deformed petal P at f1 + f96, blossom P at f96,\n#      Vellum emit/constraint counts, collider, rest-UV prep, the drawn-curve digest, rig_doctor warnings.\n#   2. clears the scene, runs the BUILDER at /obj (TARGET=\"/obj\", INPUT_CURVES=\"ai\"), records the same.\n#   3. reports the differences. Expected: only the CONFIG-substituted paths and INPUT_CURVES switches.\n#   No sim, no render, no save. Measured below = what the reviewed artifact had.\n# ============================================================================\nimport hou, sys, os, re, json, hashlib\n\nbuilder, ref, work = sys.argv[1], sys.argv[2], (sys.argv[3] if len(sys.argv) > 3 else os.getcwd())\nasset_dir = sys.argv[4].replace(\"\\\\\", \"/\") if len(sys.argv) > 4 and os.path.isdir(sys.argv[4]) else \"\"\nreviewed_tex = sys.argv[5].replace(\"\\\\\", \"/\") if len(sys.argv) > 5 else \"\"\nwork = work.replace(\"\\\\\", \"/\")\nNETS = [\"EB_candidate\", \"EB_render_prep\", \"EB_textures\", \"EB_solaris\"]\nEXPECT_SUBST = re.compile(r\"\\b(file|copoutput|outputimage)$\")\n\n\ndef sig(p):\n    ks = p.keyframes()\n    if ks:\n        def kk(k):\n            x = k.expression() if k.isExpressionSet() else None\n            if not isinstance(k, hou.Keyframe):\n                return (k.frame(), x)\n            def g(fn):\n                try:\n                    return round(fn(), 4)\n                except hou.KeyframeValueNotSet:\n                    return None\n            return (k.frame(), None if x else round(k.value(), 6), x, g(k.inSlope), g(k.slope), g(k.inAccel), g(k.accel))\n        return \"K\" + repr([kk(k) for k in ks])\n    t = p.parmTemplate().type()\n    if t == hou.parmTemplateType.Data:\n        return None\n    if t == hou.parmTemplateType.Ramp:\n        r = p.eval()\n        return \"R\" + repr(([b.name() for b in r.basis()], [round(k, 6) for k in r.keys()], [tuple(round(c, 6) for c in v) if isinstance(v, tuple) else round(v, 6) for v in r.values()]))\n    try:\n        v = p.eval()\n    except Exception:\n        return None\n    if isinstance(v, str):\n        return \"S\" + p.unexpandedString()\n    if isinstance(v, float) and abs(v) \u003c 1e-9:\n        return None   # 2.8e-15 rotations etc. are zero\n    return \"V\" + repr(round(v, 6) if isinstance(v, float) else v)\n\n\ndef _anc(n, root):\n    out = []\n    p = n.parent()\n    while p is not None and p != root:\n        out.append(p)\n        p = p.parent()\n    return out\n\n\ndef snapshot():\n    out = {}\n    for net in NETS:\n        root = hou.node(\"/obj/\" + net)\n        for n in [root] + list(root.allSubChildren()):\n            # inside a locked HDA only user-added nodes count (the Vellum Source in the solver's forces subnet)\n            if any(a.isLockedHDA() for a in n.parents_chain) if False else any(a.isLockedHDA() for a in _anc(n, root)):\n                if n.type().name() != \"vellumsource\" or \"/forces/\" not in n.path():\n                    continue\n            rel = n.path()[len(\"/obj/\" + net):] or \"/\"\n            d = {\"type\": n.type().name(), \"bypass\": n.isBypassed() if hasattr(n, \"isBypassed\") else False,\n                 \"inputs\": [(c.inputNode().name() if c.inputNode() else None, c.outputIndex(), c.inputIndex()) for c in n.inputConnections()],\n                 \"parms\": {}}\n            for p in n.parms():\n                if p.isAtDefault(compare_temporary_defaults=False) and not p.keyframes():\n                    continue\n                s = sig(p)\n                if s is not None:\n                    d[\"parms\"][p.name()] = s\n            out[net + rel] = d\n    return out\n\n\ndef digest(g):\n    h = hashlib.sha256()\n    h.update(str([tuple(round(c, 6) for c in pt.position()) for pt in g.points()]).encode())\n    h.update(str([[v.point().number() for v in p.vertices()] for p in g.prims()]).encode())\n    return h.hexdigest()[:16]\n\n\ndef P_at(node, f):\n    g = node.geometryAtFrame(f)\n    return [tuple(pt.position()) for pt in g.points()] if g else None\n\n\ndef measure():\n    c = hou.node(\"/obj/EB_candidate\")\n    m = {}\n    m[\"curves\"] = digest(c.node(\"petal_shape_curves\").geometry())\n    m[\"petal_out_f1\"] = P_at(c.node(\"petal_out\"), 1)\n    m[\"petal_out_f96\"] = P_at(c.node(\"petal_out\"), 96)\n    m[\"blossom_f96\"] = P_at(c.node(\"copy_blossom_to_stem_tip\"), 96)\n    def npts(node, f, prims=False):\n        g = node.geometryAtFrame(f)\n        if g is None:\n            return \"ERROR %s\" % (node.errors() or node.warnings() or [i.name() + \":\" + str(i.errors()) for i in node.inputAncestors() if i.errors()])[:2]\n        return len(g.prims()) if prims else len(g.points())\n    m[\"vellum_geo_f96\"] = npts(c.node(\"VELLUM_GEO\"), 96)\n    m[\"vellum_con_f96\"] = npts(c.node(\"VELLUM_CONSTRAINTS\"), 96, True)\n    m[\"collider\"] = (npts(c.node(\"stem_sweep\"), 1), npts(c.node(\"stem_sweep\"), 1, True))\n    m[\"rig_warnings\"] = list(c.node(\"rig_doctor\").warnings())\n    t = hou.node(\"/obj/EB_textures\")\n    m[\"uv_pts\"] = npts(t.node(\"UV\"), 1)\n    m[\"rim_pts\"] = npts(t.node(\"RIM\"), 1)\n    errs = []\n    for net in NETS:\n        for n in hou.node(\"/obj/\" + net).allSubChildren():\n            if n.errors() and n.type().category().name() != \"Lop\":\n                errs.append((n.path(), n.errors()[0][:80]))\n    m[\"sop_errors\"] = errs\n    return m\n\n\ndef pmax(a, b):\n    if a is None or b is None or len(a) != len(b):\n        return \"count %s vs %s\" % (None if a is None else len(a), None if b is None else len(b))\n    return max(((x[0] - y[0]) ** 2 + (x[1] - y[1]) ** 2 + (x[2] - y[2]) ** 2) ** 0.5 for x, y in zip(a, b))\n\n\n# ---- 1. reference\nhou.hipFile.clear(suppress_save_prompt=True)\nif ref.lower().endswith(\".cpio\"):\n    hou.node(\"/obj\").loadItemsFromFile(ref)\nelse:\n    hou.hipFile.load(ref, suppress_save_prompt=True, ignore_load_warnings=True)\n# the reference reads the Entagma curves through switches set to 1; compare the builder's \"ai\" default against input 0,\n# and point the reference's three asset File SOPs at ASSET_DIR (or at nothing, No Geometry) so both sides see the same files\nfor sw in (\"INPUT_CURVES_shape_src\", \"INPUT_CURVES_barb_src\", \"STEM_src\"):\n    hou.node(\"/obj/EB_candidate/\" + sw).parm(\"input\").set(0)\nfor i, tag in ((1, \"shape\"), (2, \"barbs\"), (3, \"stem\")):\n    fn = hou.node(\"/obj/EB_candidate/ASSET_entagma_curve%d_%s\" % (i, tag))\n    fn.parm(\"file\").set(asset_dir + \"/ASSET_entagma_curve%d.bgeo\" % i if asset_dir else \"\")\n    fn.parm(\"missingframe\").set(1)\nsnap_ref, meas_ref = snapshot(), measure()\nprint(\"REF nodes %d, petal_out f96 pts %s, blossom f96 pts %s, rig warnings %s\" % (\n    len(snap_ref), len(meas_ref[\"petal_out_f96\"] or []), len(meas_ref[\"blossom_f96\"] or []), meas_ref[\"rig_warnings\"]))\n\n# ---- 2. builder\nhou.hipFile.clear(suppress_save_prompt=True)\nhou.hipFile.setName(work + \"/verify_scene.hipnc\")   # so $HIP resolves; saved only at the end, as a NEW file\ncode = open(builder, encoding=\"utf8\").read()\ncode = code.replace('TARGET          = \"\"', 'TARGET          = \"/obj\"', 1)\nassert 'TARGET          = \"/obj\"' in code\ncode_noasset = code\nif asset_dir:\n    code = code.replace('ASSET_DIR       = \"$HIP/eb_assets\"', 'ASSET_DIR       = %r' % asset_dir, 1)\n    assert code != code_noasset, \"ASSET_DIR line not found\"\nprint(\"ASSET_DIR for this run:\", asset_dir or \"(none - no Entagma files on either side)\")\nns = {}\nexec(compile(code, builder, \"exec\"), ns)\nfor sw in (\"INPUT_CURVES_shape_src\", \"INPUT_CURVES_barb_src\", \"STEM_src\"):\n    assert hou.node(\"/obj/EB_candidate/\" + sw).parm(\"input\").eval() == 0\nsnap_new, meas_new = snapshot(), measure()\nprint(\"BUILT nodes %d, skipped parm sets %d\" % (len(snap_new), len(ns[\"skipped\"])))\n\n# ---- 3. compare\ndiffs = []\nfor k in sorted(set(snap_ref) | set(snap_new)):\n    a, b = snap_ref.get(k), snap_new.get(k)\n    if a is None or b is None:\n        diffs.append((k, \"MISSING in %s\" % (\"built\" if b is None else \"reference\")))\n        continue\n    for f in (\"type\", \"bypass\", \"inputs\"):\n        if a[f] != b[f]:\n            diffs.append((k, f, a[f], b[f]))\n    for pn in sorted(set(a[\"parms\"]) | set(b[\"parms\"])):\n        x, y = a[\"parms\"].get(pn), b[\"parms\"].get(pn)\n        if x != y:\n            diffs.append((k, \"parm \" + pn, (x or \"\")[:90], (y or \"\")[:90]))\nexpected = [d for d in diffs if len(d) == 4 and d[1].startswith(\"parm \") and (EXPECT_SUBST.search(d[1].split()[1])\n            or (d[1] == \"parm missingframe\" and \"/ASSET_entagma_\" in d[0] and d[3] == \"V1\"))]   # builder: No Geometry when the Entagma curves are absent\nother = [d for d in diffs if d not in expected]\nprint(\"DIFF total %d | path substitutions (expected) %d | OTHER %d\" % (len(diffs), len(expected), len(other)))\nfor d in expected:\n    print(\"  subst\", d[0], d[1], \"|\", d[2], \"->\", d[3])\nfor d in other:\n    print(\"  OTHER\", d)\nprint(\"GEOM curves digest ref %s built %s\" % (meas_ref[\"curves\"], meas_new[\"curves\"]))\nfor key in (\"petal_out_f1\", \"petal_out_f96\", \"blossom_f96\"):\n    print(\"GEOM %s pts %s max dP %s\" % (key, len(meas_ref[key] or []), pmax(meas_ref[key], meas_new[key])))\nfor key in (\"vellum_geo_f96\", \"vellum_con_f96\", \"collider\", \"uv_pts\", \"rim_pts\", \"rig_warnings\", \"sop_errors\"):\n    print(\"GEOM %s ref %s built %s %s\" % (key, meas_ref[key], meas_new[key], \"OK\" if meas_ref[key] == meas_new[key] else \"DIFFERENT\"))\nok = not other and meas_ref[\"curves\"] == meas_new[\"curves\"] and all(\n    isinstance(pmax(meas_ref[k], meas_new[k]), float) and pmax(meas_ref[k], meas_new[k]) \u003c 1e-5 for k in (\"petal_out_f1\", \"petal_out_f96\", \"blossom_f96\")) \\\n    and all(meas_ref[k] == meas_new[k] for k in (\"vellum_geo_f96\", \"vellum_con_f96\", \"collider\", \"uv_pts\", \"rim_pts\", \"rig_warnings\")) and not meas_new[\"sop_errors\"] and not ns[\"skipped\"]\n# ---- 4. mode B: INPUT_CURVES = \"ai\" with NO Entagma files anywhere (the shelf user's default situation)\nhou.hipFile.clear(suppress_save_prompt=True)\nhou.hipFile.setName(work + \"/verify_scene_noasset.hipnc\")\nns2 = {}\nexec(compile(code_noasset, builder, \"exec\"), ns2)\nc = hou.node(\"/obj/EB_candidate\")\nerrs_b = [(n.path(), n.errors()[0][:70]) for net_ in NETS for n in hou.node(\"/obj/\" + net_).allSubChildren() if n.errors() and n.type().category().name() != \"Lop\"]\npb = c.node(\"petal_out\").geometryAtFrame(96)\nbb = c.node(\"copy_blossom_to_stem_tip\").geometryAtFrame(96)\nprint(\"NOASSET petal_out f96 pts %s, blossom f96 pts %s, SOP errors %d %s, skipped %d\" % (\n    len(pb.points()) if pb else None, len(bb.points()) if bb else None, len(errs_b), errs_b[:3], len(ns2[\"skipped\"])))\nok = ok and pb is not None and len(pb.points()) > 0 and bb is not None and len(bb.points()) == 10 * len(pb.points()) and not errs_b and not ns2[\"skipped\"]\n# keep a reopenable copy of mode A (a NEW file; nobody's scene is overwritten)\nhou.hipFile.clear(suppress_save_prompt=True)\nhou.hipFile.setName(work + \"/verify_scene.hipnc\")\nexec(compile(code, builder, \"exec\"), {})\nout_hip = work + \"/verify_scene.hipnc\"\nassert not os.path.exists(out_hip), out_hip + \" exists - refusing to overwrite\"\nhou.hipFile.save(out_hip)\nprint(\"SAVED mode-A scene:\", out_hip)\n# ---- 5. with ASSET_DIR: INPUT_CURVES = \"asset\" scene + the 5 Copernicus maps against the reviewed maps (byte for byte)\nif asset_dir:\n    hou.hipFile.clear(suppress_save_prompt=True)\n    hou.hipFile.setName(work + \"/verify_scene_asset.hipnc\")\n    code_c = code.replace('INPUT_CURVES    = \"ai\"', 'INPUT_CURVES    = \"asset\"', 1)\n    assert code_c != code\n    exec(compile(code_c, builder, \"exec\"), {})\n    out_c = work + \"/verify_scene_asset.hipnc\"\n    assert not os.path.exists(out_c), out_c + \" exists - refusing to overwrite\"\n    hou.hipFile.save(out_c)\n    cop = hou.node(\"/obj/EB_textures/EB_cop\")\n    texdir = work + \"/tex_asset\"\n    os.makedirs(texdir, exist_ok=True)\n    same = 0\n    for w in (\"diffuse\", \"rough_sss\", \"normal\", \"opacity\", \"sss\"):\n        r = cop.node(\"write_\" + w)\n        r.parm(\"copoutput\").set(\"%s/%s.png\" % (texdir, w))\n        r.render()\n        a = hashlib.sha256(open(\"%s/%s.png\" % (texdir, w), \"rb\").read()).hexdigest()[:16]\n        rv = \"%s/%s.png\" % (reviewed_tex, w) if reviewed_tex else \"\"\n        b = hashlib.sha256(open(rv, \"rb\").read()).hexdigest()[:16] if rv and os.path.exists(rv) else \"(no reviewed map given)\"\n        same += a == b\n        print(\"TEX %-10s built %s reviewed %s %s\" % (w, a, b, \"SAME\" if a == b else \"DIFF\"))\n    print(\"SAVED asset-mode scene:\", out_c, \"| maps identical to the reviewed set: %d/5\" % same)\n    if reviewed_tex:\n        ok = ok and same == 5\nprint(\"RESULT\", \"PASS\" if ok else \"FAIL\", hou.applicationVersionString())\nsys.exit(0 if ok else 1)\n"}, {"id": "eb-vex-petal-state", "title": "Petal state groups (anim / volume_source)", "lang": "vex", "context": "Attribute Wrangle · Points · spare parm end_frame = 96", "tested": "Houdini 21.0.671", "filename": "petal_state_groups.vfl", "description": "ก่อน loop: กลีบที่ @Frame \u003c end_frame อยู่ group anim, ตรงเฟรม end_frame พอดีอยู่ group volume_source ซึ่ง Vellum จะดูดไปปล่อย — เพราะ Time Shift ของ loop อยู่หลัง node นี้ แต่ละกลีบจึงถึง end_frame คนละเวลา (ห่างกัน 4 เฟรม)", "notes": "ชื่อ group ของครูคือ vellumsrc — เป็นแค่ชื่อ · ค่าสำคัญ: end_frame ต้องเท่ากับเฟรมที่ pose_blend ถึงปลาย (96)", "visual": "", "code": "// Petal state (tutorial 13:33-14:54). Runs at the TIME-SHIFTED frame: the loop's Time Shift is downstream of this node.\nint ef = chi(\"end_frame\");\ni@group_anim = @Frame \u003c ef;\ni@group_volume_source = @Frame == ef;\n"}, {"id": "eb-vex-upper-shaft", "title": "Upper-shaft joint group (stand-in for a hand selection)", "lang": "vex", "context": "Attribute Wrangle · Points · หลัง rig_doctor", "tested": "Houdini 21.0.671", "filename": "upper_shaft_group.vfl", "description": "ครูเลือกข้อต่อครึ่งบนของก้านกลีบด้วยมือที่ 6:48 เราใช้ -P.z > 0.55 บน group shaft แทน เพื่อให้ rigpose ท่า B หมุนปลายกลีบ (r3x 7.5°)", "notes": "กลีบวางตามแกน -Z (โคน 0 → ปลาย -1) ถ้าเส้นกลีบยาวไม่เท่านี้ต้องปรับ 0.55", "visual": "", "code": "// manual-selection stand-in: upper half of the main shaft (tutorial 6:48 picks these points by hand)\ni@group_upper_shaft = (i@group_shaft==1 && -@P.z > 0.55) ? 1 : 0;\n"}, {"id": "eb-vex-stem-curve", "title": "AI-drawn stem guide curve", "lang": "vex", "context": "Attribute Wrangle · Detail (ไม่ต่อ input)", "tested": "Houdini 21.0.671", "filename": "stem_curve_ai.vfl", "description": "polyline 7 จุดจาก (0,0,0) ขึ้นไป (0,3,0) แทนเส้นก้านที่ครูวาดมือ (15:34) ใช้เมื่อ INPUT_CURVES = \"ai\"; โหมด asset ใช้ curve3 ของ Entagma แทน (กลีบจะตกสั้นกว่าของครู ~10% ถ้าใช้เส้นนี้)", "notes": "ก้านวิ่งโคน→หัว ส่วนเส้นของครูวิ่งหัว→โคน จึงมี reverse ให้ และ carve ตัด 3.4% ที่ปลายหัวแทน", "visual": "", "code": "// Stem guide curve (AI-drawn approximation; tutorial draws it by hand at 15:34). Bottom (0,0,0) -> flower end.\nint N=6; int pr=addprim(0,\"polyline\");\nvector pts[] = {{0,0,0},{0.05,0.5,0.02},{0.22,1.0,0.0},{0.35,1.55,-0.06},{0.30,2.1,-0.02},{0.12,2.6,0.03},{0.0,3.0,0.0}};\nforeach(vector p; pts){ int pt=addpoint(0,p); addvertex(0,pr,pt);}\n"}, {"id": "eb-vex-two-sided", "title": "Two-sided petal colour (inner warm / outer violet)", "lang": "vex", "context": "Attribute Wrangle · Points · หลัง merge ของ shell 2 ชั้น (i@inner)", "tested": "Houdini 21.0.671", "filename": "petal_look_color_two_sided.vfl", "description": "look ของ AI ก่อนใช้ material ของ Entagma (PETAL_SHELL_src = 0): ไล่สีจาก uv.y (0 โคน → 1 ปลาย) แยกหน้าใน/หน้านอก แล้ว pow 2.2 ให้เป็น linear — วัดแล้วว่า ~95% ของหน้ากลีบหันเข้าแกนดอก", "notes": "สีที่เขียนเป็น sRGB แล้ว pow(2.2) — ถ้าไม่ทำ กลีบจะซีด (เคยวินิจฉัยผิดเป็นเรื่องไฟ) · เส้นใบย้ายไป shader (st.x*90 → 1-|sin| ^4 ×0.35) เพราะ point Cd ~775 จุด/กลีบ ละเอียดไม่พอสำหรับ 65 เส้น", "visual": "", "code": "// Two-sided petal look (EB-107). Measured: ~95% of head faces have their normal pointing TOWARD the flower axis,\n// so \"inner\" = the shell offset along +N, \"outer\" = the shell offset along -N with flipped winding. Colours authored sRGB -> linear.\nfloat v = clamp(v@uv.y, 0, 1);              // feather uv.y: 0 = petal base, 1 = tip\nvector c;\nif (i@inner) {      // reference: inner faces glow yellow-orange -> red -> magenta, violet only at the very tip\n    vector a = {1.00, 0.80, 0.28}, b = {1.00, 0.42, 0.10}, m = {0.92, 0.18, 0.42}, t = {0.55, 0.40, 1.00};\n    c = v \u003c 0.45 ? lerp(a, b, smooth(0.0, 0.45, v)) : v \u003c 0.75 ? lerp(b, m, smooth(0.45, 0.75, v)) : lerp(m, t, smooth(0.75, 1.0, v));\n} else {            // outer faces: previous v031 ramp\n    vector base = {1.00, 0.70, 0.20}, mid = {0.95, 0.25, 0.25}, body = {0.42, 0.36, 1.00}, tip = {0.62, 0.56, 1.00};\n    c = v \u003c 0.38 ? lerp(base, mid, smooth(0.18, 0.38, v)) : v \u003c 0.6 ? lerp(mid, body, smooth(0.38, 0.6, v)) : lerp(body, tip, smooth(0.6, 1.0, v));\n}\n// veins moved to the MaterialX shader (EB-110): point Cd aliased ~65 stripes/petal away\nv@Cd = pow(c, 2.2);\n"}, {"id": "eb-vex-backdrop", "title": "Navy backdrop sphere gradient", "lang": "vex", "context": "Attribute Wrangle · Points · บน sphere ที่ reverse แล้ว", "tested": "Houdini 21.0.671", "filename": "backdrop_gradient.vfl", "description": "ไล่สี navy เข้มลงมาด้านซ้ายล่าง ใช้กับ rig ไฟของเรา (LOOK_RIG_src = 0) · rig ของ Entagma ไม่มี backdrop (prune ออก, dome 0)", "notes": "Karma PNG เก็บ dome เป็น alpha 0 → viewer เห็นพื้นขาว ถ้าอยากเห็นพื้นในภาพต้องมี backdrop emissive หรือ composite ทับดำ", "visual": "", "code": "// intro 0:00-0:20 background: deep navy, slightly lifted toward lower-left, near black upper-right\nvector d = normalize(@P - {0,3,0});\nfloat g = clamp(0.5 - 0.5*d.y - 0.25*d.x, 0, 1);\nv@Cd = lerp({0.002,0.003,0.010}, {0.006,0.012,0.040}, g);\nv@N = -d;\n"}]}]}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script id="app-js">
(function(){
  // Pristine copy of this document (own scripts only), taken before rendering.
  // Saving regenerates the page from this + the new data, never from the live DOM.
  var PRISTINE = (function(){
    var root = document.documentElement.cloneNode(true);
    root.querySelectorAll("script").forEach(function(sc){
      var src = sc.getAttribute("src") || "";
      if (sc.id !== "lib-data" && sc.id !== "app-js" && src.indexOf("https://cdnjs.cloudflare.com/") !== 0) sc.remove();
    });
    return "<!doctype html>" + String.fromCharCode(10) + root.outerHTML;
  })();

  var DB = { techniques: [] };
  try { DB = JSON.parse(document.getElementById("lib-data").textContent); } catch(e) {}
  if (!DB.techniques) DB.techniques = [];

  var TYPES = ["Sop","Dop","Object","Lop","Cop","Vop","Top","Shelf","Other"];
  var TYPE_COLOR = {Sop:"#4F86CF", Dop:"#D8863E", Object:"#9277C4", Lop:"#4FA99F", Cop:"#C47DB5", Vop:"#C9A443", Top:"#7C8CF0", Shelf:"#7E8A96", Other:"#7E8A96"};
  var TYPE_TAG = {Sop:"SOP", Dop:"DOP", Object:"OBJ", Lop:"LOP", Cop:"COP", Vop:"VOP", Top:"TOP", Shelf:"SHF", Other:"—"};
  var LANG_LABEL = {python:"Python", vex:"VEX"};
  var artifactApi = null, assetsApi = null;
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); };
  var clone = function(o){ return JSON.parse(JSON.stringify(o)); };
  var today = function(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
  var uid = function(p){ return p + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); };

  var state = { q:"", tid:null, ver:{}, fid:null, mode:"view", draft:null, confirm:false, cat:null };
  try { var h=(location.hash||"").slice(1); if (h) state.tid=h; } catch(e){}
  if (!tech(state.tid)) state.tid = DB.techniques.length ? DB.techniques[0].id : null;

  function tech(id){ return DB.techniques.find(function(t){return t.id===id;}); }
  function lastVer(t){ return t.versions[t.versions.length-1]; }
  function verOf(t){ var v=state.ver[t.id]; return t.versions.find(function(x){return x.v===v;}) || lastVer(t); }
  function nextV(t){ var n=0; t.versions.forEach(function(x){ var k=parseInt(String(x.v).replace(/\D/g,""),10); if(k>n)n=k; }); return "v"+String(n+1).padStart(3,"0"); }
  function catOf(t){ return t.category || "Uncategorised"; }
  function matches(t){
    var q = state.q.trim().toLowerCase(); if (!q) return true;
    var hay = [t.name,t.category,t.type,t.author].concat(t.versions.map(function(v){
      return [v.notes].concat(v.files.map(function(f){return [f.title,f.description,f.notes,f.code].join(" ");})).join(" ");
    })).join("\n").toLowerCase();
    return hay.indexOf(q) >= 0;
  }
  function visible(){ return DB.techniques.filter(function(t){ return (!state.cat || catOf(t)===state.cat) && matches(t); }); }
  function curFile(){ var t=tech(state.tid); if(!t) return null; var v=verOf(t);
    if (!v.files.some(function(f){return f.id===state.fid;})) state.fid = v.files.length ? v.files[0].id : null;
    return v.files.find(function(f){return f.id===state.fid;}) || null; }

  // ---------------- diagrams (inline SVG, colours from theme tokens) ----------------
  function fig(body, caption){
    return '<figure class="visual"><div class="scroll">'+body+'</div>'+(caption?'<figcaption>'+caption+'</figcaption>':'')+'</figure>';
  }
  function network(nodes, wires, vw, vh){
    var W=170,H=40, byId={};
    nodes.forEach(function(n){ byId[n.id]=n; });
    function inPort(n,i){ var k=n.ins||1; return [n.x+W*(i+1)/(k+1), n.y]; }
    function outPort(n){ return [n.x+W/2, n.y+H]; }
    var g = wires.map(function(w){
      var a=outPort(byId[w[0]]), b=inPort(byId[w[1]], w[2]||0), dy=Math.max(30,(b[1]-a[1])*0.5);
      return '<path class="wire" d="M'+a[0]+' '+a[1]+' C'+a[0]+' '+(a[1]+dy)+' '+b[0]+' '+(b[1]-dy)+' '+b[0]+' '+b[1]+'"/>';
    }).join("");
    g += nodes.map(function(n){
      var ports='', k=n.ins||0;
      for (var i=0;i<k;i++){ var p=inPort(n,i); ports+='<circle class="port" cx="'+p[0]+'" cy="'+p[1]+'" r="3.5"/>'; }
      var o=outPort(n);
      return '<g class="node '+(n.cls||"")+'"><rect x="'+n.x+'" y="'+n.y+'" width="'+W+'" height="'+H+'" rx="5"/>'+
        '<rect class="flag" x="'+n.x+'" y="'+n.y+'" width="5" height="'+H+'" rx="2"/>'+
        '<text x="'+(n.x+14)+'" y="'+(n.y+17)+'" font-size="12.5" font-weight="500">'+esc(n.name)+'</text>'+
        '<text class="sub" x="'+(n.x+14)+'" y="'+(n.y+31)+'">'+esc(n.sub||"")+'</text>'+
        ports+'<circle class="port" cx="'+o[0]+'" cy="'+o[1]+'" r="3.5"/></g>';
    }).join("");
    return '<svg viewBox="0 0 '+vw+' '+vh+'" role="img" aria-label="Node network">'+g+'</svg>';
  }
  var VISUALS = {
    "rig-graph": function(){
      var nodes=[
        {id:"sim",  x:20,  y:14,  name:"SIM_NODE", sub:"live particles, every frame", cls:"io"},
        {id:"emit", x:300, y:14,  name:"EMITTER_NODE", sub:"optional, same space", cls:"io"},
        {id:"geo",  x:590, y:14,  name:"DEFORM_NODE", sub:"geometry in rest pose", cls:"io"},
        {id:"rest", x:20,  y:104, name:"follow_rest", sub:"timeshift → REST_FRAME", ins:1},
        {id:"info", x:300, y:104, name:"follow_sim_info", sub:"detail v@emitpos", ins:2},
        {id:"mark", x:110, y:194, name:"follow_mark_born", sub:"i@born, i@srcpt", ins:2},
        {id:"only", x:390, y:274, name:"follow_born_only", sub:"live points only", ins:1},

  var KINDS = [
    {kind:"categories", label:"Categories"}, {kind:"cards", label:"Techniques"}, {kind:"network", label:"Network View"},
    {kind:"parameters", label:"Parameters"}, {kind:"preview", label:"Preview"}, {kind:"notes", label:"Notes"}, {kind:"code", label:"Code"}
  ];
  var LAYOUT_KEY = "shelf.layout.v1";
  var nid = 0; function pid(){ return "p" + (++nid) + Math.floor(Math.random()*1e4).toString(36); }

  function split(dir, ratio, a, b){ return {id:pid(), t:"split", dir:dir, ratio:ratio, a:a, b:b}; }
  function defaultLayout(){
    return split("row", .17, leaf("categories"),
      split("row", .52, split("col", .6, leaf("cards"), leaf("network")),
        split("col", .36, leaf("preview"), split("col", .45, leaf("parameters"), leaf("code")))));
  }
  function validTree(n){ return n && (n.t==="leaf" ? KINDS.some(function(k){return k.kind===n.kind;}) : (n.t==="split" && validTree(n.a) && validTree(n.b))); }
  var tree = null;

  if (!tree) tree = defaultLayout();

  function saveLayout(){ try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(tree)); } catch(e){} }
  function countLeaves(n){ return n.t==="leaf" ? 1 : countLeaves(n.a)+countLeaves(n.b); }
  function mapTree(n, fn){ var r=fn(n); if (r!==undefined) return r; return n.t==="split" ? Object.assign({}, n, {a:mapTree(n.a,fn), b:mapTree(n.b,fn)}) : n; }
  function findNode(n, id){ if (n.id===id) return n; if (n.t!=="split") return null; return findNode(n.a,id) || findNode(n.b,id); }
  function removeLeaf(n, id){           // returns the tree without leaf id (its parent collapses to the sibling)
    if (n.t!=="split") return n;
    if (n.a.id===id) return n.b; if (n.b.id===id) return n.a;
    return Object.assign({}, n, {a:removeLeaf(n.a,id), b:removeLeaf(n.b,id)});

  function opSplit(id, dir){ tree = mapTree(tree, function(n){ if (n.id===id) return split(dir, .5, n, leaf(n.kind)); }); }

  function opKind(id, kind){ tree = mapTree(tree, function(n){ if (n.id===id) return Object.assign({}, n, {kind:kind}); }); }
  function opMove(src, target, zone){      // dock pane src on an edge of pane target (center = swap)
    if (src===target) return;

    if (zone==="center"){ var k=s.kind; opKind(src, tg.kind); opKind(target, k); return; }

    tree = removeLeaf(tree, src);

      var keys = Object.keys(groups).sort();
      if (!keys.length) return '<div class="canvas"><div class="empty">Nothing to show.</div></div>';
      return '<div class="canvas">'+keys.map(function(k){
        return '<div class="netbox"><h3>'+esc(k)+'</h3>'+groups[k].map(function(t){
          var sel = t.id===state.tid, cur = verOf(t).v;
          return '<div class="nrow"><button class="node" type="button" data-pick="'+esc(t.id)+'" aria-current="'+sel+'" style="--tc:'+(TYPE_COLOR[t.type]||"#7E8A96")+'"><i>'+esc(TYPE_TAG[t.type]||"—")+'</i>'+esc(t.name)+(sel?'':' <small>'+esc(cur)+'</small>')+'</button>'+
            (sel ? '<div class="vers">'+t.versions.map(function(v){ return '<button class="ver" type="button" data-ver="'+esc(v.v)+'" data-tid="'+esc(t.id)+'" aria-pressed="'+(v.v===cur)+'">'+esc(v.v)+'</button>'; }).join("")+'</div>' : '')+'</div>';
        }).join("")+'</div>';
      }).join("")+'</div>';
    },
    parameters: function(){
      var t = tech(state.tid); if (!t) return '<div class="empty">Pick a technique.</div>';
      var v = verOf(t), multi = t.versions.length>1;
      return '<div class="parms"><h2 class="ptitle">'+esc(t.name)+'</h2>'+
        '<label>Category</label><div class="v">'+esc(catOf(t))+'</div>'+
        '<label>Type</label><div class="v">'+esc(t.type||"—")+'</div>'+
        '<label>Version</label><button class="pselect" type="button" data-vermenu="'+esc(t.id)+'" aria-haspopup="listbox" aria-expanded="false" aria-label="Version"><span>'+esc(v.v)+'</span>'+CHEV+'</button>'+
        '<label>Updated</label><div class="v">'+esc(v.date||"—")+'</div>'+
        '<label>Author</label><div class="v">'+esc(t.author||"—")+'</div>'+
        '<label>Files</label><div class="v">'+v.files.length+'</div>'+
        (artifactApi ? '<span></span><div class="actions"><button class="btn small" type="button" data-act="edit">Edit '+esc(v.v)+'</button><button class="btn small" type="button" data-act="newver">New version</button><button class="btn small danger" type="button" data-act="del">Delete…</button></div>' : '')+
        (state.confirm ? '<div class="confirm">'+(multi ? 'Delete '+esc(v.v)+'? The other versions stay.' : 'Delete “'+esc(t.name)+'” and its only version?')+
          ' <button class="btn small danger" type="button" data-act="delyes">Delete</button><button class="btn small" type="button" data-act="delno">Keep it</button></div>' : '')+
        '</div>';
    },
    preview: function(){ var t = tech(state.tid); return t ? '<div class="preview">'+previewHtml(verOf(t))+'</div>' : '<div class="empty">Pick a technique.</div>'; },
    notes: function(){ var t = tech(state.tid); if (!t) return '<div class="empty">Pick a technique.</div>'; var v=verOf(t);
      return v.notes ? '<p class="notes">'+esc(v.notes)+'</p>' : '<div class="empty">No notes for '+esc(v.v)+'.</div>'; },
    code: function(){
      var t = tech(state.tid); if (!t) return '<div class="empty">Pick a technique.</div>';
      var v = verOf(t), f = curFile();
      if (!f) return '<div class="empty">'+esc(v.v)+' has no files.</div>';
      var inPreview = !v.previewImage && (v.previewVisual || (v.files.find(function(x){return x.visual && VISUALS[x.visual];})||{}).visual) === f.visual;
      return '<div class="ftabs" role="tablist">'+v.files.map(function(x){
          return '<button class="ftab" type="button" role="tab" data-file="'+esc(x.id)+'" aria-selected="'+(x.id===f.id)+'">'+esc(x.filename||x.title||"Untitled")+'<em>'+esc(LANG_LABEL[x.lang]||x.lang)+'</em></button>';
        }).join("")+'</div>'+
        '<div class="fbody">'+
          '<div class="fmeta"><span>'+esc(f.title||"")+'</span><span>Paste into '+esc(f.context||"—")+'</span><span>Tested on '+esc(f.tested||"—")+'</span></div>'+
          (f.description ? '<p class="fdesc">'+esc(f.description)+'</p>' : '')+
          (f.visual && VISUALS[f.visual] && !inPreview ? VISUALS[f.visual]() : '')+
          (f.notes ? '<p class="fnotes">'+esc(f.notes)+'</p>' : '')+
          '<div class="codebox"><div class="codebar"><span>'+esc(f.filename||(f.lang==="vex"?"snippet.vfl":"snippet.py"))+'</span>'+
            '<button class="btn small" type="button" data-copy="1">Copy code</button></div>'+
            '<pre><code data-code="1" class="language-'+(f.lang==="vex"?"c":"python")+'"></code></pre></div></div>';
    }
  };

  // ---------------- editor ----------------
  function blankFile(){ return {id:uid("f"),title:"",lang:"python",context:"Python Shell",tested:"",filename:"",description:"",notes:"",code:"",visual:""}; }
  function openEditor(kind){
    var t = tech(state.tid), d;
    if (kind==="new") d = {kind:kind, tech:{id:uid("t"),name:"",category:"",type:"Sop",author:"Plug",versions:[]}, ver:{v:"v001",date:today(),notes:"",previewImage:"",previewVisual:"",files:[blankFile()]}};
    else if (kind==="newver"){ var base=clone(verOf(t)); base.v=nextV(t); base.date=today(); base.files.forEach(function(f){ f.id=uid("f"); }); d={kind:kind, tech:clone(t), ver:base}; }
    else d = {kind:kind, tech:clone(t), ver:clone(verOf(t))};
    state.draft = d; state.mode = "edit"; state.confirm = false; renderEditor();
  }
  function fileCard(f, i){
    var p = "f"+i+"-";
    return '<div class="card" data-idx="'+i+'"><div class="fhead"><h3>File '+(i+1)+'</h3><button class="btn small danger" type="button" data-rmfile="'+i+'">Remove file</button></div>'+
      '<div class="row">'+
        '<label for="'+p+'title">Title<input id="'+p+'title" data-k="title" value="'+esc(f.title)+'"></label>'+
        '<label for="'+p+'lang">Language<select id="'+p+'lang" data-k="lang"><option value="python"'+(f.lang==="python"?" selected":"")+'>Python</option><option value="vex"'+(f.lang==="vex"?" selected":"")+'>VEX</option></select></label>'+
        '<label for="'+p+'context">Where to paste<input id="'+p+'context" data-k="context" placeholder="Python Shell / Attribute Wrangle, Points" value="'+esc(f.context)+'"></label>'+
        '<label for="'+p+'tested">Tested on<input id="'+p+'tested" data-k="tested" placeholder="Houdini 21.0.671" value="'+esc(f.tested)+'"></label>'+
        '<label for="'+p+'filename">File name<input id="'+p+'filename" data-k="filename" placeholder="my_tool.py" value="'+esc(f.filename)+'"></label>'+
      '</div>'+
      '<label for="'+p+'description">What it does<textarea id="'+p+'description" data-k="description" rows="2">'+esc(f.description)+'</textarea></label>'+
      '<label for="'+p+'notes">Notes / gotchas<textarea id="'+p+'notes" data-k="notes" rows="2">'+esc(f.notes)+'</textarea></label>'+
      '<label for="'+p+'code">Code<textarea id="'+p+'code" data-k="code" class="code" spellcheck="false">'+esc(f.code)+'</textarea></label></div>';
  }
  function renderEditor(){
    var d = state.draft, t = d.tech, v = d.ver;
    var title = d.kind==="new" ? "New technique" : d.kind==="newver" ? "New version "+v.v+" of “"+t.name+"”" : "Edit “"+t.name+"” "+v.v;
    var cats = Array.from(new Set(DB.techniques.map(function(x){return x.category;}).filter(Boolean))).sort();
    $("main").innerHTML =
      '<form class="editor" id="edForm" novalidate>'+
        '<div class="dhead"><h2>'+esc(title)+'</h2></div>'+
        '<div class="card"><h3>Technique</h3><div class="row">'+
          '<label for="t-name">Name<input id="t-name" required value="'+esc(t.name)+'"></label>'+
          '<label for="t-cat">Category<input id="t-cat" list="t-cats" placeholder="Particles / Pyro / RBD…" value="'+esc(t.category)+'"><datalist id="t-cats">'+cats.map(function(c){return '<option value="'+esc(c)+'">';}).join("")+'</datalist></label>'+
          '<label for="t-type">Type<select id="t-type">'+TYPES.map(function(x){return '<option'+(x===t.type?" selected":"")+'>'+x+'</option>';}).join("")+'</select></label>'+
          '<label for="t-author">Author<input id="t-author" value="'+esc(t.author)+'"></label>'+
        '</div></div>'+
        '<div class="card"><h3>Version '+esc(v.v)+'</h3>'+
          '<label for="v-notes">Notes (อะไรเปลี่ยนใน version นี้, วิธีใช้)<textarea id="v-notes" rows="4">'+esc(v.notes)+'</textarea></label>'+
          '<div class="drop" id="drop">'+
            (v.previewImage ? '<img src="/_blob/'+esc(v.previewImage)+'" alt="Preview">' : '<span>Preview: '+(v.previewVisual||"auto diagram / none")+'</span>')+
            (assetsApi ? '<label for="v-img" class="btn small" style="flex-direction:row">Choose image<input id="v-img" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label><span>หรือกด Ctrl+V เพื่อ paste ภาพหน้าจอ</span>' : '<span>(ต้องเป็นเจ้าของหน้านี้ถึงจะอัปโหลดภาพได้)</span>')+
            (v.previewImage ? '<button class="btn small" type="button" id="rmImg">Remove image</button>' : '')+
          '</div>'+
        '</div>'+
        '<div id="files">'+v.files.map(fileCard).join("")+'</div>'+
        '<div><button class="btn" type="button" id="addFile">+ Add file</button></div>'+
        '<div class="formbar"><span class="status" id="edStatus">Save เผยแพร่หน้านี้เป็นเวอร์ชันใหม่</span>'+
          '<span class="actions"><button class="btn" type="button" id="cancelBtn">Cancel</button><button class="btn primary" type="submit" id="saveBtn">Save</button></span></div>'+
      '</form>';
    $("files").querySelectorAll("textarea.code").forEach(function(ta){
      ta.addEventListener("keydown", function(e){ if (e.key==="Tab" && !e.shiftKey){ e.preventDefault(); var a=ta.selectionStart,b=ta.selectionEnd; ta.value=ta.value.slice(0,a)+"    "+ta.value.slice(b); ta.selectionStart=ta.selectionEnd=a+4; } });
    });
    var imgInput = $("v-img");
    if (imgInput) imgInput.addEventListener("change", function(){ if (imgInput.files[0]) uploadPreview(imgInput.files[0]); });
    $("edForm").addEventListener("submit", function(e){ e.preventDefault(); commitDraft(); });
  }
  function readForm(){
    var d = state.draft;
    d.tech.name = $("t-name").value.trim(); d.tech.category = $("t-cat").value.trim();
    d.tech.type = $("t-type").value; d.tech.author = $("t-author").value.trim();
    d.ver.notes = $("v-notes").value.trim();
    $("files").querySelectorAll(".card").forEach(function(card){
      var f = d.ver.files[+card.dataset.idx];
      card.querySelectorAll("[data-k]").forEach(function(el){ f[el.dataset.k] = el.value; });
    });
  }
  function uploadPreview(file){
    if (!assetsApi) return;
    readForm();
    var st = $("edStatus"); st.className="status"; st.textContent="Uploading image…";
    assetsApi.upload(file).then(function(r){
      state.draft.ver.previewImage = r.id; renderEditor(); $("edStatus").textContent="Image attached — press Save to keep it.";
    }, function(err){
      var c = err && err.code;
      st.className="status err";
      st.textContent = c==="too_large" ? "Image is over 20 MB — use a smaller screenshot." : c==="unsupported_type" ? "Use a PNG, JPEG, WebP or GIF image." : "Upload failed ("+(c||"error")+").";
    });
  }
  function commitDraft(){
    readForm();
    var d = state.draft, st = $("edStatus");
    if (!d.tech.name){ st.className="status err"; st.textContent="Give the technique a name."; $("t-name").focus(); return; }
    d.ver.files = d.ver.files.map(function(f){ f.code = String(f.code||"").replace(/\s+$/,"") + "\n"; return f; });
    var next = clone(DB);
    var existing = next.techniques.find(function(x){return x.id===d.tech.id;});
    if (!existing){ d.tech.versions = [d.ver]; next.techniques.push(d.tech); }
    else {
      existing.name=d.tech.name; existing.category=d.tech.category; existing.type=d.tech.type; existing.author=d.tech.author;
      var i = existing.versions.findIndex(function(x){return x.v===d.ver.v;});
      if (i>=0) existing.versions[i]=d.ver; else existing.versions.push(d.ver);
    }
    save(next, d.tech.id, st, $("saveBtn"));
  }

  // ---------------- save (republish the whole page from data) ----------------
  function buildDoc(next){
    var json = JSON.stringify(next).replace(/</g,"\\u003c");
    var start = PRISTINE.indexOf('<script id="lib-data" type="application/json">');
    var open = PRISTINE.indexOf(">", start) + 1;
    var close = PRISTINE.indexOf("<\/script>", open);
    return PRISTINE.slice(0, open) + json + PRISTINE.slice(close);
  }
  function save(next, tid, statusEl, btn){
    if (!artifactApi) return;
    if (btn) btn.disabled = true;
    if (statusEl){ statusEl.className="status"; statusEl.textContent="Saving…"; }
    try { history.replaceState(null,"", tid ? "#"+tid : location.pathname); } catch(e){}
    artifactApi.publish(buildDoc(next)).then(function(){
      if (statusEl) statusEl.textContent = "Saved.";
    }, function(err){
      if (btn) btn.disabled = false;
      var code = err && err.code;
      var msg = code==="conflict" ? "A newer version was saved elsewhere — the page is reloading to it; redo this edit."
        : (code==="not_writer"||code==="not_granted") ? "You can view this shelf but not edit it."
        : "Could not save ("+(code||"error")+"). Try again.";
      if (statusEl){ statusEl.className="status err"; statusEl.textContent=msg; }
    });
  }



  function renderView(){ renderBodies(); }
  function render(){
    var editing = state.mode==="edit" && state.draft;
    $("desk").hidden = !!editing; $("main").hidden = !editing;
    $("q").disabled = !!editing;
    if (editing) renderEditor(); else renderDesk();
  }

  // ---------------- pane drag & drop + dividers ----------------
  var guide = null, chip = null;
  function zoneFor(rect, x, y){
    var fx = (x-rect.left)/rect.width, fy = (y-rect.top)/rect.height;
    if (fx>.3 && fx<.7 && fy>.3 && fy<.7) return "center";
    var d = {left:fx, right:1-fx, top:fy, bottom:1-fy};
    return Object.keys(d).sort(function(a,b){ return d[a]-d[b]; })[0];
  }
  function guideRect(r, zone){
    if (zone==="left") return {left:r.left, top:r.top, width:r.width/2, height:r.height};
    if (zone==="right") return {left:r.left+r.width/2, top:r.top, width:r.width/2, height:r.height};
    if (zone==="top") return {left:r.left, top:r.top, width:r.width, height:r.height/2};
    if (zone==="bottom") return {left:r.left, top:r.top+r.height/2, width:r.width, height:r.height/2};
    return {left:r.left+6, top:r.top+6, width:r.width-12, height:r.height-12};
  }
  document.addEventListener("pointerdown", function(e){
    var g = e.target.closest("[data-grip]");
    if (g){
      e.preventDefault();
      var id = g.getAttribute("data-grip"), n = findNode(tree, id);
      dragging = {id:id, target:null, zone:null};
      var pane = document.querySelector('[data-pane="'+id+'"]'); if (pane) pane.classList.add("dragging");
      guide = document.createElement("div"); guide.className = "guide"; guide.hidden = true; document.body.appendChild(guide);
      chip = document.createElement("div"); chip.className = "chip"; chip.textContent = (KINDS.find(function(k){return k.kind===n.kind;})||{}).label || "Pane"; document.body.appendChild(chip);
      chip.style.left = e.clientX+"px"; chip.style.top = e.clientY+"px";
      return;
    }
    var dv = e.target.closest("[data-divider]");
    if (dv){
      e.preventDefault();
      var sid = dv.getAttribute("data-divider"), node = findNode(tree, sid), box = dv.parentElement, r = box.getBoundingClientRect();
      var a = box.children[0], b = box.children[2];
      dv.classList.add("drag");
      var move = function(ev){
        var ratio = node.dir==="row" ? (ev.clientX-r.left)/r.width : (ev.clientY-r.top)/r.height;
        ratio = Math.max(.08, Math.min(.92, ratio)); node.ratio = ratio;
        a.style.flex = ratio+" 1 0"; b.style.flex = (1-ratio)+" 1 0";
      };
      var up = function(){ dv.classList.remove("drag"); document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up); saveLayout(); };
      document.addEventListener("pointermove", move); document.addEventListener("pointerup", up);
    }
  });
  document.addEventListener("pointermove", function(e){
    if (!dragging) return;
    chip.style.left = Math.min(e.clientX, innerWidth - chip.offsetWidth - 24)+"px"; chip.style.top = Math.min(e.clientY, innerHeight - 40)+"px";
    var el = document.elementFromPoint(e.clientX, e.clientY), pane = el && el.closest("[data-pane]");
    var tid = pane && pane.getAttribute("data-pane");
    if (!pane || tid===dragging.id){ dragging.target=null; guide.hidden=true; return; }
    var r = pane.getBoundingClientRect(), z = zoneFor(r, e.clientX, e.clientY), gr = guideRect(r, z);
    dragging.target = tid; dragging.zone = z;
    guide.hidden = false; guide.style.left=gr.left+"px"; guide.style.top=gr.top+"px"; guide.style.width=gr.width+"px"; guide.style.height=gr.height+"px";
  });
  function endDrag(apply){
    if (!dragging) return;
    var d = dragging; dragging = null;
    if (guide) guide.remove(); if (chip) chip.remove(); guide = chip = null;
    if (apply && d.target){ opMove(d.id, d.target, d.zone); saveLayout(); }
    renderDesk();
  }
  document.addEventListener("pointerup", function(){ endDrag(true); });
  document.addEventListener("keydown", function(e){ if (e.key==="Escape" && dragging) endDrag(false); });

  // ---------------- clicks / changes ----------------
  document.addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    var d = b.dataset;
    if (d.kindmenu){
      var node = findNode(tree, d.kindmenu);
      if (menu && menu.anchor === b) { closeMenu(); return; }
      openMenu(b, KINDS.map(function(k){ return {value:k.kind, label:k.label}; }), node.kind, function(k){
        opKind(d.kindmenu, k); saveLayout(); renderDesk();
        var nb = document.querySelector('[data-kindmenu="'+d.kindmenu+'"]'); if (nb) nb.focus();
      });
      return;
    }
    if (d.vermenu){
      var tt0 = tech(d.vermenu); if (!tt0) return;
      if (menu && menu.anchor === b) { closeMenu(); return; }
      openMenu(b, tt0.versions.map(function(x){ return {value:x.v, label:x.v+(x.date?"   "+x.date:"")}; }), verOf(tt0).v, function(v){
        state.ver[d.vermenu]=v; state.confirm=false; state.fid=null; renderBodies();
      });
      return;
    }
    if (d.split){ opSplit(d.id, d.split); saveLayout(); renderDesk(); return; }
    if (d.close){ opClose(d.close); saveLayout(); renderDesk(); return; }
    if (d.max){ maximized = maximized ? null : d.max; renderDesk(); return; }
    if (d.cat!=null && b.classList.contains("cat")){ state.cat = d.cat || null; renderBodies(); return; }
    if (d.pick){ state.tid=d.pick; state.confirm=false; state.fid=null; try{history.replaceState(null,"","#"+state.tid);}catch(x){} renderBodies(); return; }
    if (d.ver && d.tid){ state.ver[d.tid]=d.ver; state.confirm=false; state.fid=null; renderBodies(); return; }
    if (d.file){ state.fid=d.file; renderBodies(); return; }
    if (d.copy){
      var f = curFile(); if (!f) return;
      var ok=function(){ b.textContent="Copied"; b.classList.add("done"); setTimeout(function(){ b.textContent="Copy code"; b.classList.remove("done"); },1600); };
      var fallback=function(){ var c=b.closest(".codebox").querySelector("code"); var r=document.createRange(); r.selectNodeContents(c); var s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="Selected, press Ctrl+C"; };
      try { navigator.clipboard.writeText(f.code).then(ok, fallback); } catch(x){ fallback(); }
      return;
    }
    if (d.act==="edit"){ openEditor("edit"); render(); return; }
    if (d.act==="newver"){ openEditor("newver"); render(); return; }
    if (d.act==="del"){ state.confirm=true; renderBodies(); return; }
    if (d.act==="delno"){ state.confirm=false; renderBodies(); return; }
    if (d.act==="delyes"){
      var tt=tech(state.tid), vv=verOf(tt), next=clone(DB), nt=next.techniques.find(function(x){return x.id===tt.id;});
      if (nt.versions.length>1) nt.versions = nt.versions.filter(function(x){return x.v!==vv.v;});
      else next.techniques = next.techniques.filter(function(x){return x.id!==tt.id;});
      b.disabled=true; b.textContent="Deleting…";
      save(next, next.techniques.some(function(x){return x.id===tt.id;}) ? tt.id : "", null, b);
      return;
    }
    if (d.rmfile!=null){ readForm(); state.draft.ver.files.splice(+d.rmfile,1); renderEditor(); return; }
    switch (b.id){
      case "newTech": openEditor("new"); render(); break;
      case "resetLayout": tree = defaultLayout(); maximized = null; saveLayout(); renderDesk(); break;
      case "addFile": readForm(); state.draft.ver.files.push(blankFile()); renderEditor(); break;
      case "rmImg": readForm(); state.draft.ver.previewImage=""; renderEditor(); break;
      case "cancelBtn": state.mode="view"; state.draft=null; render(); break;
    }
  });
  document.addEventListener("change", function(e){
    var s = e.target;
  });
  document.addEventListener("paste", function(e){
    if (state.mode!=="edit" || !assetsApi) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i=0;i<items.length;i++){ if (items[i].type.indexOf("image/")===0){ var file=items[i].getAsFile(); if (file){ e.preventDefault(); uploadPreview(file); return; } } }
  });
  $("q").addEventListener("input", function(e){ state.q=e.target.value; renderBodies(); });

  render();

  if (window.claude && window.claude.use){
    window.claude.use("artifact").then(function(api){
      if (!api) return;
      artifactApi = api; $("newTech").hidden = false;
      if (state.mode==="view") renderBodies();
    }, function(){});
    window.claude.use("assets").then(function(api){ assetsApi = api || null; if (state.mode==="edit" && $("edForm")) { readForm(); renderEditor(); } }, function(){});
  }
})();
</script>
